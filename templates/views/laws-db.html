<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-3 md:p-4 space-y-3 md:space-y-4 bg-bg" id="view-laws-db">

    <!-- Hero 区域 -->

        <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/2 blur-3xl"></div>
        <div class="absolute bottom-0 left-1/3 w-48 h-48 bg-white/5 rounded-full translate-y-1/2 blur-2xl"></div>
        <div class="relative z-10">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                    <button class="flex items-center gap-1.5 px-3 py-2 bg-white text-emerald-600 hover:bg-white/90 rounded-lg text-xs font-medium transition-all duration-300 hover:-translate-y-0.5 shadow-lg shadow-emerald-500/20">

            <div class="md:col-span-3">
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">制定机关</label>

                    <select id="laws-db-organ" class="appearance-none w-full bg-bg-subtle border border-bg-border rounded-xl px-4 py-2.5 pr-9 text-sm text-fg-secondary focus:outline-none focus:border-emerald-500 focus:bg-white focus:ring-2 focus:ring-emerald-500/10 transition-all duration-200 cursor-pointer hover:border-emerald-500/40">
