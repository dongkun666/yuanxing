<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-4 md:p-6 bg-bg" id="view-payment">
<div class="max-w-3xl mx-auto w-full space-y-4 md:space-y-5">
    <!-- 返回按钮 -->
    <button class="flex items-center gap-1 text-xs text-fg-secondary hover:text-brand transition-colors group" onclick="backToSubscription()" data-animate="fade-in-up" data-delay="0">
        <iconify-icon icon="mdi:arrow-left" class="group-hover:-translate-x-0.5 transition-transform"></iconify-icon>
        <span>返回订阅方案</span>
    </button>

    <!-- 订单摘要 -->
    <div class="ws-card p-5 md:p-6 relative overflow-hidden" data-animate="fade-in-up" data-delay="0.05">
        <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-brand/5 to-transparent rounded-full -translate-y-1/2 translate-x-1/2"></div>
        <div class="absolute bottom-0 left-0 w-24 h-24 bg-gradient-to-tr from-wiki/5 to-transparent rounded-full translate-y-1/2 -translate-x-1/2"></div>
        <div class="relative z-10">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-brand to-brand-hover flex items-center justify-center shadow-md shadow-brand/20">
                    <iconify-icon icon="mdi:receipt-text-outline" class="text-white text-sm"></iconify-icon>
                </div>
                <div>
                    <h3 class="text-base font-bold text-fg-primary">订单确认</h3>
                    <p class="text-[11px] text-fg-tertiary">请核对您的订单信息</p>
                </div>
            </div>
            <div class="space-y-3">
                <div class="flex items-center justify-between p-3 md:p-4 rounded-xl bg-gradient-to-r from-brand-tint3/50 to-wiki/5 border border-brand-tint2/50">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 md:w-12 md:h-12 rounded-xl bg-gradient-to-br from-brand to-wiki flex items-center justify-center shadow-md shadow-brand/20 group-hover:scale-110 transition-transform">
                            <iconify-icon class="text-xl text-white" icon="mdi:crown"></iconify-icon>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-fg-primary" id="payment-plan-name">专业版 · 月付</p>
                            <p class="text-xs text-fg-tertiary" id="payment-plan-desc">最适合个人律师</p>
                            <div class="flex items-center gap-1.5 mt-1">
                                <span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 bg-brand-tint text-brand text-[10px] font-semibold rounded">
                                    <iconify-icon icon="mdi:check" class="text-[10px]"></iconify-icon>
                                    全部功能
                                </span>
                                <span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 bg-success-tint text-success text-[10px] font-semibold rounded">
                                    <iconify-icon icon="mdi:check" class="text-[10px]"></iconify-icon>
                                    随时取消
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xl md:text-2xl font-bold bg-gradient-to-r from-brand to-wiki bg-clip-text text-transparent" id="payment-amount">¥299</p>
                        <p class="text-[10px] text-fg-tertiary">/月</p>
                    </div>
                </div>
            </div>
            <div class="pt-4 mt-4 border-t border-bg-border/50 space-y-2">
                <div class="flex justify-between text-xs text-fg-secondary">
                    <span>小计</span>
                    <span id="payment-subtotal">¥299</span>
                </div>
                <div class="flex justify-between text-xs text-fg-secondary">
                    <span>优惠</span>
                    <span class="text-success font-medium" id="payment-discount">-¥0</span>
                </div>
                <div class="flex justify-between items-center pt-3 mt-2 border-t border-bg-border/50">
                    <span class="text-sm font-semibold text-fg-primary">合计</span>
                    <span class="text-xl font-bold bg-gradient-to-r from-brand to-wiki bg-clip-text text-transparent" id="payment-total">¥299</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 支付方式 -->
    <div class="ws-card p-5 md:p-6" data-animate="fade-in-up" data-delay="0.15">
        <div class="flex items-center gap-2 mb-4">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-success to-green-500 flex items-center justify-center shadow-md shadow-success/20">
                <iconify-icon icon="mdi:credit-card-multiple-outline" class="text-white text-sm"></iconify-icon>
            </div>
            <div>
                <h3 class="text-base font-bold text-fg-primary">选择支付方式</h3>
                <p class="text-[11px] text-fg-tertiary">安全便捷的支付渠道</p>
            </div>
        </div>
        <div class="space-y-2.5">
            <label class="payment-method-card relative flex items-center gap-3 p-4 rounded-xl border-2 border-brand bg-gradient-to-r from-brand-tint3/50 to-brand-tint/30 cursor-pointer payment-method group transition-all duration-300 hover:shadow-lg hover:shadow-brand/10" onclick="selectPaymentMethod(this, 'alipay')">
                <div class="absolute inset-0 rounded-xl bg-gradient-to-r from-brand/5 to-wiki/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative z-10 w-5 h-5 rounded-full border-2 border-brand flex items-center justify-center flex-shrink-0">
                    <div class="w-2.5 h-2.5 rounded-full bg-gradient-to-br from-brand to-brand-hover"></div>
                </div>
                <div class="relative z-10 flex items-center gap-3 flex-1">
                    <div class="w-11 h-11 rounded-xl bg-white flex items-center justify-center shadow-sm border border-bg-border/50 group-hover:scale-110 transition-transform">
                        <iconify-icon class="text-2xl text-[#1677FF]" icon="mdi:alipay"></iconify-icon>
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-fg-primary">支付宝支付</p>
                        <p class="text-xs text-fg-tertiary">数亿用户信赖的支付方式</p>
                    </div>
                </div>
                <span class="relative z-10 ml-auto text-[10px] bg-gradient-to-r from-brand to-brand-hover text-white font-semibold px-2.5 py-1 rounded-full shadow-md shadow-brand/20">推荐</span>
            </label>
            <label class="payment-method-card relative flex items-center gap-3 p-4 rounded-xl border-2 border-bg-border hover:border-brand/50 cursor-pointer payment-method group transition-all duration-300 hover:shadow-lg hover:shadow-brand/5" onclick="selectPaymentMethod(this, 'wechat')">
                <div class="absolute inset-0 rounded-xl bg-gradient-to-r from-brand/5 to-wiki/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative z-10 w-5 h-5 rounded-full border-2 border-bg-border flex items-center justify-center flex-shrink-0 group-hover:border-brand/50 transition-colors"></div>
                <div class="relative z-10 flex items-center gap-3 flex-1">
                    <div class="w-11 h-11 rounded-xl bg-white flex items-center justify-center shadow-sm border border-bg-border/50 group-hover:scale-110 transition-transform">
                        <iconify-icon class="text-2xl text-[#07C160]" icon="mdi:wechat"></iconify-icon>
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-fg-primary">微信支付</p>
                        <p class="text-xs text-fg-tertiary">便捷的移动支付方式</p>
                    </div>
                </div>
            </label>
            <label class="payment-method-card relative flex items-center gap-3 p-4 rounded-xl border-2 border-bg-border hover:border-brand/50 cursor-pointer payment-method group transition-all duration-300 hover:shadow-lg hover:shadow-brand/5" onclick="selectPaymentMethod(this, 'unionpay')">
                <div class="absolute inset-0 rounded-xl bg-gradient-to-r from-brand/5 to-wiki/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative z-10 w-5 h-5 rounded-full border-2 border-bg-border flex items-center justify-center flex-shrink-0 group-hover:border-brand/50 transition-colors"></div>
                <div class="relative z-10 flex items-center gap-3 flex-1">
                    <div class="w-11 h-11 rounded-xl bg-white flex items-center justify-center shadow-sm border border-bg-border/50 group-hover:scale-110 transition-transform">
                        <iconify-icon class="text-2xl text-[#E6000F]" icon="mdi:credit-card-outline"></iconify-icon>
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-fg-primary">银联支付</p>
                        <p class="text-xs text-fg-tertiary">支持所有银联卡支付</p>
                    </div>
                </div>
            </label>
        </div>
    </div>

    <!-- 优惠券 -->
    <div class="ws-card p-5 md:p-6" data-animate="fade-in-up" data-delay="0.25">
        <div class="flex items-center gap-2 mb-4">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-warning to-orange-500 flex items-center justify-center shadow-md shadow-warning/20">
                <iconify-icon icon="mdi:ticket-percent-outline" class="text-white text-sm"></iconify-icon>
            </div>
            <div>
                <h3 class="text-base font-bold text-fg-primary">优惠券</h3>
                <p class="text-[11px] text-fg-tertiary">输入优惠码享受折扣</p>
            </div>
        </div>
        <div class="flex gap-2">
            <div class="relative flex-1">
                <iconify-icon icon="mdi:ticket-outline" class="absolute left-3 top-1/2 -translate-y-1/2 text-fg-tertiary text-base"></iconify-icon>
                <input type="text" class="form-input w-full pl-9 pr-3" id="coupon-input" placeholder="输入优惠码"/>
            </div>
            <button class="px-4 py-2 text-sm font-semibold rounded-xl border border-brand text-brand hover:bg-brand-tint transition-all duration-300 hover:-translate-y-0.5 hover:shadow-md hover:shadow-brand/10" onclick="applyCoupon()">
                使用
            </button>
        </div>
        <div id="coupon-message" class="mt-2 text-xs hidden"></div>
    </div>

    <!-- 安全提示 -->
    <div class="flex items-start gap-2.5 p-4 rounded-xl bg-gradient-to-r from-success-tint/50 to-green-50 border border-success/10" data-animate="fade-in-up" data-delay="0.35">
        <div class="w-7 h-7 rounded-lg bg-success/10 flex items-center justify-center flex-shrink-0">
            <iconify-icon icon="mdi:shield-lock-outline" class="text-success text-base"></iconify-icon>
        </div>
        <div class="flex-1">
            <p class="text-xs font-semibold text-green-800">支付安全保障</p>
            <p class="text-[11px] text-green-700 mt-0.5">您的支付信息由银行级 SSL 加密保护，我们不会存储您的银行卡信息。</p>
        </div>
    </div>

    <!-- 确认支付 -->
    <div class="ws-card p-5 md:p-6" data-animate="fade-in-up" data-delay="0.45">
        <div class="flex items-start gap-3">
            <input checked class="mt-0.5 w-4 h-4 accent-brand rounded" id="agree-terms" type="checkbox"/>
            <label class="text-xs text-fg-secondary leading-relaxed" for="agree-terms">
                我已阅读并同意 <a class="text-brand hover:underline font-medium" href="#" onclick="event.preventDefault(); alert('《LexPrime 服务协议》')">《服务协议》</a> 和 <a class="text-brand hover:underline font-medium" href="#" onclick="event.preventDefault(); alert('《自动续费条款》')">《自动续费条款》</a>，确认订阅后将自动续费，可随时取消。
            </label>
        </div>
        <button class="payment-btn w-full mt-5 py-3.5 text-sm font-bold rounded-xl bg-gradient-to-r from-brand to-brand-hover text-white hover:shadow-lg hover:shadow-brand/30 transition-all duration-300 hover:-translate-y-0.5 relative overflow-hidden group" onclick="handlePayment()" id="pay-button">
            <span class="relative z-10 flex items-center justify-center gap-2">
                <iconify-icon icon="mdi:lock-check-outline" class="text-base"></iconify-icon>
                确认支付 <span id="pay-button-amount" class="font-bold">¥299</span>
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-brand-hover to-wiki opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </button>
        <p class="text-center text-[10px] text-fg-tertiary mt-3 flex items-center justify-center gap-1">
            <iconify-icon icon="mdi:lock-outline" class="text-[10px]"></iconify-icon>
            支付安全由 <span class="font-medium text-fg-secondary">银联/支付宝/微信</span> 提供保障
        </p>
    </div>

    <!-- 支付处理中遮罩 -->
    <div class="fixed inset-0 z-[800] bg-black/40 backdrop-blur-sm flex items-center justify-center hidden" id="payment-loading-overlay">
        <div class="bg-white rounded-2xl p-8 text-center max-w-sm mx-4 shadow-2xl">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gradient-to-br from-brand-tint to-brand-tint2 flex items-center justify-center">
                <iconify-icon icon="mdi:loading" class="text-3xl text-brand animate-spin"></iconify-icon>
            </div>
            <h4 class="text-base font-bold text-fg-primary mb-1">支付处理中</h4>
            <p class="text-xs text-fg-tertiary mb-4">请稍候，正在处理您的支付...</p>
            <div class="w-full h-2 bg-bg rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-brand to-wiki rounded-full progress-bar-animate" style="width: 60%"></div>
            </div>
        </div>
    </div>
</div>
</div>
