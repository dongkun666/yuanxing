<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-6 bg-bg" id="view-payment">
<div class="max-w-3xl mx-auto w-full space-y-5">
<!-- 返回按钮 -->
<button class="flex items-center gap-1 text-xs text-fg-secondary hover:text-brand transition-colors" onclick="backToSubscription()">
<iconify-icon icon="mdi:arrow-left"></iconify-icon>
<span>返回订阅方案</span>
</button>
<!-- 订单摘要 -->
<div class="bg-white rounded-xl border border-bg-border p-6">
<h3 class="text-base font-semibold text-fg-primary">订单确认</h3>
<div class="mt-4 space-y-3">
<div class="flex items-center justify-between py-2">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-brand-tint3 flex items-center justify-center">
<iconify-icon class="text-lg text-brand" icon="mdi:star"></iconify-icon>
</div>
<div>
<p class="text-sm font-medium text-fg-primary" id="payment-plan-name">专业版 · 月付</p>
<p class="text-xs text-fg-tertiary" id="payment-plan-desc">最适合个人律师</p>
</div>
</div>
<p class="text-lg font-bold text-fg-primary" id="payment-amount">¥299</p>
</div>
<div class="pt-2 border-t border-[#F2F3F5]">
<div class="flex justify-between text-xs text-fg-tertiary">
<span>小计</span>
<span id="payment-subtotal">¥299</span>
</div>
<div class="flex justify-between text-xs text-fg-tertiary mt-1">
<span>优惠</span>
<span class="text-success" id="payment-discount">¥0</span>
</div>
<div class="flex justify-between text-sm font-semibold text-fg-primary mt-2 pt-2 border-t border-[#F2F3F5]">
<span>合计</span>
<span class="text-brand text-lg font-bold" id="payment-total">¥299</span>
</div>
</div>
</div>
</div>
<!-- 支付方式 -->
<div class="bg-white rounded-xl border border-bg-border p-6">
<h3 class="text-base font-semibold text-fg-primary">选择支付方式</h3>
<div class="mt-4 space-y-3">
<label class="flex items-center gap-3 p-4 rounded-lg border border-brand bg-brand-tint3 cursor-pointer payment-method" onclick="selectPaymentMethod(this, 'alipay')">
<div class="w-5 h-5 rounded-full border-2 border-brand flex items-center justify-center flex-shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-brand"></div>
</div>
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center border border-bg-border">
<iconify-icon class="text-xl text-[#1677FF]" icon="mdi:alipay"></iconify-icon>
</div>
<div>
<p class="text-sm font-medium text-fg-primary">支付宝支付</p>
<p class="text-xs text-fg-tertiary">数亿用户信赖的支付方式</p>
</div>
</div>
<span class="ml-auto text-[10px] bg-brand-tint text-brand font-semibold px-2 py-0.5 rounded">推荐</span>
</label>
<label class="flex items-center gap-3 p-4 rounded-lg border border-bg-border hover:border-brand cursor-pointer payment-method" onclick="selectPaymentMethod(this, 'wechat')">
<div class="w-5 h-5 rounded-full border-2 border-bg-border flex items-center justify-center flex-shrink-0"></div>
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center border border-bg-border">
<iconify-icon class="text-xl text-[#07C160]" icon="mdi:wechat"></iconify-icon>
</div>
<div>
<p class="text-sm font-medium text-fg-primary">微信支付</p>
<p class="text-xs text-fg-tertiary">便捷的移动支付方式</p>
</div>
</div>
</label>
<label class="flex items-center gap-3 p-4 rounded-lg border border-bg-border hover:border-brand cursor-pointer payment-method" onclick="selectPaymentMethod(this, 'unionpay')">
<div class="w-5 h-5 rounded-full border-2 border-bg-border flex items-center justify-center flex-shrink-0"></div>
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center border border-bg-border">
<iconify-icon class="text-xl text-[#E6000F]" icon="mdi:credit-card-outline"></iconify-icon>
</div>
<div>
<p class="text-sm font-medium text-fg-primary">银联支付</p>
<p class="text-xs text-fg-tertiary">支持所有银联卡支付</p>
</div>
</div>
</label>
</div>
</div>
<!-- 确认支付 -->
<div class="bg-white rounded-xl border border-bg-border p-6">
<div class="flex items-start gap-3">
<input checked="" class="mt-0.5 w-4 h-4 accent-[#165DFF]" id="agree-terms" type="checkbox"/>
<label class="text-xs text-fg-secondary" for="agree-terms">
                    我已阅读并同意 <a class="text-brand hover:underline" href="#" onclick="event.preventDefault(); alert('《LexPrime 服务协议》')">《服务协议》</a> 和 <a class="text-brand hover:underline" href="#" onclick="event.preventDefault(); alert('《自动续费条款》')">《自动续费条款》</a>，确认订阅后将自动续费，可随时取消。
                </label>
</div>
<button class="w-full mt-4 py-3 text-sm font-semibold rounded-lg bg-brand text-white hover:bg-brand-hover transition-colors" onclick="paySuccess()">
                确认支付 <span id="pay-button-amount">¥299</span>
</button>
</div>
</div>
</div>
<!-- 支付成功 -->
