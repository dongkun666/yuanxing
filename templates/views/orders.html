<div class="view-content hidden flex-1 flex flex-col overflow-y-auto bg-bg" id="view-orders">
<div class="max-w-6xl mx-auto w-full p-4 md:p-6 space-y-4 md:space-y-5">

<!-- 页面标题 -->
<div class="flex items-center justify-between" data-animate="fade-in-up" data-delay="0">
    <div>
        <h2 class="text-xl font-bold text-fg-primary">订单管理</h2>
        <p class="text-xs text-fg-tertiary mt-1">查看和管理您的所有订单记录</p>
    </div>
    <div class="hidden md:flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand to-brand-hover flex items-center justify-center shadow-md shadow-brand/20">
            <iconify-icon icon="mdi:receipt-text-outline" class="text-white text-lg"></iconify-icon>
        </div>
    </div>
</div>

<!-- 数据概览卡片 -->
<div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="orders-stats-container">
    <div class="ws-card p-3 md:p-4 group" data-animate="scale-in" data-stagger-group="orders-stats" data-stagger-index="0" data-delay="0.05">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] text-fg-tertiary">全部订单</span>
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-brand-tint to-brand-tint2 flex items-center justify-center group-hover:scale-110 transition-transform">
                <iconify-icon icon="mdi:receipt-text-outline" class="text-brand text-sm"></iconify-icon>
            </div>
        </div>
        <p class="text-xl md:text-2xl font-bold text-fg-primary tabular-nums" id="stat-total-orders">5</p>
        <p class="text-[10px] text-fg-tertiary mt-0.5">累计订单数量</p>
    </div>
    <div class="ws-card p-3 md:p-4 group" data-animate="scale-in" data-stagger-group="orders-stats" data-stagger-index="1" data-delay="0.05">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] text-fg-tertiary">本月新增</span>
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-green-100 to-success-tint flex items-center justify-center group-hover:scale-110 transition-transform">
                <iconify-icon icon="mdi:trending-up" class="text-success text-sm"></iconify-icon>
            </div>
        </div>
        <p class="text-xl md:text-2xl font-bold text-fg-primary tabular-nums" id="stat-month-orders">2</p>
        <p class="text-[10px] text-success mt-0.5 flex items-center gap-0.5">
            <iconify-icon icon="mdi:arrow-up" class="text-[10px]"></iconify-icon> 20%
        </p>
    </div>
    <div class="ws-card p-3 md:p-4 group" data-animate="scale-in" data-stagger-group="orders-stats" data-stagger-index="2" data-delay="0.05">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] text-fg-tertiary">待支付</span>
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-orange-100 to-warning-tint flex items-center justify-center group-hover:scale-110 transition-transform">
                <iconify-icon icon="mdi:clock-outline" class="text-urgent text-sm"></iconify-icon>
            </div>
        </div>
        <p class="text-xl md:text-2xl font-bold text-fg-primary tabular-nums" id="stat-pending-orders">1</p>
        <p class="text-[10px] text-fg-tertiary mt-0.5">待处理订单</p>
    </div>
    <div class="ws-card p-3 md:p-4 group" data-animate="scale-in" data-stagger-group="orders-stats" data-stagger-index="3" data-delay="0.05">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] text-fg-tertiary">已完成</span>
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-green-100 to-success-tint flex items-center justify-center group-hover:scale-110 transition-transform">
                <iconify-icon icon="mdi:check-circle" class="text-success text-sm"></iconify-icon>
            </div>
        </div>
        <p class="text-xl md:text-2xl font-bold text-fg-primary tabular-nums" id="stat-completed-orders">3</p>
        <p class="text-[10px] text-fg-tertiary mt-0.5">成功支付订单</p>
    </div>
    <div class="ws-card p-3 md:p-4 group col-span-2 md:col-span-1" data-animate="scale-in" data-stagger-group="orders-stats" data-stagger-index="4" data-delay="0.05">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] text-fg-tertiary">总收入</span>
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-purple-100 to-wiki-tint flex items-center justify-center group-hover:scale-110 transition-transform">
                <iconify-icon icon="mdi:cash-multiple" class="text-wiki text-sm"></iconify-icon>
            </div>
        </div>
        <p class="text-xl md:text-2xl font-bold text-fg-primary tabular-nums" id="stat-total-revenue">¥8,595</p>
        <p class="text-[10px] text-fg-tertiary mt-0.5">累计收入金额</p>
    </div>
</div>

<!-- 搜索筛选区域 -->
<div class="ws-card p-4" data-animate="fade-in-up" data-delay="0.3">
    <div class="flex flex-col md:flex-row md:items-center gap-3">
        <div class="relative flex-1">
            <iconify-icon icon="mdi:magnify" class="absolute left-3 top-1/2 -translate-y-1/2 text-fg-tertiary text-base"></iconify-icon>
            <input type="text" id="orders-search-input" placeholder="搜索订单号、套餐名称..." class="form-input w-full pl-9 pr-3"/>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <div class="relative">
                <select id="orders-status-filter" class="appearance-none form-input pr-8 pl-3 text-xs min-w-[100px]">
                    <option value="all">全部状态</option>
                    <option value="待支付">待支付</option>
                    <option value="处理中">处理中</option>
                    <option value="支付成功">已完成</option>
                    <option value="已取消">已取消</option>
                    <option value="已退款">已退款</option>
                </select>
                <iconify-icon class="absolute right-2 top-1/2 -translate-y-1/2 text-sm text-fg-tertiary pointer-events-none" icon="mdi:chevron-down"></iconify-icon>
            </div>
            <div class="relative">
                <select id="orders-date-filter" class="appearance-none form-input pr-8 pl-3 text-xs min-w-[100px]">
                    <option value="all">全部时间</option>
                    <option value="month">本月</option>
                    <option value="quarter">本季度</option>
                    <option value="year">本年</option>
                </select>
                <iconify-icon class="absolute right-2 top-1/2 -translate-y-1/2 text-sm text-fg-tertiary pointer-events-none" icon="mdi:chevron-down"></iconify-icon>
            </div>
            <button class="btn-primary flex items-center gap-1.5 py-2 px-4 text-xs" onclick="exportOrders()">
                <iconify-icon icon="mdi:download-outline" class="text-sm"></iconify-icon>
                <span>导出</span>
            </button>
        </div>
    </div>
</div>

<!-- 订单列表 -->
<div class="ws-card p-4 md:p-5" data-animate="fade-in-up" data-delay="0.4">
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand to-brand-hover flex items-center justify-center shadow-md shadow-brand/20">
                <iconify-icon icon="mdi:format-list-bulleted" class="text-white text-sm"></iconify-icon>
            </div>
            <div>
                <h3 class="font-bold text-sm text-fg-primary">订单列表</h3>
                <p class="text-[10px] text-fg-tertiary" id="orders-count">共 5 条记录</p>
            </div>
        </div>
    </div>

    <div id="orders-list" class="space-y-3">
    </div>

    <!-- 分页 -->
    <div class="flex items-center justify-between text-xs text-fg-tertiary mt-4 pt-4 border-t border-bg-border">
        <span id="orders-pagination-info">显示 1-5 条，共 5 条</span>
        <div class="flex gap-1">
            <button class="w-8 h-8 rounded-lg bg-bg-subtle hover:bg-bg text-fg-secondary flex items-center justify-center text-xs transition-colors" onclick="prevOrdersPage()">
                <iconify-icon icon="mdi:chevron-left" class="text-sm"></iconify-icon>
            </button>
            <button class="w-8 h-8 rounded-lg bg-brand text-white flex items-center justify-center text-xs font-medium shadow-md shadow-brand/20">1</button>
            <button class="w-8 h-8 rounded-lg hover:bg-bg-subtle flex items-center justify-center text-xs transition-colors">2</button>
            <button class="w-8 h-8 rounded-lg hover:bg-bg-subtle flex items-center justify-center text-xs transition-colors">3</button>
            <button class="w-8 h-8 rounded-lg bg-bg-subtle hover:bg-bg text-fg-secondary flex items-center justify-center text-xs transition-colors" onclick="nextOrdersPage()">
                <iconify-icon icon="mdi:chevron-right" class="text-sm"></iconify-icon>
            </button>
        </div>
    </div>
</div>

</div>
</div>
