<!--
  用户管理页面 (lex-coder · 2026-07-03)
  数据源: GET /api/users (users_router.py)
  
  功能:
  - 用户列表表格 (姓名、邮箱、角色、状态、创建时间)
  - 搜索和筛选功能
  - 用户编辑模态框 (修改角色、状态、权限)
  - 用户删除功能
  - 批量操作 (批量启用/禁用)
-->
<div class="hidden view-content flex-1 flex flex-col overflow-y-auto" id="view-backlog" data-view-source="backlog/index.html">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; }
  .fade-in { animation: fadeIn 200ms ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .score-number { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }
  
  .status-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
  }
  .status-active { background: #E8F5E9; color: #2E7D32; }
  .status-inactive { background: #F5F5F5; color: #616161; }
  
  .role-admin { background: #FCE4EC; color: #C62828; }
  .role-manager { background: #E3F2FD; color: #1565C0; }
  .role-user { background: #FFF8E1; color: #E65100; }
  
  .user-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #165DFF 0%, #722ED1 100%);
    color: white; display: flex;
    align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
  }
  
  .table-row:hover { background: #F8F9FA; }
  .table-row.selected { background: #E3F2FD; }
  
  .pagination-btn {
    min-width: 32px; height: 32px; display: inline-flex;
    align-items: center; justify-content: center; border-radius: 4px;
    border: 1px solid #E5E6EB; font-size: 13px;
    transition: all 150ms;
  }
  .pagination-btn:hover:not(:disabled) { background: #F0F2F5; border-color: #165DFF; color: #165DFF; }
  .pagination-btn.active { background: #165DFF; border-color: #165DFF; color: white; }
  .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>

<div class="flex flex-col min-h-full bg-bg-subtle">

  <!-- ============ 顶部 header ============ -->
  <header class="bg-white border-b border-bg-border sticky top-0 z-30 shadow-sm">
    <div class="px-4 md:px-6 py-3 flex items-center gap-3">
      <button class="w-9 h-9 rounded-md text-fg-secondary hover:bg-brand-tint hover:text-brand flex items-center justify-center flex-shrink-0" onclick="switchView('workstation')" title="返回">
        <iconify-icon icon="mdi:arrow-left" class="text-lg"></iconify-icon>
      </button>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5">
          <h1 class="text-base md:text-lg font-semibold flex items-center gap-1.5 truncate">
            <iconify-icon icon="mdi:account-group" class="text-brand text-lg md:text-xl"></iconify-icon>
            <span class="truncate">用户管理</span>
          </h1>
        </div>
        <p class="text-[11px] text-fg-tertiary truncate" id="users-subtitle">共 <span id="user-total-count">0</span> 位用户</p>
      </div>
    </div>
  </header>

  <!-- ============ 主体内容 ============ -->
  <main class="flex-1 px-4 md:px-6 py-5 md:py-6 max-w-7xl mx-auto w-full">

    <!-- ============ 搜索和筛选区域 ============ -->
    <div class="bg-white rounded-lg shadow-card border border-bg-border p-4 mb-5 fade-in">
      <div class="flex flex-col md:flex-row md:items-center gap-3">
        <div class="flex-1 relative">
          <iconify-icon icon="mdi:search" class="absolute left-3 top-1/2 -translate-y-1/2 text-fg-tertiary text-sm"></iconify-icon>
          <input type="text" id="user-search-input" placeholder="搜索用户邮箱或手机号..." 
            class="w-full h-9 pl-9 pr-4 bg-bg-subtle border border-bg-border rounded-md text-sm focus:outline-none focus:border-brand transition-colors">
        </div>
        <select id="user-role-filter" class="h-9 px-3 bg-bg-subtle border border-bg-border rounded-md text-sm focus:outline-none focus:border-brand transition-colors flex-shrink-0">
          <option value="">所有角色</option>
          <option value="admin">管理员</option>
          <option value="manager">经理</option>
          <option value="user">普通用户</option>
        </select>
        <select id="user-status-filter" class="h-9 px-3 bg-bg-subtle border border-bg-border rounded-md text-sm focus:outline-none focus:border-brand transition-colors flex-shrink-0">
          <option value="">所有状态</option>
          <option value="true">已启用</option>
          <option value="false">已禁用</option>
        </select>
        <button id="user-search-btn" class="h-9 px-4 bg-brand text-white rounded-md text-sm font-medium hover:bg-brand-dark transition-colors flex-shrink-0 flex items-center gap-1">
          <iconify-icon icon="mdi:search" class="text-sm"></iconify-icon>
          <span>搜索</span>
        </button>
        <button id="user-reset-btn" class="h-9 px-4 bg-white border border-bg-border rounded-md text-sm text-fg-secondary hover:border-brand hover:text-brand transition-colors flex-shrink-0">
          重置
        </button>
      </div>
    </div>

    <!-- ============ 批量操作栏 ============ -->
    <div class="bg-white rounded-lg shadow-card border border-bg-border p-3 mb-5 fade-in flex items-center justify-between">
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="select-all-users" class="w-4 h-4 rounded border-bg-border text-brand focus:ring-brand">
          <span class="text-xs text-fg-secondary">全选</span>
        </label>
        <span id="selected-count" class="text-xs text-fg-tertiary">已选择 <span class="font-medium text-fg-secondary">0</span> 项</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="batch-enable-btn" class="h-7 px-3 bg-white border border-bg-border rounded-md text-xs text-fg-secondary hover:border-success hover:text-success flex items-center gap-1">
          <iconify-icon icon="mdi:check-circle" class="text-sm"></iconify-icon>
          批量启用
        </button>
        <button id="batch-disable-btn" class="h-7 px-3 bg-white border border-bg-border rounded-md text-xs text-fg-secondary hover:border-error hover:text-error flex items-center gap-1">
          <iconify-icon icon="mdi:cancel-circle" class="text-sm"></iconify-icon>
          批量禁用
        </button>
      </div>
    </div>

    <!-- ============ 用户列表表格 ============ -->
    <div class="bg-white rounded-lg shadow-card border border-bg-border overflow-hidden mb-5 fade-in">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="bg-bg-subtle">
              <th class="w-10 px-4 py-3 text-left text-[11px] font-semibold text-fg-tertiary uppercase tracking-wider">
                <input type="checkbox" id="select-all-header" class="w-4 h-4 rounded border-bg-border text-brand focus:ring-brand">
              </th>
              <th class="px-4 py-3 text-left text-[11px] font-semibold text-fg-tertiary uppercase tracking-wider">用户信息</th>
              <th class="px-4 py-3 text-left text-[11px] font-semibold text-fg-tertiary uppercase tracking-wider">角色</th>
              <th class="px-4 py-3 text-left text-[11px] font-semibold text-fg-tertiary uppercase tracking-wider">状态</th>
              <th class="px-4 py-3 text-left text-[11px] font-semibold text-fg-tertiary uppercase tracking-wider">创建时间</th>
              <th class="px-4 py-3 text-right text-[11px] font-semibold text-fg-tertiary uppercase tracking-wider">操作</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr>
              <td colspan="6" class="px-4 py-12 text-center text-xs text-fg-tertiary">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ============ 分页 ============ -->
    <div class="flex items-center justify-between mb-6 fade-in">
      <div class="text-xs text-fg-tertiary">
        显示 <span id="page-start">1</span> - <span id="page-end">20</span> 条，共 <span id="total-pages">0</span> 页
      </div>
      <div class="flex items-center gap-1">
        <button id="page-prev" class="pagination-btn" disabled>
          <iconify-icon icon="mdi:chevron-left" class="text-sm"></iconify-icon>
        </button>
        <span id="page-numbers" class="flex items-center gap-1"></span>
        <button id="page-next" class="pagination-btn">
          <iconify-icon icon="mdi:chevron-right" class="text-sm"></iconify-icon>
        </button>
      </div>
    </div>

  </main>
</div>

<!-- ============ 用户编辑模态框 ============ -->
<div id="user-edit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/50" onclick="closeUserEditModal()"></div>
  <div class="relative bg-white rounded-xl shadow-lg w-full max-w-md mx-4 overflow-hidden">
    <div class="flex items-center justify-between px-5 py-4 border-b border-bg-border">
      <h3 class="text-base font-semibold" id="modal-title">编辑用户</h3>
      <button onclick="closeUserEditModal()" class="w-8 h-8 rounded-md text-fg-secondary hover:bg-bg-subtle flex items-center justify-center">
        <iconify-icon icon="mdi:close" class="text-lg"></iconify-icon>
      </button>
    </div>
    <div class="p-5 space-y-4">
      <input type="hidden" id="edit-user-id">
      <div>
        <label class="block text-xs font-medium text-fg-secondary mb-1.5">邮箱</label>
        <input type="text" id="edit-user-email" class="w-full h-9 px-3 bg-bg-subtle border border-bg-border rounded-md text-sm focus:outline-none focus:border-brand" readonly>
      </div>
      <div>
        <label class="block text-xs font-medium text-fg-secondary mb-1.5">角色</label>
        <select id="edit-user-role" class="w-full h-9 px-3 bg-bg-subtle border border-bg-border rounded-md text-sm focus:outline-none focus:border-brand">
          <option value="admin">管理员</option>
          <option value="manager">经理</option>
          <option value="user">普通用户</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-fg-secondary mb-1.5">状态</label>
        <select id="edit-user-status" class="w-full h-9 px-3 bg-bg-subtle border border-bg-border rounded-md text-sm focus:outline-none focus:border-brand">
          <option value="true">启用</option>
          <option value="false">禁用</option>
        </select>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 px-5 py-4 bg-bg-subtle">
      <button onclick="closeUserEditModal()" class="h-9 px-4 bg-white border border-bg-border rounded-md text-sm text-fg-secondary hover:border-brand hover:text-brand">取消</button>
      <button onclick="saveUserEdit()" class="h-9 px-4 bg-brand text-white rounded-md text-sm font-medium hover:bg-brand-dark">保存</button>
    </div>
  </div>
</div>

<!-- ============ 删除确认模态框 ============ -->
<div id="user-delete-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
  <div class="absolute inset-0 bg-black/50" onclick="closeUserDeleteModal()"></div>
  <div class="relative bg-white rounded-xl shadow-lg w-full max-w-sm mx-4 overflow-hidden">
    <div class="flex items-center justify-between px-5 py-4 border-b border-bg-border">
      <h3 class="text-base font-semibold">确认删除</h3>
      <button onclick="closeUserDeleteModal()" class="w-8 h-8 rounded-md text-fg-secondary hover:bg-bg-subtle flex items-center justify-center">
        <iconify-icon icon="mdi:close" class="text-lg"></iconify-icon>
      </button>
    </div>
    <div class="p-5">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-error/10 flex items-center justify-center flex-shrink-0">
          <iconify-icon icon="mdi:alert-triangle" class="text-error text-xl"></iconify-icon>
        </div>
        <div>
          <p class="text-sm font-medium mb-1">确定要删除用户 <span id="delete-user-email" class="text-brand"></span> 吗？</p>
          <p class="text-xs text-fg-tertiary">此操作无法撤销。</p>
        </div>
      </div>
      <input type="hidden" id="delete-user-id">
    </div>
    <div class="flex items-center justify-end gap-2 px-5 py-4 bg-bg-subtle">
      <button onclick="closeUserDeleteModal()" class="h-9 px-4 bg-white border border-bg-border rounded-md text-sm text-fg-secondary hover:border-brand hover:text-brand">取消</button>
      <button onclick="confirmUserDelete()" class="h-9 px-4 bg-error text-white rounded-md text-sm font-medium hover:bg-error-dark">删除</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var currentUsers = [];
  var currentPage = 1;
  var totalPages = 0;
  var selectedIds = [];

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '-';
    try {
      var date = new Date(dateStr);
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    } catch (e) {
      return dateStr.substring(0, 16);
    }
  }

  function getInitials(name) {
    if (!name) return '?';
    return name.charAt(0).toUpperCase();
  }

  function roleLabel(role) {
    var map = { 'admin': '管理员', 'manager': '经理', 'user': '普通用户' };
    return map[role] || role;
  }

  function roleClass(role) {
    return 'role-' + (role || 'user');
  }

  async function loadUsers() {
    var search = document.getElementById('user-search-input').value.trim();
    var role = document.getElementById('user-role-filter').value;
    var status = document.getElementById('user-status-filter').value;
    
    var url = '/api/users?page=' + currentPage + '&size=20';
    if (search) url += '&search=' + encodeURIComponent(search);
    if (role) url += '&role=' + role;
    if (status !== '') url += '&is_active=' + status;

    try {
      var resp = await fetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      currentUsers = data.users || [];
      totalPages = data.total_pages || 1;
      
      document.getElementById('user-total-count').textContent = data.total || 0;
      document.getElementById('page-start').textContent = ((currentPage - 1) * 20) + 1;
      document.getElementById('page-end').textContent = Math.min(currentPage * 20, data.total || 0);
      document.getElementById('total-pages').textContent = totalPages;
      
      renderUserTable(data.users || []);
      renderPagination();
      clearSelection();
    } catch (err) {
      console.error('[users] load failed', err);
      document.getElementById('user-table-body').innerHTML = 
        '<tr><td colspan="6" class="px-4 py-12 text-center text-xs text-fg-tertiary">加载失败: ' + err.message + '</td></tr>';
    }
  }

  function renderUserTable(users) {
    var tbody = document.getElementById('user-table-body');
    if (!users || users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-12 text-center text-xs text-fg-tertiary">暂无用户数据</td></tr>';
      return;
    }

    var html = users.map(function(user) {
      var isSelected = selectedIds.indexOf(user.id) !== -1;
      return '<tr class="table-row' + (isSelected ? ' selected' : '') + ' border-b border-bg-border">' +
        '<td class="px-4 py-3">' +
          '<input type="checkbox" class="user-checkbox w-4 h-4 rounded border-bg-border text-brand focus:ring-brand" ' +
            'data-id="' + user.id + '"' + (isSelected ? ' checked' : '') + '>' +
        '</td>' +
        '<td class="px-4 py-3">' +
          '<div class="flex items-center gap-3">' +
            '<div class="user-avatar">' + getInitials(user.email || user.phone || '?') + '</div>' +
            '<div>' +
              '<p class="text-sm font-medium text-fg-primary">' + escapeHtml(user.email || user.phone || '未设置') + '</p>' +
              '<p class="text-xs text-fg-tertiary">' + (user.phone ? '手机号: ' + user.phone : '') + '</p>' +
            '</div>' +
          '</div>' +
        '</td>' +
        '<td class="px-4 py-3">' +
          '<span class="status-badge ' + roleClass(user.role) + '">' + roleLabel(user.role) + '</span>' +
        '</td>' +
        '<td class="px-4 py-3">' +
          '<span class="status-badge ' + (user.is_active ? 'status-active' : 'status-inactive') + '">' +
            (user.is_active ? '已启用' : '已禁用') +
          '</span>' +
        '</td>' +
        '<td class="px-4 py-3 text-xs text-fg-tertiary">' + formatDate(user.created_at) + '</td>' +
        '<td class="px-4 py-3 text-right">' +
          '<div class="flex items-center justify-end gap-1">' +
            '<button class="w-7 h-7 rounded-md text-fg-secondary hover:bg-brand-tint hover:text-brand flex items-center justify-center" ' +
              'onclick="openUserEditModal(' + user.id + ')" title="编辑">' +
              '<iconify-icon icon="mdi:pencil" class="text-sm"></iconify-icon>' +
            '</button>' +
            '<button class="w-7 h-7 rounded-md text-fg-secondary hover:bg-error-tint hover:text-error flex items-center justify-center" ' +
              'onclick="openUserDeleteModal(' + user.id + ')" title="删除">' +
              '<iconify-icon icon="mdi:trash" class="text-sm"></iconify-icon>' +
            '</button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join('');

    tbody.innerHTML = html;

    document.querySelectorAll('.user-checkbox').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var id = parseInt(cb.getAttribute('data-id'));
        if (cb.checked) {
          if (selectedIds.indexOf(id) === -1) selectedIds.push(id);
        } else {
          selectedIds = selectedIds.filter(function(i) { return i !== id; });
        }
        updateSelectionCount();
      });
    });
  }

  function renderPagination() {
    var container = document.getElementById('page-numbers');
    var html = '';
    
    document.getElementById('page-prev').disabled = currentPage <= 1;
    document.getElementById('page-next').disabled = currentPage >= totalPages;

    if (totalPages <= 7) {
      for (var i = 1; i <= totalPages; i++) {
        html += '<button class="pagination-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
      }
    } else {
      if (currentPage <= 4) {
        for (var i = 1; i <= 5; i++) {
          html += '<button class="pagination-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
        }
        html += '<span class="text-xs text-fg-tertiary px-1">...</span>';
        html += '<button class="pagination-btn" onclick="goToPage(' + totalPages + ')">' + totalPages + '</button>';
      } else if (currentPage >= totalPages - 3) {
        html += '<button class="pagination-btn" onclick="goToPage(1)">1</button>';
        html += '<span class="text-xs text-fg-tertiary px-1">...</span>';
        for (var i = totalPages - 4; i <= totalPages; i++) {
          html += '<button class="pagination-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
        }
      } else {
        html += '<button class="pagination-btn" onclick="goToPage(1)">1</button>';
        html += '<span class="text-xs text-fg-tertiary px-1">...</span>';
        for (var i = currentPage - 1; i <= currentPage + 1; i++) {
          html += '<button class="pagination-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
        }
        html += '<span class="text-xs text-fg-tertiary px-1">...</span>';
        html += '<button class="pagination-btn" onclick="goToPage(' + totalPages + ')">' + totalPages + '</button>';
      }
    }

    container.innerHTML = html;
  }

  function goToPage(page) {
    if (page < 1 || page > totalPages || page === currentPage) return;
    currentPage = page;
    loadUsers();
  }

  function updateSelectionCount() {
    document.getElementById('selected-count').innerHTML = '已选择 <span class="font-medium text-fg-secondary">' + selectedIds.length + '</span> 项';
    document.getElementById('select-all-users').checked = selectedIds.length === currentUsers.length && currentUsers.length > 0;
  }

  function clearSelection() {
    selectedIds = [];
    updateSelectionCount();
  }

  function openUserEditModal(userId) {
    var user = currentUsers.find(function(u) { return u.id === userId; });
    if (!user) return;

    document.getElementById('edit-user-id').value = user.id;
    document.getElementById('edit-user-email').value = user.email || '';
    document.getElementById('edit-user-role').value = user.role || 'user';
    document.getElementById('edit-user-status').value = String(user.is_active);
    document.getElementById('modal-title').textContent = '编辑用户';
    
    document.getElementById('user-edit-modal').classList.remove('hidden');
  }

  function closeUserEditModal() {
    document.getElementById('user-edit-modal').classList.add('hidden');
  }

  async function saveUserEdit() {
    var userId = parseInt(document.getElementById('edit-user-id').value);
    var role = document.getElementById('edit-user-role').value;
    var isActive = document.getElementById('edit-user-status').value === 'true';

    try {
      var resp = await fetch('/api/users/' + userId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: role, is_active: isActive })
      });
      
      if (!resp.ok) throw new Error('更新失败');
      
      closeUserEditModal();
      loadUsers();
      
      if (typeof Utils !== 'undefined' && Utils.showToast) {
        Utils.showToast('用户信息已更新', 'success');
      } else {
        alert('用户信息已更新');
      }
    } catch (err) {
      console.error('[users] update failed', err);
      alert('更新失败: ' + err.message);
    }
  }

  function openUserDeleteModal(userId) {
    var user = currentUsers.find(function(u) { return u.id === userId; });
    if (!user) return;

    document.getElementById('delete-user-id').value = user.id;
    document.getElementById('delete-user-email').textContent = user.email || '用户';
    
    document.getElementById('user-delete-modal').classList.remove('hidden');
  }

  function closeUserDeleteModal() {
    document.getElementById('user-delete-modal').classList.add('hidden');
  }

  async function confirmUserDelete() {
    var userId = parseInt(document.getElementById('delete-user-id').value);

    try {
      var resp = await fetch('/api/users/' + userId, { method: 'DELETE' });
      
      if (!resp.ok) throw new Error('删除失败');
      
      closeUserDeleteModal();
      loadUsers();
      
      if (typeof Utils !== 'undefined' && Utils.showToast) {
        Utils.showToast('用户已删除', 'success');
      } else {
        alert('用户已删除');
      }
    } catch (err) {
      console.error('[users] delete failed', err);
      alert('删除失败: ' + err.message);
    }
  }

  async function batchUpdateStatus(isActive) {
    if (selectedIds.length === 0) {
      alert('请先选择要操作的用户');
      return;
    }

    try {
      var resp = await fetch('/api/users/batch-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_ids: selectedIds, is_active: isActive })
      });
      
      if (!resp.ok) throw new Error('操作失败');
      
      loadUsers();
      
      if (typeof Utils !== 'undefined' && Utils.showToast) {
        Utils.showToast('批量操作成功', 'success');
      } else {
        alert('批量操作成功');
      }
    } catch (err) {
      console.error('[users] batch update failed', err);
      alert('操作失败: ' + err.message);
    }
  }

  document.getElementById('user-search-btn').addEventListener('click', function() {
    currentPage = 1;
    loadUsers();
  });

  document.getElementById('user-reset-btn').addEventListener('click', function() {
    document.getElementById('user-search-input').value = '';
    document.getElementById('user-role-filter').value = '';
    document.getElementById('user-status-filter').value = '';
    currentPage = 1;
    loadUsers();
  });

  document.getElementById('select-all-users').addEventListener('change', function() {
    var checked = this.checked;
    document.querySelectorAll('.user-checkbox').forEach(function(cb) {
      cb.checked = checked;
      var id = parseInt(cb.getAttribute('data-id'));
      if (checked) {
        if (selectedIds.indexOf(id) === -1) selectedIds.push(id);
      } else {
        selectedIds = selectedIds.filter(function(i) { return i !== id; });
      }
    });
    updateSelectionCount();
  });

  document.getElementById('page-prev').addEventListener('click', function() {
    goToPage(currentPage - 1);
  });

  document.getElementById('page-next').addEventListener('click', function() {
    goToPage(currentPage + 1);
  });

  document.getElementById('batch-enable-btn').addEventListener('click', function() {
    batchUpdateStatus(true);
  });

  document.getElementById('batch-disable-btn').addEventListener('click', function() {
    batchUpdateStatus(false);
  });

  document.getElementById('user-search-input').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') {
      currentPage = 1;
      loadUsers();
    }
  });

  globalThis.openUserEditModal = openUserEditModal;
  globalThis.closeUserEditModal = closeUserEditModal;
  globalThis.saveUserEdit = saveUserEdit;
  globalThis.openUserDeleteModal = openUserDeleteModal;
  globalThis.closeUserDeleteModal = closeUserDeleteModal;
  globalThis.confirmUserDelete = confirmUserDelete;
  globalThis.goToPage = goToPage;

  loadUsers();
})();
</script>
</div>
