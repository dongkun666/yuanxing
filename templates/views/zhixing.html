<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-3 md:p-4 space-y-3 md:space-y-4 bg-bg" id="view-zhixing">
<div class="max-w-6xl mx-auto w-full space-y-4">
    <!-- Hero 区域 -->
    <div class="relative overflow-hidden bg-gradient-to-br from-rose-500 via-red-500 to-orange-500 px-5 py-6 md:px-6 md:py-7 rounded-2xl" data-animate="fade-in-up" data-delay="0">
        <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/2 blur-3xl"></div>
        <div class="absolute bottom-0 left-1/3 w-48 h-48 bg-white/5 rounded-full translate-y-1/2 blur-2xl"></div>
        <div class="relative z-10">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center flex-shrink-0 shadow-lg">
                        <iconify-icon class="text-2xl md:text-3xl text-white" icon="mdi:gavel"></iconify-icon>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold text-white mb-1">执行信息查询</h1>
                        <p class="text-white/80 text-xs md:text-sm max-w-md">全国法院失信被执行人、限制高消费、被执行人信息一站式查询，风险预警更及时。</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button class="flex items-center gap-1.5 px-3 py-2 bg-white/20 hover:bg-white/30 backdrop-blur-sm rounded-lg text-white text-xs font-medium transition-all duration-300 hover:-translate-y-0.5">
                        <iconify-icon icon="mdi:bookmark-outline" class="text-sm"></iconify-icon>
                        <span>收藏名单</span>
                    </button>
                    <button class="flex items-center gap-1.5 px-3 py-2 bg-white text-rose-600 hover:bg-white/90 rounded-lg text-xs font-medium transition-all duration-300 hover:-translate-y-0.5 shadow-lg shadow-rose-500/20">
                        <iconify-icon icon="mdi:alert-decagram" class="text-sm"></iconify-icon>
                        <span>批量查询</span>
                    </button>
                </div>
            </div>
            <!-- 数据统计 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">
                <div class="bg-white/15 backdrop-blur-md rounded-xl p-3 border border-white/20 hover:bg-white/20 transition-all duration-300 hover:-translate-y-0.5 group" data-animate="scale-in" data-stagger-group="zx-stats" data-stagger-index="0" data-delay="0.1">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-white/70 text-[11px]">被执行人</span>
                        <div class="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <iconify-icon icon="mdi:account-group-outline" class="text-white text-sm"></iconify-icon>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white kb-tabular-nums">3,200万+</p>
                    <p class="text-[10px] text-white/60 mt-0.5">历史累计</p>
                </div>
                <div class="bg-white/15 backdrop-blur-md rounded-xl p-3 border border-white/20 hover:bg-white/20 transition-all duration-300 hover:-translate-y-0.5 group" data-animate="scale-in" data-stagger-group="zx-stats" data-stagger-index="1" data-delay="0.1">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-white/70 text-[11px]">失信名单</span>
                        <div class="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <iconify-icon icon="mdi:alert-decagram" class="text-white text-sm"></iconify-icon>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white kb-tabular-nums">860万+</p>
                    <p class="text-[10px] text-white/60 mt-0.5">失信被执行人</p>
                </div>
                <div class="bg-white/15 backdrop-blur-md rounded-xl p-3 border border-white/20 hover:bg-white/20 transition-all duration-300 hover:-translate-y-0.5 group" data-animate="scale-in" data-stagger-group="zx-stats" data-stagger-index="2" data-delay="0.1">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-white/70 text-[11px]">限制高消费</span>
                        <div class="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <iconify-icon icon="mdi:cancel" class="text-white text-sm"></iconify-icon>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white kb-tabular-nums">1,500万+</p>
                    <p class="text-[10px] text-white/60 mt-0.5">限高人员</p>
                </div>
                <div class="bg-white/15 backdrop-blur-md rounded-xl p-3 border border-white/20 hover:bg-white/20 transition-all duration-300 hover:-translate-y-0.5 group" data-animate="scale-in" data-stagger-group="zx-stats" data-stagger-index="3" data-delay="0.1">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-white/70 text-[11px]">执行标的</span>
                        <div class="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <iconify-icon icon="mdi:cash" class="text-white text-sm"></iconify-icon>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white kb-tabular-nums">8.6万亿</p>
                    <p class="text-[10px] text-white/60 mt-0.5">累计金额</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 搜索区域 -->
    <div class="ws-card p-4 md:p-5" data-animate="fade-in-up" data-delay="0.2">
        <div class="flex items-center gap-2 mb-4">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-500 to-red-500 flex items-center justify-center shadow-md shadow-rose-500/20">
                <iconify-icon icon="mdi:magnify" class="text-white text-base"></iconify-icon>
            </div>
            <div>
                <h2 class="text-sm font-semibold text-fg-primary">被执行人检索</h2>
                <p class="text-[10px] text-fg-tertiary">输入姓名/名称或证件号码，查询执行信息</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">被执行人姓名/名称</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <iconify-icon class="text-fg-tertiary group-focus-within:text-rose-500 transition-colors" icon="mdi:account-outline"></iconify-icon>
                    </div>
                    <input type="text" id="zhixing-name" placeholder="请输入自然人姓名或企业名称" class="w-full bg-bg-subtle border border-bg-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-fg-primary focus:outline-none focus:border-rose-500 focus:bg-white focus:ring-2 focus:ring-rose-500/10 transition-all duration-200 placeholder:text-fg-disabled"/>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">身份证号/组织机构代码</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <iconify-icon class="text-fg-tertiary group-focus-within:text-rose-500 transition-colors" icon="mdi:card-account-details-outline"></iconify-icon>
                    </div>
                    <input type="text" id="zhixing-idcard" placeholder="请输入身份证号或统一社会信用代码" class="w-full bg-bg-subtle border border-bg-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-fg-primary focus:outline-none focus:border-rose-500 focus:bg-white focus:ring-2 focus:ring-rose-500/10 transition-all duration-200 placeholder:text-fg-disabled"/>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">执行状态</label>
                <div class="relative">
                    <select id="zhixing-status" class="appearance-none w-full bg-bg-subtle border border-bg-border rounded-xl px-4 py-2.5 pr-9 text-sm text-fg-secondary focus:outline-none focus:border-rose-500 focus:bg-white focus:ring-2 focus:ring-rose-500/10 transition-all duration-200 cursor-pointer hover:border-rose-500/40">
                        <option>全部状态</option>
                        <option>执行中</option>
                        <option>已结案</option>
                        <option>终本</option>
                        <option>失信</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
                        <iconify-icon class="text-fg-tertiary text-xs" icon="mdi:chevron-down"></iconify-icon>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">执行法院</label>
                <div class="relative">
                    <select id="zhixing-court" class="appearance-none w-full bg-bg-subtle border border-bg-border rounded-xl px-4 py-2.5 pr-9 text-sm text-fg-secondary focus:outline-none focus:border-rose-500 focus:bg-white focus:ring-2 focus:ring-rose-500/10 transition-all duration-200 cursor-pointer hover:border-rose-500/40">
                        <option>全部法院</option>
                        <option>北京市高级人民法院</option>
                        <option>上海市高级人民法院</option>
                        <option>广东省高级人民法院</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
                        <iconify-icon class="text-fg-tertiary text-xs" icon="mdi:chevron-down"></iconify-icon>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">案件类型</label>
                <div class="relative">
                    <select id="zhixing-type" class="appearance-none w-full bg-bg-subtle border border-bg-border rounded-xl px-4 py-2.5 pr-9 text-sm text-fg-secondary focus:outline-none focus:border-rose-500 focus:bg-white focus:ring-2 focus:ring-rose-500/10 transition-all duration-200 cursor-pointer hover:border-rose-500/40">
                        <option>全部类型</option>
                        <option>首次执行</option>
                        <option>恢复执行</option>
                        <option>执保案件</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
                        <iconify-icon class="text-fg-tertiary text-xs" icon="mdi:chevron-down"></iconify-icon>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between flex-wrap gap-3">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[10px] text-fg-tertiary">热门查询：</span>
                <button onclick="hotSearchZhixing('张三')" class="px-2.5 py-1 text-[10px] bg-rose-50 text-rose-600 rounded-full hover:bg-rose-100 transition-colors">张三</button>
                <button onclick="hotSearchZhixing('某科技公司')" class="px-2.5 py-1 text-[10px] bg-amber-50 text-amber-600 rounded-full hover:bg-amber-100 transition-colors">某科技公司</button>
                <button onclick="hotSearchZhixing('失信被执行人')" class="px-2.5 py-1 text-[10px] bg-red-50 text-red-600 rounded-full hover:bg-red-100 transition-colors">失信名单</button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="resetZhixing()" class="px-4 py-2.5 text-sm border border-bg-border text-fg-secondary rounded-xl hover:bg-bg-subtle transition-all duration-200 flex items-center gap-1.5">
                    <iconify-icon class="text-base" icon="mdi:refresh"></iconify-icon>
                    重置
                </button>
                <button onclick="searchZhixing()" class="px-5 py-2.5 text-sm text-white bg-gradient-to-r from-rose-500 to-red-500 hover:shadow-lg hover:shadow-rose-500/25 rounded-xl transition-all duration-300 hover:-translate-y-0.5 flex items-center gap-1.5">
                    <iconify-icon class="text-base" icon="mdi:magnify"></iconify-icon>
                    查询执行
                </button>
            </div>
        </div>
    </div>

    <!-- 风险提示卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3" data-animate="fade-in-up" data-delay="0.3">
        <div class="ws-card p-4 hover:shadow-lg cursor-pointer group border-l-4 border-l-red-500">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-100 to-rose-50 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <iconify-icon class="text-xl text-red-500" icon="mdi:alert-decagram"></iconify-icon>
                </div>
                <div>
                    <p class="text-sm font-semibold text-fg-primary">失信被执行人</p>
                    <p class="text-[10px] text-fg-tertiary">860 万+ 条记录</p>
                </div>
            </div>
        </div>
        <div class="ws-card p-4 hover:shadow-lg cursor-pointer group border-l-4 border-l-amber-500">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-100 to-yellow-50 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <iconify-icon class="text-xl text-amber-500" icon="mdi:cancel"></iconify-icon>
                </div>
                <div>
                    <p class="text-sm font-semibold text-fg-primary">限制高消费</p>
                    <p class="text-[10px] text-fg-tertiary">1,500 万+ 条记录</p>
                </div>
            </div>
        </div>
        <div class="ws-card p-4 hover:shadow-lg cursor-pointer group border-l-4 border-l-blue-500">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-100 to-indigo-50 flex items-center justify-center group-hover:scale-110 transition-transform">
                    <iconify-icon class="text-xl text-blue-500" icon="mdi:gavel"></iconify-icon>
                </div>
                <div>
                    <p class="text-sm font-semibold text-fg-primary">被执行人</p>
                    <p class="text-[10px] text-fg-tertiary">3,200 万+ 条记录</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 执行信息列表 -->
    <div class="ws-card overflow-hidden flex flex-col" data-animate="fade-in-up" data-delay="0.4">
        <div class="flex items-center justify-between px-5 py-3.5 border-b border-bg-border bg-gradient-to-r from-bg-subtle to-bg-subtle/50">
            <div class="flex items-center gap-2">
                <iconify-icon icon="mdi:format-list-bulleted" class="text-fg-tertiary text-sm"></iconify-icon>
                <span class="text-xs font-semibold text-fg-secondary" id="zhixing-result-count">共 2,368 条结果</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-fg-tertiary">排序：</span>
                <select id="zhixing-sort" onchange="changeZhixingSort()" class="text-[10px] border border-bg-border rounded-lg px-2.5 py-1 text-fg-secondary focus:outline-none focus:border-rose-500 bg-white cursor-pointer hover:border-rose-500/40 transition-colors">
                    <option>立案日期</option>
                    <option>执行标的</option>
                    <option>相关度</option>
                </select>
            </div>
        </div>
        <div class="divide-y divide-bg-border/60" id="zhixing-results"></div>
        <!-- 分页 -->
        <div class="flex items-center justify-center gap-1 px-5 py-4 border-t border-bg-border/60 bg-bg-subtle/30" id="zhixing-pagination"></div>
    </div>
</div>
</div>
