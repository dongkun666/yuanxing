<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-6 bg-bg" id="view-zhixing">
<div class="max-w-6xl mx-auto w-full space-y-5">
    <div class="bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl border border-amber-200 p-5">
        <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center flex-shrink-0 shadow-sm">
                <iconify-icon class="text-2xl text-amber-600" icon="mdi:gavel"></iconify-icon>
            </div>
            <div class="flex-1">
                <h1 class="text-lg font-bold text-fg-primary">执行案件查询</h1>
                <p class="text-xs text-fg-secondary mt-1">对接中国执行信息公开网，查询被执行人信息、失信名单、限制高消费等执行相关数据。</p>
                <p class="text-[10px] text-fg-tertiary mt-1">⚠️ 数据来源：最高人民法院中国执行信息公开网，<a class="text-brand hover:underline" href="http://zxgk.court.gov.cn/" target="_blank" rel="noopener">zxgk.court.gov.cn</a></p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-bg-border p-5">
        <div class="flex items-center gap-2 mb-3">
            <iconify-icon class="text-base text-fg-tertiary" icon="mdi:magnify-scan"></iconify-icon>
            <h2 class="text-sm font-semibold text-fg-primary">查询条件</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">被执行人姓名/名称</label>
                <input type="text" id="zhixing-name" placeholder="请输入姓名或企业名称" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors"/>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">身份证号/统一社会信用代码</label>
                <input type="text" id="zhixing-idcard" placeholder="请输入证件号码" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors"/>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">执行法院</label>
                <input type="text" id="zhixing-court" placeholder="请输入执行法院" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors"/>
            </div>
        </div>

        <div class="flex items-center justify-between">
            <div class="text-[10px] text-fg-tertiary">
                <iconify-icon class="text-xs" icon="mdi:information-outline"></iconify-icon>
                支持被执行人信息、失信被执行人、限制消费人员查询
            </div>
            <div class="flex items-center gap-2">
                <button class="px-4 py-2 text-sm border border-bg-border text-fg-secondary rounded-lg hover:bg-bg-subtle transition-colors" onclick="resetZhixing()">
                    <iconify-icon class="text-base" icon="mdi:refresh"></iconify-icon>
                    重置
                </button>
                <button class="px-4 py-2 text-sm text-white bg-brand hover:bg-blue-600 rounded-lg transition-colors flex items-center gap-1.5" onclick="searchZhixing()">
                    <iconify-icon class="text-base" icon="mdi:magnify"></iconify-icon>
                    查询
                </button>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-bg-border p-12 text-center" id="zhixing-empty">
        <iconify-icon class="text-5xl text-fg-disabled" icon="mdi:gavel"></iconify-icon>
        <p class="text-sm text-fg-tertiary mt-3">请输入查询条件开始搜索</p>
        <p class="text-[10px] text-fg-disabled mt-1">数据来源: 中国执行信息公开网</p>
    </div>

    <div class="hidden space-y-4" id="zhixing-results">
        <div class="bg-white rounded-xl border border-bg-border p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <iconify-icon class="text-base text-fg-tertiary" icon="mdi:format-list-bulleted"></iconify-icon>
                    <h2 class="text-sm font-semibold text-fg-primary">查询结果</h2>
                </div>
                <span class="text-[10px] text-fg-tertiary" id="zhixing-result-count"></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-bg-subtle border-b border-bg-border">
                            <th class="text-left py-3 px-4 text-xs font-semibold text-fg-secondary">案号</th>
                            <th class="text-left py-3 px-4 text-xs font-semibold text-fg-secondary">被执行人</th>
                            <th class="text-left py-3 px-4 text-xs font-semibold text-fg-secondary">执行法院</th>
                            <th class="text-left py-3 px-4 text-xs font-semibold text-fg-secondary">立案时间</th>
                            <th class="text-left py-3 px-4 text-xs font-semibold text-fg-secondary">执行标的</th>
                            <th class="text-center py-3 px-4 text-xs font-semibold text-fg-secondary">案件状态</th>
                        </tr>
                    </thead>
                    <tbody id="zhixing-table-body" class="divide-y divide-bg">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</div>
<script>
(function() {
    var mockData = [
        { caseNum: '(2026)京01执123号', name: '张三', court: '北京市第一中级人民法院', date: '2026-03-15', amount: '500,000元', status: '执行中' },
        { caseNum: '(2025)京02执456号', name: '李四', court: '北京市第二中级人民法院', date: '2025-11-20', amount: '1,200,000元', status: '已终结' },
        { caseNum: '(2026)京03执789号', name: '王五', court: '北京市第三中级人民法院', date: '2026-01-10', amount: '800,000元', status: '执行中' }
    ];

    function searchZhixing() {
        var name = document.getElementById('zhixing-name').value.trim();
        if (!name) {
            if (typeof showToast === 'function') showToast('请输入被执行人姓名/名称');
            return;
        }

        var empty = document.getElementById('zhixing-empty');
        var results = document.getElementById('zhixing-results');
        var tbody = document.getElementById('zhixing-table-body');
        var countEl = document.getElementById('zhixing-result-count');

        if (empty) empty.classList.add('hidden');
        if (results) results.classList.remove('hidden');

        var filtered = mockData.filter(function(item) {
            return item.name.indexOf(name) > -1;
        });

        if (filtered.length === 0) {
            if (empty) {
                empty.classList.remove('hidden');
                empty.innerHTML = '<iconify-icon class="text-5xl text-fg-disabled" icon="mdi:file-question-outline"></iconify-icon><p class="text-sm text-fg-primary mt-3 font-medium">未查询到执行信息</p><p class="text-[10px] text-fg-tertiary mt-1">请核对查询条件是否正确</p>';
            }
            if (results) results.classList.add('hidden');
            return;
        }

        tbody.innerHTML = filtered.map(function(item) {
            return '<tr class="hover:bg-bg-subtle transition-colors">' +
                '<td class="py-3 px-4 text-xs font-mono text-fg-primary">' + item.caseNum + '</td>' +
                '<td class="py-3 px-4 text-xs text-fg-secondary">' + item.name + '</td>' +
                '<td class="py-3 px-4 text-xs text-fg-secondary">' + item.court + '</td>' +
                '<td class="py-3 px-4 text-xs text-fg-tertiary">' + item.date + '</td>' +
                '<td class="py-3 px-4 text-xs text-fg-secondary">' + item.amount + '</td>' +
                '<td class="text-center py-3 px-4">' +
                '<span class="text-[10px] ' + (item.status === '执行中' ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-600') + ' font-medium px-2 py-0.5 rounded-full">' + item.status + '</span>' +
                '</td>' +
                '</tr>';
        }).join('');

        if (countEl) countEl.textContent = '共 ' + filtered.length + ' 条结果';
    }

    function resetZhixing() {
        document.getElementById('zhixing-name').value = '';
        document.getElementById('zhixing-idcard').value = '';
        document.getElementById('zhixing-court').value = '';
        document.getElementById('zhixing-empty').classList.remove('hidden');
        document.getElementById('zhixing-results').classList.add('hidden');
    }

    window.searchZhixing = searchZhixing;
    window.resetZhixing = resetZhixing;
})();
</script>
