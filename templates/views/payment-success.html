<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-4 md:p-6 bg-bg" id="view-payment-success">
<div class="max-w-2xl mx-auto w-full py-4 md:py-8 space-y-6">
    <!-- 成功动画区域 -->
    <div class="text-center" data-animate="scale-in" data-delay="0">
        <div class="relative inline-block">
            <div class="absolute inset-0 bg-gradient-to-br from-success/30 to-green-400/30 rounded-full blur-2xl animate-pulse-soft"></div>
            <div class="relative w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-br from-success to-green-500 flex items-center justify-center mx-auto shadow-2xl shadow-success/30 success-icon-bounce">
                <iconify-icon class="text-5xl md:text-6xl text-white" icon="mdi:check-circle"></iconify-icon>
            </div>
            <div class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-yellow-400 flex items-center justify-center shadow-lg success-confetti" style="animation-delay: 0.3s;">
                <iconify-icon icon="mdi:star" class="text-white text-xs"></iconify-icon>
            </div>
            <div class="absolute -bottom-1 -left-2 w-5 h-5 rounded-full bg-brand flex items-center justify-center shadow-lg success-confetti" style="animation-delay: 0.5s;">
                <iconify-icon icon="mdi:sparkles" class="text-white text-[10px]"></iconify-icon>
            </div>
        </div>
        <div class="mt-6" data-animate="fade-in-up" data-delay="0.2">
            <h2 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-success to-green-500 bg-clip-text text-transparent">支付成功</h2>
            <p class="text-sm text-fg-secondary mt-2" id="success-plan-info">专业版 · 月付已生效</p>
        </div>
    </div>

    <!-- 订单信息卡片 -->
    <div class="ws-card p-5 md:p-6 relative overflow-hidden" data-animate="fade-in-up" data-delay="0.3">
        <div class="absolute top-0 right-0 w-40 h-40 bg-gradient-to-br from-success/5 to-transparent rounded-full -translate-y-1/2 translate-x-1/2"></div>
        <div class="relative z-10">
            <div class="flex items-center gap-2 mb-5">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-success to-green-500 flex items-center justify-center shadow-md shadow-success/20">
                    <iconify-icon icon="mdi:receipt-text-check-outline" class="text-white text-sm"></iconify-icon>
                </div>
                <div>
                    <h3 class="text-base font-bold text-fg-primary">订单详情</h3>
                    <p class="text-[11px] text-fg-tertiary">您的订阅已成功激活</p>
                </div>
            </div>
            <div class="space-y-0">
                <div class="flex justify-between items-center py-3 border-b border-bg-border/50">
                    <span class="text-xs text-fg-tertiary flex items-center gap-1.5">
                        <iconify-icon icon="mdi:numeric" class="text-[11px]"></iconify-icon>
                        订单编号
                    </span>
                    <span class="text-sm font-medium text-fg-secondary font-mono" id="success-order-no">LP20260821001</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-bg-border/50">
                    <span class="text-xs text-fg-tertiary flex items-center gap-1.5">
                        <iconify-icon icon="mdi:crown-outline" class="text-[11px]"></iconify-icon>
                        订阅方案
                    </span>
                    <span class="text-sm font-semibold text-fg-primary" id="success-plan">专业版 · 月付</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-bg-border/50">
                    <span class="text-xs text-fg-tertiary flex items-center gap-1.5">
                        <iconify-icon icon="mdi:cash-multiple" class="text-[11px]"></iconify-icon>
                        支付金额
                    </span>
                    <span class="text-xl font-bold bg-gradient-to-r from-brand to-wiki bg-clip-text text-transparent" id="success-amount">¥299</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-bg-border/50">
                    <span class="text-xs text-fg-tertiary flex items-center gap-1.5">
                        <iconify-icon icon="mdi:calendar-start-outline" class="text-[11px]"></iconify-icon>
                        生效时间
                    </span>
                    <span class="text-sm text-fg-secondary">2026-08-21 15:30</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-bg-border/50">
                    <span class="text-xs text-fg-tertiary flex items-center gap-1.5">
                        <iconify-icon icon="mdi:calendar-end-outline" class="text-[11px]"></iconify-icon>
                        到期时间
                    </span>
                    <span class="text-sm text-fg-secondary" id="success-expiry">2026-09-21</span>
                </div>
                <div class="flex justify-between items-center py-3">
                    <span class="text-xs text-fg-tertiary flex items-center gap-1.5">
                        <iconify-icon icon="mdi:credit-card-outline" class="text-[11px]"></iconify-icon>
                        支付方式
                    </span>
                    <span class="text-sm text-fg-secondary" id="success-payment-method">支付宝</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 推荐升级/加购区域 -->
    <div class="ws-card p-5 md:p-6 relative overflow-hidden bg-gradient-to-br from-brand-tint3/50 to-wiki/10" data-animate="fade-in-up" data-delay="0.4">
        <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-wiki/10 to-transparent rounded-full -translate-y-1/2 translate-x-1/2"></div>
        <div class="relative z-10">
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand to-wiki flex items-center justify-center shadow-md shadow-brand/20 flex-shrink-0">
                    <iconify-icon icon="mdi:lightning-bolt" class="text-white text-lg"></iconify-icon>
                </div>
                <div class="flex-1">
                    <h4 class="text-sm font-bold text-fg-primary">升级年度版，立省 ¥598</h4>
                    <p class="text-xs text-fg-tertiary mt-1">年付用户专享 8.3 折优惠 + 额外赠送 2 个月</p>
                </div>
                <button class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-gradient-to-r from-brand to-wiki text-white shadow-md shadow-brand/20 hover:shadow-lg hover:shadow-brand/30 transition-all duration-300 hover:-translate-y-0.5 flex-shrink-0" onclick="upgradeToYearly()">
                    立即升级
                </button>
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center" data-animate="fade-in-up" data-delay="0.5">
        <button class="px-6 py-3 text-sm font-medium rounded-xl border border-bg-border text-fg-secondary hover:bg-bg-subtle hover:border-bg-border/80 transition-all duration-300 hover:-translate-y-0.5 flex items-center justify-center gap-2 order-2 sm:order-1" onclick="goToMemberCenter()">
            <iconify-icon icon="mdi:credit-card-settings-outline" class="text-base"></iconify-icon>
            查看订阅
        </button>
        <button class="px-6 py-3 text-sm font-semibold rounded-xl bg-gradient-to-r from-brand to-brand-hover text-white hover:shadow-lg hover:shadow-brand/30 transition-all duration-300 hover:-translate-y-0.5 flex items-center justify-center gap-2 order-1 sm:order-2 group" onclick="goToWorkstation()">
            <iconify-icon icon="mdi:rocket-launch-outline" class="text-base group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></iconify-icon>
            开始使用
        </button>
    </div>

    <div class="text-center" data-animate="fade-in-up" data-delay="0.6">
        <button class="text-xs text-fg-tertiary hover:text-fg-secondary transition-colors inline-flex items-center gap-1" onclick="continueBrowsing()">
            <iconify-icon icon="mdi:arrow-left" class="text-[10px]"></iconify-icon>
            继续浏览
        </button>
    </div>
</div>
</div>
