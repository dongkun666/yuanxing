<div class="ta-container">
  <!-- 顶部标题 -->
  <div class="ta-header">
    <div class="ta-title">
      <iconify-icon icon="mdi:office-building-multiple" class="text-brand"></iconify-icon>
      租户管理
    </div>
    <button class="ta-btn ta-btn-primary" onclick="taOpenCreateModal()">
      <iconify-icon icon="mdi:plus"></iconify-icon>
      创建租户
    </button>
  </div>

  <!-- 统计卡片 -->
  <div class="ta-stats-row" id="taStatsRow">
    <div class="ta-stat-card">
      <div class="ta-stat-label">总租户数</div>
      <div class="ta-stat-value" id="taStatTotal">--</div>
    </div>
    <div class="ta-stat-card">
      <div class="ta-stat-label">活跃租户</div>
      <div class="ta-stat-value active" id="taStatActive">--</div>
    </div>
    <div class="ta-stat-card">
      <div class="ta-stat-label">试用中</div>
      <div class="ta-stat-value trialing" id="taStatTrial">--</div>
    </div>
    <div class="ta-stat-card">
      <div class="ta-stat-label">企业版</div>
      <div class="ta-stat-value enterprise" id="taStatEnterprise">--</div>
    </div>
  </div>

  <!-- 工具栏 -->
  <div class="ta-toolbar">
    <div class="ta-search">
      <iconify-icon icon="mdi:magnify" class="ta-search-icon"></iconify-icon>
      <input type="text" class="ta-search-input" id="taSearchInput" placeholder="搜索租户名称、联系人、邮箱..." onkeypress="if(event.key==='Enter') taSearch()">
    </div>
    <select class="ta-filter-select" id="taStatusFilter" onchange="taLoadTenants()">
      <option value="">全部状态</option>
      <option value="active">活跃</option>
      <option value="trialing">试用中</option>
      <option value="suspended">已暂停</option>
      <option value="expired">已过期</option>
    </select>
    <select class="ta-filter-select" id="taTierFilter" onchange="taLoadTenants()">
      <option value="">全部套餐</option>
      <option value="enterprise">企业版</option>
      <option value="professional">专业版</option>
      <option value="basic">基础版</option>
      <option value="free">免费版</option>
    </select>
    <button class="ta-btn ta-btn-default" onclick="taLoadTenants()">
      <iconify-icon icon="mdi:refresh"></iconify-icon>
      刷新
    </button>
  </div>

  <!-- 表格 -->
  <div class="ta-table-wrap">
    <table class="ta-table">
      <thead>
        <tr>
          <th>租户</th>
          <th>套餐</th>
          <th>状态</th>
          <th>联系人</th>
          <th>地区</th>
          <th>创建时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="taTableBody">
        <tr>
          <td colspan="7">
            <div class="ta-loading">加载中...</div>
          </td>
        </tr>
      </tbody>
    </table>
    
    <!-- 分页 -->
    <div class="ta-pagination" id="taPagination">
      <div class="ta-page-info" id="taPageInfo">共 0 条</div>
      <div class="ta-page-btns" id="taPageBtns"></div>
    </div>
  </div>
</div>

<!-- 详情侧边栏 -->
<div class="ta-detail-panel" id="taDetailPanel">
  <div class="ta-detail-header">
    <div class="ta-detail-title" id="taDetailTitle">租户详情</div>
    <button class="ta-detail-close" onclick="taCloseDetail()">
      <iconify-icon icon="mdi:close" class="text-lg"></iconify-icon>
    </button>
  </div>
  <div class="ta-detail-body" id="taDetailBody">
    <div class="ta-loading">加载中...</div>
  </div>
  <div class="ta-detail-footer" id="taDetailFooter" style="display: none;">
    <button class="ta-btn ta-btn-primary" onclick="taEditTenant()">
      <iconify-icon icon="mdi:pencil"></iconify-icon>
      编辑
    </button>
    <button class="ta-btn ta-btn-default" id="taToggleStatusBtn" onclick="taToggleStatus()">
      <iconify-icon icon="mdi:pause"></iconify-icon>
      <span id="taToggleStatusText">暂停</span>
    </button>
    <button class="ta-btn ta-btn-danger" onclick="taDeleteTenant()">
      <iconify-icon icon="mdi:delete"></iconify-icon>
      删除
    </button>
  </div>
</div>

<!-- 创建/编辑租户弹窗 -->
<div class="ta-modal-overlay" id="taCreateModal">
  <div class="ta-modal">
    <div class="ta-modal-header">
      <div class="ta-modal-title" id="taCreateModalTitle">创建租户</div>
      <button class="ta-detail-close" onclick="taCloseCreateModal()">
        <iconify-icon icon="mdi:close"></iconify-icon>
      </button>
    </div>
    <div class="ta-modal-body">
      <div class="ta-form-group">
        <label class="ta-form-label">租户名称<span class="required">*</span></label>
        <input type="text" class="ta-form-input" id="taFormName" placeholder="请输入租户名称">
      </div>
      <div class="ta-form-group">
        <label class="ta-form-label">显示名称</label>
        <input type="text" class="ta-form-input" id="taFormDisplayName" placeholder="请输入显示名称">
      </div>
      <div class="ta-form-group">
        <label class="ta-form-label">套餐等级<span class="required">*</span></label>
        <select class="ta-form-select" id="taFormTier">
          <option value="free">免费版</option>
          <option value="basic">基础版 (¥299/月)</option>
          <option value="professional">专业版 (¥999/月)</option>
          <option value="enterprise">企业版 (¥4999/月)</option>
        </select>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="ta-form-group">
          <label class="ta-form-label">联系人</label>
          <input type="text" class="ta-form-input" id="taFormContactName" placeholder="联系人姓名">
        </div>
        <div class="ta-form-group">
          <label class="ta-form-label">联系电话</label>
          <input type="text" class="ta-form-input" id="taFormContactPhone" placeholder="联系电话">
        </div>
      </div>
      <div class="ta-form-group">
        <label class="ta-form-label">联系邮箱</label>
        <input type="email" class="ta-form-input" id="taFormContactEmail" placeholder="contact@example.com">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="ta-form-group">
          <label class="ta-form-label">地区</label>
          <input type="text" class="ta-form-input" id="taFormRegion" placeholder="如: 北京市">
        </div>
        <div class="ta-form-group">
          <label class="ta-form-label">行业</label>
          <input type="text" class="ta-form-input" id="taFormIndustry" placeholder="如: 法律服务">
        </div>
      </div>
      <div class="ta-form-group">
        <label class="ta-form-label">员工人数</label>
        <input type="number" class="ta-form-input" id="taFormEmployeeCount" placeholder="员工人数" min="0">
      </div>
      <div class="ta-form-group">
        <label class="ta-form-label">地址</label>
        <textarea class="ta-form-textarea" id="taFormAddress" placeholder="详细地址"></textarea>
      </div>
      <div class="ta-form-group">
        <label class="ta-form-label">官网</label>
        <input type="url" class="ta-form-input" id="taFormWebsite" placeholder="https://www.example.com">
      </div>
    </div>
    <div class="ta-modal-footer">
      <button class="ta-btn ta-btn-default" onclick="taCloseCreateModal()">取消</button>
      <button class="ta-btn ta-btn-primary" onclick="taSubmitTenant()">确认</button>
    </div>
  </div>
</div>

<!-- 暂停租户弹窗 -->
<div class="ta-modal-overlay" id="taSuspendModal">
  <div class="ta-modal" style="width: 400px;">
    <div class="ta-modal-header">
      <div class="ta-modal-title">暂停租户</div>
      <button class="ta-detail-close" onclick="taCloseSuspendModal()">
        <iconify-icon icon="mdi:close"></iconify-icon>
      </button>

<script>
  var taCurrentPage = 1;
  var taPageSize = 20;
  var taTotal = 0;
  var taCurrentTenant = null;
  var taEditMode = false;

  function taInit() {
    taLoadStats();
    taLoadTenants();
  }

  function taGetAuthHeaders() {
    var headers = { 'Content-Type': 'application/json' };
    var token = localStorage.getItem('access_token');
    if (token) {
      headers['Authorization'] = 'Bearer ' + token;
    }
    return headers;
  }

  function taLoadStats() {
    fetch('/api/tenants/stats/summary', {
      method: 'GET',
      headers: taGetAuthHeaders()
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      document.getElementById('taStatTotal').textContent = data.total_count || 0;
      document.getElementById('taStatActive').textContent = data.active_count || 0;
      document.getElementById('taStatTrial').textContent = data.trialing_count || 0;
      document.getElementById('taStatEnterprise').textContent = data.enterprise_count || 0;
    })
    .catch(function() {
      document.getElementById('taStatTotal').textContent = '5';
      document.getElementById('taStatActive').textContent = '3';
      document.getElementById('taStatTrial').textContent = '1';
      document.getElementById('taStatEnterprise').textContent = '1';
    });
  }

  function taSearch() {
    taCurrentPage = 1;
    taLoadTenants();
  }

  function taLoadTenants() {
    var search = document.getElementById('taSearchInput').value;
    var status = document.getElementById('taStatusFilter').value;
    var tier = document.getElementById('taTierFilter').value;

    var params = new URLSearchParams();
    params.append('page', taCurrentPage);
    params.append('size', taPageSize);
    if (search) params.append('search', search);
    if (status) params.append('status', status);
    if (tier) params.append('tier', tier);

    fetch('/api/tenants?' + params.toString(), {
      method: 'GET',
      headers: taGetAuthHeaders()
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      taTotal = data.total || 0;
      taRenderTable(data.tenants || []);
      taRenderPagination();
    })
    .catch(function() {
      var mockTenants = [
        { tenant_id: 'tnt_abc123def456', name: '北京市中正律师事务所', display_name: '中正律所', status: 'active', tier: 'enterprise', contact_name: '张律师', contact_email: 'zhang@zhongzheng-law.com', region: '北京市', industry: '法律服务', employee_count: 120, created_at: '2025-06-15T09:30:00+08:00' },
        { tenant_id: 'tnt_def789ghi012', name: '上海明达律师事务所', display_name: '明达律所', status: 'active', tier: 'professional', contact_name: '李律师', contact_email: 'li@mingda-law.com', region: '上海市', industry: '法律服务', employee_count: 45, created_at: '2025-09-20T11:00:00+08:00' },
        { tenant_id: 'tnt_ghi345jkl678', name: '深圳创新科技有限公司', display_name: '创新科技', status: 'active', tier: 'basic', contact_name: '王经理', contact_email: 'wang@innovation-tech.com', region: '广东省', industry: '互联网科技', employee_count: 200, created_at: '2026-01-10T15:30:00+08:00' },
        { tenant_id: 'tnt_jkl901mno234', name: '广州恒信会计师事务所', display_name: '恒信会计', status: 'trialing', tier: 'professional', contact_name: '陈会计师', contact_email: 'chen@hengxin-cpa.com', region: '广东省', industry: '会计审计', employee_count: 30, created_at: '2026-06-25T10:00:00+08:00' },
        { tenant_id: 'tnt_mno567pqr890', name: '北京天元企业管理咨询', display_name: '天元咨询', status: 'suspended', tier: 'basic', contact_name: '刘顾问', contact_email: 'liu@tianyuan-consulting.com', region: '北京市', industry: '企业咨询', employee_count: 15, created_at: '2025-12-01T09:00:00+08:00' },
      ];
      
      var filtered = mockTenants;
      if (search) {
        var searchLower = search.toLowerCase();
        filtered = filtered.filter(function(t) {
          return t.name.toLowerCase().indexOf(searchLower) >= 0 ||
                 (t.display_name || '').toLowerCase().indexOf(searchLower) >= 0 ||
                 (t.contact_name || '').toLowerCase().indexOf(searchLower) >= 0 ||
                 (t.contact_email || '').toLowerCase().indexOf(searchLower) >= 0;
        });
      }
      if (status) filtered = filtered.filter(function(t) { return t.status === status; });
      if (tier) filtered = filtered.filter(function(t) { return t.tier === tier; });
      
      taTotal = filtered.length;
      var start = (taCurrentPage - 1) * taPageSize;
      var paged = filtered.slice(start, start + taPageSize);
      taRenderTable(paged);
      taRenderPagination();
    });
  }

  function taRenderTable(tenants) {
    var tbody = document.getElementById('taTableBody');
    if (!tenants || tenants.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="ta-empty"><div class="ta-empty-icon">📭</div>暂无租户数据</div></td></tr>';
      return;
    }

    var html = '';
    for (var i = 0; i < tenants.length; i++) {
      var t = tenants[i];
      var statusClass = t.status;
      var statusText = { 'active': '活跃', 'trialing': '试用中', 'suspended': '已暂停', 'expired': '已过期' }[t.status] || t.status;
      var tierText = { 'enterprise': '企业版', 'professional': '专业版', 'basic': '基础版', 'free': '免费版' }[t.tier] || t.tier;
      
      html += '<tr>' +
        '<td>' +
          '<div class="ta-tenant-name">' + (t.display_name || t.name) + '</div>' +
          '<div class="ta-tenant-id">' + t.tenant_id + '</div>' +
        '</td>' +
        '<td><span class="ta-tier-badge ' + t.tier + '">' + tierText + '</span></td>' +
        '<td><span class="ta-status-badge ' + t.status + '">● ' + statusText + '</span></td>' +
        '<td>' +
          '<div>' + (t.contact_name || '-') + '</div>' +
          '<div style="font-size: 12px; color: #86909C;">' + (t.contact_email || '-') + '</div>' +
        '</td>' +
        '<td>' + (t.region || '-') + '</td>' +
        '<td style="font-size: 13px; color: #86909C;">' + taFormatDate(t.created_at) + '</td>' +
        '<td>' +
          '<div class="ta-actions">' +
            '<span class="ta-action-link" onclick="taViewDetail(\'' + t.tenant_id + '\')">详情</span>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }
    tbody.innerHTML = html;
  }

  function taRenderPagination() {
    var totalPages = Math.ceil(taTotal / taPageSize) || 1;
    document.getElementById('taPageInfo').textContent = '共 ' + taTotal + ' 条';

    var btns = '';
    btns += '<button class="ta-page-btn" onclick="taGoToPage(' + (taCurrentPage - 1) + ')" ' + (taCurrentPage <= 1 ? 'disabled' : '') + '>上一页</button>';
    
    var startPage = Math.max(1, taCurrentPage - 2);
    var endPage = Math.min(totalPages, taCurrentPage + 2);
    if (startPage > 1) btns += '<button class="ta-page-btn" onclick="taGoToPage(1)">1</button>';
    if (startPage > 2) btns += '<span style="padding: 0 4px; color: #86909C;">...</span>';
    
    for (var p = startPage; p <= endPage; p++) {
      btns += '<button class="ta-page-btn ' + (p === taCurrentPage ? 'active' : '') + '" onclick="taGoToPage(' + p + ')">' + p + '</button>';
    }
    
    if (endPage < totalPages - 1) btns += '<span style="padding: 0 4px; color: #86909C;">...</span>';
    if (endPage < totalPages) btns += '<button class="ta-page-btn" onclick="taGoToPage(' + totalPages + ')">' + totalPages + '</button>';
    
    btns += '<button class="ta-page-btn" onclick="taGoToPage(' + (taCurrentPage + 1) + ')" ' + (taCurrentPage >= totalPages ? 'disabled' : '') + '>下一页</button>';
    
    document.getElementById('taPageBtns').innerHTML = btns;
  }

  function taGoToPage(page) {
    var totalPages = Math.ceil(taTotal / taPageSize) || 1;
    if (page < 1 || page > totalPages) return;
    taCurrentPage = page;
    taLoadTenants();
  }

  function taFormatDate(dateStr) {
    if (!dateStr) return '-';
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function taViewDetail(tenantId) {
    taCurrentTenant = null;
    document.getElementById('taDetailFooter').style.display = 'none';
    document.getElementById('taDetailBody').innerHTML = '<div class="ta-loading">加载中...</div>';
    document.getElementById('taDetailPanel').classList.add('open');

    fetch('/api/tenants/' + tenantId, {
      method: 'GET',
      headers: taGetAuthHeaders()
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      taCurrentTenant = data;
      taRenderDetail(data);
    })
    .catch(function() {
      var mock = {
        tenant_id: tenantId,
        name: '北京市中正律师事务所',
        display_name: '中正律所',
        status: 'active',
        tier: 'enterprise',
        isolation_level: 'row',
        contact_name: '张律师',
        contact_email: 'zhang@zhongzheng-law.com',
        contact_phone: '010-12345678',
        region: '北京市',
        address: '北京市朝阳区建国路88号',
        website: 'https://www.zhongzheng-law.com',
        industry: '法律服务',
        employee_count: 120,
        created_at: '2025-06-15T09:30:00+08:00',
        updated_at: '2026-06-28T14:20:00+08:00',
        activated_at: '2025-07-01T10:00:00+08:00',
      };
      taCurrentTenant = mock;
      taRenderDetail(mock);
    });
  }

  function taRenderDetail(tenant) {
    document.getElementById('taDetailTitle').textContent = tenant.display_name || tenant.name;
    
    var statusText = { 'active': '活跃', 'trialing': '试用中', 'suspended': '已暂停', 'expired': '已过期' }[tenant.status] || tenant.status;
    var tierText = { 'enterprise': '企业版', 'professional': '专业版', 'basic': '基础版', 'free': '免费版' }[tenant.tier] || tenant.tier;

    var html = '';
    
    html += '<div class="ta-detail-section">' +
      '<div class="ta-detail-section-title"><iconify-icon icon="mdi:information-outline"></iconify-icon>基本信息</div>' +
      '<div class="ta-detail-grid">' +
        '<div class="ta-detail-item"><span class="ta-detail-label">租户名称</span><span class="ta-detail-value">' + tenant.name + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">显示名称</span><span class="ta-detail-value">' + (tenant.display_name || '-') + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">租户 ID</span><span class="ta-detail-value" style="font-family: monospace; font-size: 12px;">' + tenant.tenant_id + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">套餐等级</span><span class="ta-detail-value"><span class="ta-tier-badge ' + tenant.tier + '">' + tierText + '</span></span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">状态</span><span class="ta-detail-value"><span class="ta-status-badge ' + tenant.status + '">● ' + statusText + '</span></span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">隔离级别</span><span class="ta-detail-value">' + tenant.isolation_level + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">创建时间</span><span class="ta-detail-value">' + taFormatDate(tenant.created_at) + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">激活时间</span><span class="ta-detail-value">' + taFormatDate(tenant.activated_at) + '</span></div>' +
      '</div>' +
    '</div>';

    html += '<div class="ta-detail-section">' +
      '<div class="ta-detail-section-title"><iconify-icon icon="mdi:account-circle"></iconify-icon>联系方式</div>' +
      '<div class="ta-detail-grid">' +
        '<div class="ta-detail-item"><span class="ta-detail-label">联系人</span><span class="ta-detail-value">' + (tenant.contact_name || '-') + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">联系电话</span><span class="ta-detail-value">' + (tenant.contact_phone || '-') + '</span></div>' +
        '<div class="ta-detail-item full"><span class="ta-detail-label">联系邮箱</span><span class="ta-detail-value">' + (tenant.contact_email || '-') + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">地区</span><span class="ta-detail-value">' + (tenant.region || '-') + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">行业</span><span class="ta-detail-value">' + (tenant.industry || '-') + '</span></div>' +
        '<div class="ta-detail-item"><span class="ta-detail-label">员工人数</span><span class="ta-detail-value">' + (tenant.employee_count || '-') + ' 人</span></div>' +
        '<div class="ta-detail-item full"><span class="ta-detail-label">地址</span><span class="ta-detail-value">' + (tenant.address || '-') + '</span></div>' +
        '<div class="ta-detail-item full"><span class="ta-detail-label">官网</span><span class="ta-detail-value">' + (tenant.website || '-') + '</span></div>' +
      '</div>' +
    '</div>';

    taLoadQuota(tenant.tenant_id, function(quota) {
      var quotaHtml = '<div class="ta-detail-section">' +
        '<div class="ta-detail-section-title"><iconify-icon icon="mdi:chart-bar"></iconify-icon>配额使用</div>';
      
      var quotaItems = [
        { name: '用户数', used: quota.used_users, max: quota.max_users, unit: '人' },
        { name: '存储空间', used: Math.round(quota.used_storage_bytes / (1024*1024*1024) * 100) / 100, max: quota.max_storage_gb, unit: 'GB' },
        { name: 'API 调用', used: quota.used_api_calls, max: quota.max_api_calls_monthly, unit: '次' },
        { name: '案例数', used: quota.used_cases, max: quota.max_cases, unit: '个' },
        { name: '文档数', used: quota.used_documents, max: quota.max_documents, unit: '个' },
        { name: 'AI 点数', used: quota.used_ai_credits, max: quota.max_ai_credits_monthly, unit: '点' },
      ];

      for (var i = 0; i < quotaItems.length; i++) {
        var item = quotaItems[i];
        var percent = Math.min(100, Math.round((item.used / item.max) * 100));
        var level = percent < 70 ? 'ok' : (percent < 90 ? 'warn' : 'danger');
        quotaHtml += '<div class="ta-quota-item">' +
          '<div class="ta-quota-header">' +
            '<span class="ta-quota-name">' + item.name + '</span>' +
            '<span class="ta-quota-numbers">' + item.used.toLocaleString() + ' / ' + item.max.toLocaleString() + ' ' + item.unit + '</span>' +
          '</div>' +
          '<div class="ta-quota-bar"><div class="ta-quota-fill ' + level + '" style="width: ' + percent + '%;"></div></div>' +
        '</div>';
      }
      
      quotaHtml += '</div>';
      
      taLoadBilling(tenant.tenant_id, function(billing) {
        var billingHtml = '<div class="ta-detail-section">' +

            '<div class="ta-detail-item"><span class="ta-detail-label">当前套餐</span><span class="ta-detail-value">' + billing.plan_name + '</span></div>' +
            '<div class="ta-detail-item"><span class="ta-detail-label">计费周期</span><span class="ta-detail-value">' + (billing.billing_cycle === 'yearly' ? '年付' : '月付') + '</span></div>' +
            '<div class="ta-detail-item"><span class="ta-detail-label">月费</span><span class="ta-detail-value">¥' + billing.price_monthly.toLocaleString() + '</span></div>' +
            '<div class="ta-detail-item"><span class="ta-detail-label">年费</span><span class="ta-detail-value">¥' + billing.price_yearly.toLocaleString() + '</span></div>' +
            '<div class="ta-detail-item"><span class="ta-detail-label">当前周期开始</span><span class="ta-detail-value">' + taFormatDate(billing.current_period_start) + '</span></div>' +
            '<div class="ta-detail-item"><span class="ta-detail-label">当前周期结束</span><span class="ta-detail-value">' + taFormatDate(billing.current_period_end) + '</span></div>' +
            '<div class="ta-detail-item"><span class="ta-detail-label">自动续费</span><span class="ta-detail-value">' + (billing.auto_renew ? '是' : '否') + '</span></div>' +
            '<div class="ta-detail-item"><span class="ta-detail-label">累计消费</span><span class="ta-detail-value">¥' + billing.total_spent.toLocaleString() + '</span></div>' +
          '</div>' +
        '</div>';
        
        document.getElementById('taDetailBody').innerHTML = html + quotaHtml + billingHtml;
      });
    });

    if (tenant.status === 'active' || tenant.status === 'trialing') {

    } else {
      toggleText.textContent = '激活';
      toggleBtn.querySelector('iconify-icon').setAttribute('icon', 'mdi:play');
    }
  }

      contact_email: document.getElementById('taFormContactEmail').value.trim() || null,
      region: document.getElementById('taFormRegion').value.trim() || null,
      industry: document.getElementById('taFormIndustry').value.trim() || null,
      employee_count: parseInt(document.getElementById('taFormEmployeeCount').value) || null,
      address: document.getElementById('taFormAddress').value.trim() || null,
      website: document.getElementById('taFormWebsite').value.trim() || null,
    };

    var url = '/api/tenants';
    var method = 'POST';
    if (taEditMode && taCurrentTenant) {
      url = '/api/tenants/' + taCurrentTenant.tenant_id;
      method = 'PUT';
    }

    fetch(url, {
      method: method,
      headers: taGetAuthHeaders(),
      body: JSON.stringify(data)
    })
    .then(function(res) { return res.json(); })
    .then(function() {
      taCloseCreateModal();
      taLoadTenants();
      taLoadStats();
      if (taCurrentTenant) {
        taViewDetail(taCurrentTenant.tenant_id);
      }
    })
    .catch(function() {
      taCloseCreateModal();
      taLoadTenants();
      taLoadStats();
    });
  }

  function taToggleStatus() {
    if (!taCurrentTenant) return;
    if (taCurrentTenant.status === 'active' || taCurrentTenant.status === 'trialing') {
      document.getElementById('taSuspendReason').value = '';
      document.getElementById('taSuspendModal').classList.add('show');
    } else {
      fetch('/api/tenants/' + taCurrentTenant.tenant_id + '/activate', {
        method: 'POST',
        headers: taGetAuthHeaders()
      })
      .then(function() {
        taViewDetail(taCurrentTenant.tenant_id);
        taLoadTenants();
        taLoadStats();
      })
      .catch(function() {
        taViewDetail(taCurrentTenant.tenant_id);
        taLoadTenants();
        taLoadStats();
      });
    }
  }

  function taCloseSuspendModal() {
    document.getElementById('taSuspendModal').classList.remove('show');
  }

  function taConfirmSuspend() {
    if (!taCurrentTenant) return;
    var reason = document.getElementById('taSuspendReason').value.trim();
    
    fetch('/api/tenants/' + taCurrentTenant.tenant_id + '/suspend', {
      method: 'POST',
      headers: taGetAuthHeaders(),
      body: JSON.stringify({ reason: reason || null })
    })
    .then(function() {
      taCloseSuspendModal();
      taViewDetail(taCurrentTenant.tenant_id);
      taLoadTenants();
      taLoadStats();
    })
    .catch(function() {
      taCloseSuspendModal();
      taViewDetail(taCurrentTenant.tenant_id);
      taLoadTenants();
      taLoadStats();
    });
  }

  function taDeleteTenant() {
    if (!taCurrentTenant) return;
    document.getElementById('taDeleteModal').classList.add('show');
  }

  function taCloseDeleteModal() {
    document.getElementById('taDeleteModal').classList.remove('show');
  }

  function taConfirmDelete() {
    if (!taCurrentTenant) return;
    
    fetch('/api/tenants/' + taCurrentTenant.tenant_id, {
      method: 'DELETE',
      headers: taGetAuthHeaders()
    })
    .then(function() {
      taCloseDeleteModal();
      taCloseDetail();
      taLoadTenants();
      taLoadStats();
    })
    .catch(function() {
      taCloseDeleteModal();
      taCloseDetail();
      taLoadTenants();
      taLoadStats();
    });
  }

  if (typeof switchView === 'function') {
    var originalSwitchView = switchView;
    switchView = function(view) {
      if (view === 'tenant-admin') {
        setTimeout(taInit, 100);
      }
      return originalSwitchView.apply(this, arguments);
    };
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('view-tenant-admin') && 
        !document.getElementById('view-tenant-admin').classList.contains('hidden')) {
      taInit();
    }
  });
</script>
