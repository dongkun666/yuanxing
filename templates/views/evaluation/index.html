<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型评测 - LexPrime</title>
    <script src="/static/libs/jquery/jquery.min.js"></script>
    <script src="/static/libs/layui/layui.js"></script>
    <link rel="stylesheet" href="/static/libs/layui/css/layui.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .evaluation-container {
            padding: 20px;
        }
        .stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #1e9fff;
            margin-bottom: 8px;
        }
        .stat-card .stat-label {
            color: #666;
            font-size: 14px;
        }
        .chart-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }
        .comparison-bar {
            margin-bottom: 16px;
        }
        .comparison-bar .bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .comparison-bar .bar-track {
            height: 24px;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .comparison-bar .bar-fill {
            height: 100%;
            border-radius: 12px;
            transition: width 0.5s ease;
        }
        .bar-fill.model1 {
            background: linear-gradient(90deg, #1e9fff, #009688);
        }
        .bar-fill.model2 {
            background: linear-gradient(90deg, #ffb800, #ff5722);
        }
        .error-item {
            background: #f9f9f9;
            border-left: 4px solid #ff5722;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 0 4px 4px 0;
        }
        .error-item .error-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .error-item .error-type {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #fff;
        }
        .error-type.false_negative {
            background: #ff5722;
        }
        .error-type.false_positive {
            background: #ffb800;
        }
        .severity-high {
            color: #ff5722;
        }
        .severity-medium {
            color: #ffb800;
        }
        .severity-low {
            color: #5fb878;
        }
        .suggestion-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .suggestion-item .suggestion-num {
            width: 28px;
            height: 28px;
            background: #1e9fff;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .suggestion-item .suggestion-text {
            line-height: 1.6;
            color: #333;
        }
        .task-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .task-status.pending {
            background: #e6e6e6;
            color: #666;
        }
        .task-status.running {
            background: #e6f7ff;
            color: #1e9fff;
        }
        .task-status.completed {
            background: #f0ffeb;
            color: #5fb878;
        }
        .task-status.failed {
            background: #fff0f0;
            color: #ff5722;
        }
        .progress-bar {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e9fff, #009688);
            transition: width 0.3s ease;
        }
        .category-tabs {
            margin-bottom: 20px;
        }
        .report-section {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .report-summary {
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .winner-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
        }
        .dataset-card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #eee;
            transition: all 0.2s;
        }
        .dataset-card:hover {
            border-color: #1e9fff;
            box-shadow: 0 4px 12px rgba(30, 159, 255, 0.15);
        }
        .dataset-meta {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            font-size: 12px;
            color: #999;
        }
        .category-tag {
            display: inline-block;
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 4px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="evaluation-container">
        <div class="layui-row" style="margin-bottom: 20px;">
            <div class="layui-col-md12">
                <div class="page-header">
                    <h2>模型评测</h2>
                    <p class="page-desc">管理法律 AI 模型评测任务，对比模型性能，生成评测报告</p>
                </div>
            </div>
        </div>

        <div class="layui-row">
            <div class="layui-col-md12">
                <div class="layui-tab category-tabs" lay-filter="evalTabs">

                        <li>评测数据集</li>
                        <li>模型对比</li>
                        <li>错误分析</li>
                        <li>评测报告</li>
                    </ul>
                    <div class="layui-tab-content">
                        <div class="layui-tab-item layui-show">
                            <div id="tasksView">
                                <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                                    <div class="layui-btn-group">
                                        <button class="layui-btn" id="newTaskBtn">
                                            <i class="layui-icon layui-icon-add-1"></i>新建评测任务
                                        </button>
                                        <button class="layui-btn layui-btn-normal" id="refreshTasksBtn">
                                            <i class="layui-icon layui-icon-refresh"></i>刷新
                                        </button>
                                    </div>
                                    <div>
                                        <select id="taskStatusFilter" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                                            <option value="">全部状态</option>
                                            <option value="pending">待运行</option>
                                            <option value="running">运行中</option>
                                            <option value="completed">已完成</option>
                                            <option value="failed">失败</option>
                                        </select>
                                    </div>
                                </div>

                                <div id="tasksList">
                                    <div style="text-align: center; padding: 40px; color: #999;">
                                        <i class="layui-icon layui-icon-loading-1 layui-anim layui-anim-rotate layui-anim-loop" style="font-size: 32px;"></i>
                                        <p>加载中...</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="layui-tab-item">
                            <div id="datasetsView">
                                <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                                    <div class="layui-btn-group">
                                        <button class="layui-btn" id="newDatasetBtn">
                                            <i class="layui-icon layui-icon-add-1"></i>创建数据集
                                        </button>
                                        <button class="layui-btn layui-btn-warm" id="generateDatasetBtn">
                                            <i class="layui-icon layui-icon-template-1"></i>自动生成
                                        </button>
                                    </div>
                                    <div>
                                        <select id="datasetTypeFilter" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                                            <option value="">全部类型</option>
                                            <option value="case_retrieval">案例检索</option>
                                            <option value="law_reference">法规引用</option>
                                            <option value="contract_review">合同审查</option>
                                            <option value="qa">法律问答</option>
                                        </select>
                                    </div>
                                </div>

                                <div id="datasetsList">
                                    <div style="text-align: center; padding: 40px; color: #999;">
                                        <i class="layui-icon layui-icon-loading-1 layui-anim layui-anim-rotate layui-anim-loop" style="font-size: 32px;"></i>
                                        <p>加载中...</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="layui-tab-item">
                            <div id="comparisonView">
                                <div style="margin-bottom: 20px;">
                                    <label>选择评测任务：</label>
                                    <select id="compareTaskSelect" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd; min-width: 300px;">
                                        <option value="">请选择已完成的评测任务</option>
                                    </select>
                                    <button class="layui-btn" id="loadComparisonBtn" style="margin-left: 12px;">

                                    </button>
                                </div>

                                <div id="comparisonContent" style="display: none;">

                                            <div class="chart-container">
                                                <div class="chart-title">模型性能对比</div>
                                                <div id="comparisonBars"></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="layui-row" style="margin-top: 20px;">
                                        <div class="layui-col-md6">
                                            <div class="chart-container">
                                                <div class="chart-title">精度指标对比</div>
                                                <div id="precisionComparison"></div>
                                            </div>
                                        </div>

                                            <div class="chart-container">

                                                <div id="recallComparison"></div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="layui-row" style="margin-top: 20px;">

                                                <table class="layui-table">

                                                        <tr>
                                                            <th>指标</th>
                                                            <th id="model1Name">模型1</th>
                                                            <th id="model2Name">模型2</th>
                                                            <th>差距</th>
                                                            <th>优胜</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="comparisonTableBody"></tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="layui-tab-item">
                            <div id="errorAnalysisView">
                                <div style="margin-bottom: 20px;">
                                    <label>选择评测任务：</label>
                                    <select id="errorTaskSelect" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd; min-width: 300px;">
                                        <option value="">请选择已完成的评测任务</option>
                                    </select>
                                    <label style="margin-left: 12px;">错误类型：</label>
                                    <select id="errorTypeFilter" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                                        <option value="">全部类型</option>
                                        <option value="false_negative">假阴性</option>
                                        <option value="false_positive">假阳性</option>
                                    </select>
                                    <button class="layui-btn" id="loadErrorsBtn" style="margin-left: 12px;">
                                        <i class="layui-icon layui-icon-search"></i>加载错误
                                    </button>
                                </div>

                                <div id="errorList">
                                    <div style="text-align: center; padding: 40px; color: #999;">
                                        请选择评测任务查看错误案例
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="layui-tab-item">
                            <div id="reportView">
                                <div style="margin-bottom: 20px;">
                                    <label>选择评测任务：</label>
                                    <select id="reportTaskSelect" style="padding: 8px; border-radius: 4px; border: 1px solid #ddd; min-width: 300px;">
                                        <option value="">请选择已完成的评测任务</option>
                                    </select>
                                    <button class="layui-btn" id="generateReportBtn" style="margin-left: 12px;">
                                        <i class="layui-icon layui-icon-file"></i>生成报告
                                    </button>
                                    <button class="layui-btn layui-btn-normal" id="exportReportBtn" style="display: none;">
                                        <i class="layui-icon layui-icon-download-circle"></i>导出报告
                                    </button>
                                </div>

                                <div id="reportContent" style="display: none;">
                                    <div class="report-section">
                                        <h3 style="margin-bottom: 16px;">评测概述</h3>
                                        <div class="report-summary">
                                            <p id="reportSummary" style="line-height: 1.8; font-size: 14px;"></p>
                                            <div style="margin-top: 12px;">
                                                <span style="color: #666;">综合优胜模型：</span>
                                                <span class="winner-badge" id="reportWinner"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="report-section">
                                        <h3 style="margin-bottom: 16px;">模型对比详情</h3>
                                        <table class="layui-table">
                                            <thead>
                                                <tr>
                                                    <th>模型</th>
                                                    <th>Precision</th>
                                                    <th>Recall</th>
                                                    <th>F1 Score</th>
                                                    <th>Accuracy</th>
                                                    <th>NDCG</th>
                                                    <th>平均延迟</th>
                                                </tr>
                                            </thead>
                                            <tbody id="reportComparisonTable"></tbody>
                                        </table>
                                    </div>

                                    <div class="report-section">
                                        <h3 style="margin-bottom: 16px;">错误分析</h3>
                                        <div id="reportErrorAnalysis" style="line-height: 1.8; white-space: pre-wrap;"></div>
                                    </div>

                                    <div class="report-section">
                                        <h3 style="margin-bottom: 16px;">改进建议</h3>
                                        <div id="reportSuggestions"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    layui.use(['element', 'layer', 'form'], function() {
        var element = layui.element;
        var layer = layui.layer;
        var form = layui.form;

        var currentReportData = null;

        function formatNumber(num) {
            if (typeof num !== 'number') return '0.0000';
            return num.toFixed(4);
        }

        function formatPercent(num) {
            if (typeof num !== 'number') return '0%';
            return (num * 100).toFixed(2) + '%';
        }

        function getStatusClass(status) {
            var map = {
                'pending': 'pending',
                'running': 'running',
                'completed': 'completed',
                'failed': 'failed'
            };
            return map[status] || 'pending';
        }

        function getStatusText(status) {
            var map = {
                'pending': '待运行',
                'running': '运行中',
                'completed': '已完成',
                'failed': '失败'
            };
            return map[status] || status;
        }

        function getTaskTypeName(type) {
            var map = {
                'case_retrieval': '案例检索',
                'law_reference': '法规引用',
                'contract_review': '合同审查',
                'qa': '法律问答',
                'summarization': '文本摘要',
                'embedding': '向量嵌入'
            };
            return map[type] || type;
        }

        function loadTasks() {
            var statusFilter = $('#taskStatusFilter').val();

            var mockTasks = [
                {
                    task_id: 'task-001',
                    name: 'Embedding 模型对比评测',
                    description: '对比 v1.0 和 v1.1 Embedding 模型在案例检索上的表现',
                    task_type: 'case_retrieval',
                    model_ids: ['mv-001', 'mv-002'],
                    dataset_id: 'ds-bench-001',
                    status: 'completed',
                    progress: 1.0,
                    created_at: '2026-06-15T09:00:00',
                    total_samples: 1000,
                    processed_samples: 1000
                },
                {
                    task_id: 'task-002',
                    name: '合同审查模型评测',
                    description: '评测合同审查模型的风险召回率',
                    task_type: 'contract_review',
                    model_ids: ['mv-003'],
                    dataset_id: 'ds-bench-003',
                    status: 'completed',
                    progress: 1.0,
                    created_at: '2026-06-20T13:00:00',
                    total_samples: 200,
                    processed_samples: 200
                },
                {
                    task_id: 'task-003',
                    name: 'RAG 系统效果评测',
                    description: '评测 RAG 系统的问答准确率',
                    task_type: 'qa',
                    model_ids: ['rag-v1', 'rag-v2'],
                    dataset_id: 'ds-bench-004',
                    status: 'running',
                    progress: 0.65,
                    created_at: '2026-07-03T09:00:00',
                    total_samples: 800,
                    processed_samples: 520
                }
            ];

            var filtered = statusFilter
                ? mockTasks.filter(function(t) { return t.status === statusFilter; })
                : mockTasks;

            var html = '';
            filtered.forEach(function(task) {
                html += '<div class="dataset-card">';
                html += '  <div style="display: flex; justify-content: space-between; align-items: flex-start;">';
                html += '    <div>';
                html += '      <h4 style="margin: 0 0 8px 0; color: #333;">' + task.name + '</h4>';
                html += '      <p style="color: #666; font-size: 13px; margin-bottom: 8px;">' + task.description + '</p>';
                html += '      <div class="dataset-meta">';
                html += '        <span><i class="layui-icon layui-icon-database"></i> ' + getTaskTypeName(task.task_type) + '</span>';
                html += '        <span><i class="layui-icon layui-icon-group"></i> ' + task.model_ids.length + ' 个模型</span>';
                html += '        <span><i class="layui-icon layui-icon-file-b"></i> ' + task.total_samples + ' 样本</span>';
                html += '        <span><i class="layui-icon layui-icon-time"></i> ' + task.created_at.split('T')[0] + '</span>';
                html += '      </div>';
                html += '    </div>';
                html += '    <div style="text-align: right;">';
                html += '      <span class="task-status ' + getStatusClass(task.status) + '">' + getStatusText(task.status) + '</span>';
                html += '    </div>';
                html += '  </div>';
                html += '  <div style="margin-top: 12px;">';
                if (task.status === 'running') {
                    html += '    <div class="progress-bar"><div class="progress-fill" style="width: ' + (task.progress * 100) + '%;"></div></div>';
                    html += '    <div style="margin-top: 6px; font-size: 12px; color: #999;">';
                    html += '      进度：' + (task.progress * 100).toFixed(1) + '% (' + task.processed_samples + '/' + task.total_samples + ')';
                    html += '    </div>';
                }
                html += '    <div style="margin-top: 8px;">';
                if (task.status === 'completed') {
                    html += '      <button class="layui-btn layui-btn-xs" onclick="viewTaskResults(\'' + task.task_id + '\')">查看结果</button>';
                    html += '      <button class="layui-btn layui-btn-xs layui-btn-normal" onclick="generateTaskReport(\'' + task.task_id + '\')">生成报告</button>';
                } else if (task.status === 'pending') {
                    html += '      <button class="layui-btn layui-btn-xs layui-btn-warm" onclick="runTask(\'' + task.task_id + '\')">开始评测</button>';
                }
                html += '    </div>';
                html += '  </div>';
                html += '</div>';
            });

            if (filtered.length === 0) {
                html = '<div style="text-align: center; padding: 40px; color: #999;">暂无评测任务</div>';
            }

            $('#tasksList').html(html);
        }

        function loadDatasets() {
            var typeFilter = $('#datasetTypeFilter').val();

            var mockDatasets = [
                {
                    dataset_id: 'ds-bench-001',
                    name: 'LexBench 案例检索基准 v1.0',

                    dataset_type: 'standard',

                    sample_count: 500,

                    },
                    created_at: '2026-05-15T10:00:00',
                    updated_at: '2026-06-10T10:00:00',

                {
                    dataset_id: 'ds-bench-003',
                    name: 'LexBench 合同审查基准 v1.0',

                    dataset_type: 'standard',
                    task_type: 'contract_review',
                    sample_count: 200,
                    categories: {
                        '买卖合同': 50,
                        '借款合同': 40,
                        '劳动合同': 40,
                        '租赁合同': 35,

                    },
                    created_at: '2026-06-01T10:00:00',
                    updated_at: '2026-06-20T10:00:00',
                    status: 'ready'
                },
                {
                    dataset_id: 'ds-bench-004',
                    name: 'LexBench 法律问答基准 v1.0',
                    description: '法律问答准确率评测数据集',
                    dataset_type: 'standard',

                    sample_count: 800,
                    categories: {
                        '民事问答': 300,

        function exportReport() {
            if (!currentReportData) {
                layer.msg('请先生成报告');
                return;
            }

            var md = '# ' + currentReportData.task_name + ' - 评测报告\n\n';
            md += '**生成时间**: ' + currentReportData.created_at + '\n\n';
            md += '## 概述\n\n' + currentReportData.summary + '\n\n';
            md += '**综合优胜**: ' + currentReportData.overall_winner + '\n\n';
            md += '## 模型对比\n\n';
            md += '| 模型 | Precision | Recall | F1 | Accuracy | NDCG |\n';
            md += '|------|-----------|--------|----|----------|------|\n';
            currentReportData.model_comparison.forEach(function(m) {
                md += '| ' + m.model_name + ' | ' + formatNumber(m.precision) + ' | ' + formatNumber(m.recall) + ' | ' + formatNumber(m.f1_score) + ' | ' + formatNumber(m.accuracy) + ' | ' + formatNumber(m.ndcg) + ' |\n';
            });
            md += '\n## 错误分析\n\n';
            md += currentReportData.error_analysis + '\n\n';
            md += '## 改进建议\n\n';
            currentReportData.improvement_suggestions.forEach(function(s, i) {
                md += (i + 1) + '. ' + s + '\n';
            });

            var blob = new Blob([md], { type: 'text/markdown' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = currentReportData.task_name + '-评测报告.md';
            a.click();
            URL.revokeObjectURL(url);

            layer.msg('报告已导出');
        }
