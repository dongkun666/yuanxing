<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-6 bg-bg" id="view-case-progress">
<div class="max-w-6xl mx-auto w-full space-y-5">
    <!-- 顶部说明 -->
    <div class="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-xl border border-blue-100 p-5">
        <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center flex-shrink-0 shadow-sm">
                <iconify-icon class="text-2xl text-brand" icon="mdi:gavel-clock"></iconify-icon>
            </div>
            <div class="flex-1">
                <h1 class="text-lg font-bold text-fg-primary">案件进度跟踪</h1>
                <p class="text-xs text-fg-secondary mt-1">对接中国审判流程信息公开网，输入案号/法院/当事人，实时跟踪案件从立案到执行的全流程进度。</p>
                <p class="text-[10px] text-fg-tertiary mt-1">⚠️ 数据来源：最高人民法院中国审判流程信息公开网，<a class="text-brand hover:underline" href="https://splcgk.court.gov.cn/" target="_blank" rel="noopener">splcgk.court.gov.cn</a></p>
            </div>
        </div>
    </div>

    <!-- 查询表单 -->
    <div class="bg-white rounded-xl border border-bg-border p-5">
        <div class="flex items-center gap-2 mb-3">
            <iconify-icon class="text-base text-fg-tertiary" icon="mdi:magnify-scan"></iconify-icon>
            <h2 class="text-sm font-semibold text-fg-primary">查询条件</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">受理法院</label>
                <input type="text" id="progress-court" placeholder="如: 北京市第一中级人民法院" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors"/>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">案号</label>
                <input type="text" id="progress-case-num" placeholder="如: (2026)京01民初123号" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors" onkeydown="if(event.key==='Enter') searchProgress()"/>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">当事人姓名</label>
                <input type="text" id="progress-party" placeholder="原告/被告任一方" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors" onkeydown="if(event.key==='Enter') searchProgress()"/>
            </div>
        </div>

        <div class="flex items-center justify-between">
            <div class="text-[10px] text-fg-tertiary">
                <iconify-icon class="text-xs" icon="mdi:information-outline"></iconify-icon>
                案号或法院 + 当事人姓名, 至少填一项
            </div>
            <div class="flex items-center gap-2">
                <button class="px-4 py-2 text-sm border border-bg-border text-fg-secondary rounded-lg hover:bg-bg-subtle transition-colors" onclick="resetProgress()">
                    <iconify-icon class="text-base" icon="mdi:refresh"></iconify-icon>
                    重置
                </button>
                <button class="px-4 py-2 text-sm text-white bg-brand hover:bg-blue-600 rounded-lg transition-colors flex items-center gap-1.5" onclick="searchProgress()">
                    <iconify-icon class="text-base" icon="mdi:magnify"></iconify-icon>
                    立即跟踪
                </button>
                <a class="px-3 py-2 text-sm text-brand bg-brand-tint2 hover:bg-brand-tint4 rounded-lg transition-colors flex items-center gap-1" href="https://splcgk.court.gov.cn/" target="_blank" rel="noopener">
                    <iconify-icon class="text-base" icon="mdi:open-in-new"></iconify-icon>
                    官方
                </a>
            </div>
        </div>
    </div>

    <!-- 快捷示例 -->
    <div class="bg-white rounded-xl border border-bg-border p-5">
        <div class="flex items-center gap-2 mb-3">
            <iconify-icon class="text-base text-fg-tertiary" icon="mdi:lightbulb-outline"></iconify-icon>
            <h2 class="text-sm font-semibold text-fg-primary">示例案件</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <button class="text-left p-3 border border-bg-border rounded-lg hover:border-brand hover:bg-brand-tint/30 transition-all" onclick="quickSearchProgress('北京市第一中级人民法院', '(2026)京01民初128号', '李明')">
                <div class="text-xs font-semibold text-fg-primary">示例 1: 民事审理中</div>
                <div class="text-[10px] text-fg-tertiary mt-0.5">(2026)京01民初128号 · 李明</div>
            </button>
            <button class="text-left p-3 border border-bg-border rounded-lg hover:border-brand hover:bg-brand-tint/30 transition-all" onclick="quickSearchProgress('上海市浦东新区人民法院', '(2025)沪0115民初4321号', '王五')">
                <div class="text-xs font-semibold text-fg-primary">示例 2: 已判决</div>
                <div class="text-[10px] text-fg-tertiary mt-0.5">(2025)沪0115民初4321号 · 王五</div>
            </button>
            <button class="text-left p-3 border border-bg-border rounded-lg hover:border-brand hover:bg-brand-tint/30 transition-all" onclick="quickSearchProgress('深圳市中级人民法院', '(2025)粤03民终5678号', '众鑫达')">
                <div class="text-xs font-semibold text-fg-primary">示例 3: 已立案待开庭</div>
                <div class="text-[10px] text-fg-tertiary mt-0.5">(2025)粤03民终5678号 · 众鑫达</div>
            </button>
        </div>
    </div>

    <!-- 查询结果 -->
    <div class="space-y-4 hidden" id="progress-results">
        <!-- 案件基本信息 -->
        <div class="bg-white rounded-xl border border-bg-border p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <iconify-icon class="text-base text-fg-tertiary" icon="mdi:information-outline"></iconify-icon>
                    <h2 class="text-sm font-semibold text-fg-primary">案件基本信息</h2>
                </div>
                <span class="text-[10px] text-fg-tertiary" id="progress-query-time"></span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-xs" id="progress-basic-info">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 进度时间线 -->
        <div class="bg-white rounded-xl border border-bg-border p-5">
            <div class="flex items-center gap-2 mb-4">
                <iconify-icon class="text-base text-fg-tertiary" icon="mdi:timeline-clock-outline"></iconify-icon>
                <h2 class="text-sm font-semibold text-fg-primary">案件进度时间线</h2>
            </div>
            <div class="relative" id="progress-timeline">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 下一步建议 -->
        <div class="bg-gradient-to-r from-amber-50 to-yellow-50 rounded-xl border border-amber-200 p-5">
            <div class="flex items-start gap-3">
                <iconify-icon class="text-2xl text-amber-500 flex-shrink-0" icon="mdi:lightbulb-on-outline"></iconify-icon>
                <div class="flex-1">
                    <h3 class="text-sm font-semibold text-fg-primary">下一步建议</h3>
                    <div class="mt-2 space-y-1.5 text-xs" id="progress-next-steps">
                        <!-- 动态填充 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 空态 -->
    <div class="bg-white rounded-xl border border-bg-border p-12 text-center" id="progress-empty">
        <iconify-icon class="text-5xl text-fg-disabled" icon="mdi:gavel-search"></iconify-icon>
        <p class="text-sm text-fg-tertiary mt-3">请输入案件信息开始跟踪</p>
        <p class="text-[10px] text-fg-disabled mt-1">数据来源: 中国审判流程信息公开网</p>
    </div>
</div>
</div>
