// ============== Tab 切换 ==============
function switchCollabTab(tabName) {
  document.querySelectorAll('.collab-tab').forEach(function(tab) {
    tab.classList.remove('active');
    if (tab.getAttribute('data-tab') === tabName) {
      tab.classList.add('active');
    }
  });

  document.querySelectorAll('.collab-tab-content').forEach(function(content) {
    content.classList.add('hidden');
  });

  var targetContent = document.getElementById('collab-tab-' + tabName);
  if (targetContent) {
    targetContent.classList.remove('hidden');
  }
}

function filterMembersByRole(role) {
  if (role === 'all') {
    renderMembers(mockMembers);
    return;

  var filtered = mockMembers.filter(function(m) {
    return m.role === role;
  });
  renderMembers(filtered);
}

function handleCommentKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendComment();
  }
}

function sendComment() {
  var inputEl = document.getElementById('comment-input');
  if (!inputEl || !inputEl.value.trim()) return;

  var now = new Date();
  var timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

  mockComments.push({
    id: Date.now(),
    author: '我',
    role: '执业律师',
    content: inputEl.value.trim(),
    time: timeStr,
    isMe: true
  });

  inputEl.value = '';
  renderComments();
}

          '<iconify-icon icon="mdi:cloud-upload-outline" class="text-3xl text-brand"></iconify-icon>' +
        '</div>' +
        '<p class="text-sm font-medium text-fg-primary mb-1">点击或拖拽文件到此处上传</p>' +

      '</div>' +

        '<label class="text-xs font-medium text-fg-secondary block mb-1.5">保存位置</label>' +

          '<option>案件材料</option>' +
          '<option>法律文书</option>' +
        '</select>' +

  var footer =

  Utils.showModal({
    id: 'upload-file-modal',

  Utils.showConfirm('确定要清除所有已完成的任务吗？', '清除已完成任务').then(function(confirmed) {

      renderTasks();

  });
}

function handleFileSelect(input) {
  if (input.files && input.files.length > 0) {
    Utils.showToast({
      type: 'success',
      message: '已选择 ' + input.files.length + ' 个文件',
      duration: 2000
    });
  }
}

// ============== 初始化 ==============
document.addEventListener('DOMContentLoaded', function() {
  var view = document.getElementById('view-collaboration');
  if (view && !view.classList.contains('hidden')) {
    initCollaborationPage();
  }
});

function initCollaborationPage() {
  renderMembers(mockMembers);
  renderTasks();
  renderDiscussions();
  renderComments();
  renderFiles();
  renderPermissions();

  if (typeof Animations !== 'undefined' && Animations.initPageAnimations) {
    Animations.initPageAnimations(document.getElementById('view-collaboration'));
  }
}
