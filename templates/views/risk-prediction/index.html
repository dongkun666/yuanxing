<!--
  案件风险预测 - 前端视图
  基于历史案例数据的统计分析，提供胜诉率预测、风险点识别、相似案例对比
-->
<div class="hidden view-content flex-1 flex flex-col overflow-y-auto bg-bg" id="view-risk-prediction" data-view-source="risk-prediction/index.html">
<style>
  .risk-meter {
    position: relative;
    width: 200px;
    height: 100px;
    overflow: hidden;
  }
  .risk-meter-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 200px;
    height: 200px;
    border-radius: 100px 100px 0 0;
    background: conic-gradient(
      from 180deg,
      #00B42A 0deg 36deg,
      #14C9C9 36deg 72deg,
      #165DFF 72deg 108deg,
      #FF7D00 108deg 144deg,
      #F53F3F 144deg 180deg,
      #E5E6EB 180deg 360deg
    );
    clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
  }
  .risk-meter-inner {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 160px;
    height: 160px;
    border-radius: 80px 80px 0 0;
    background: white;
    clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
  }
  .risk-meter-needle {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 3px;
    height: 80px;
    background: #1D2129;
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(-90deg);
    transition: transform 1s ease-out;
    border-radius: 2px;
  }
  .risk-meter-needle::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 16px;
    background: #1D2129;
    border-radius: 50%;
  }
  .risk-meter-value {
    position: absolute;
    bottom: -25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: bold;
    color: #1D2129;
  }
  .risk-meter-label {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #86909C;
  }
  .radar-chart-container {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 0 auto;
  }
  .radar-chart {
    width: 100%;
    height: 100%;
  }
  .risk-tag-low {
    background: #E8F5E9;
    color: #2E7D32;
  }
  .risk-tag-medium {
    background: #FFF7E8;
    color: #D25400;
  }
  .risk-tag-high {
    background: #FCE4E4;
    color: #C62828;
  }
</style>

<div class="flex flex-col min-h-full">
  <!-- 顶部 header -->
  <header class="bg-white border-b border-bg-border sticky top-0 z-30 shadow-sm">
    <div class="px-4 md:px-6 py-3 flex items-center gap-3">
      <button class="w-9 h-9 rounded-md text-fg-secondary hover:bg-brand-tint hover:text-brand flex items-center justify-center flex-shrink-0" onclick="switchView('workstation')" title="返回">
        <iconify-icon icon="mdi:arrow-left" class="text-lg"></iconify-icon>
      </button>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5">
          <h1 class="text-base md:text-lg font-semibold flex items-center gap-1.5 truncate">
            <iconify-icon icon="mdi:chart-box-outline" class="text-urgent text-lg md:text-xl"></iconify-icon>
            <span>案件风险预测</span>
          </h1>
          <span class="inline-flex items-center gap-0.5 text-[10px] text-ai font-medium px-1.5 py-0.5 bg-ai-tint rounded-sm flex-shrink-0">

      </div>

  <!-- 主体内容 -->
  <main class="flex-1 px-4 md:px-6 py-5 md:py-6 max-w-7xl mx-auto w-full">

        <iconify-icon icon="mdi:form-select" class="text-brand"></iconify-icon>

            <option value="知识产权纠纷">知识产权纠纷</option>

      <div class="mt-5 flex items-center justify-between">

    <!-- 预测结果 -->
    <div id="riskResultSection" class="hidden">
      <!-- 核心指标 -->

        <!-- 胜诉率仪表盘 -->

        <!-- 风险等级 -->

          <div class="flex flex-col items-center justify-center py-3">
            <div id="riskLevelBadge" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold risk-tag-medium">
              <iconify-icon icon="mdi:alert-circle-outline" class="text-lg"></iconify-icon>
              <span id="riskLevelText">中等风险</span>
            </div>
            <p class="text-xs text-fg-tertiary mt-3 text-center">
              风险指数：<span id="riskScoreValue" class="font-semibold text-fg-primary">45</span> / 100
            </p>
            <div class="w-full h-2 bg-bg rounded-full mt-3 overflow-hidden">
              <div id="riskScoreBar" class="h-full bg-gradient-to-r from-success via-warning to-urgent rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
            <div class="w-full flex justify-between text-[10px] text-fg-tertiary mt-1">
              <span>低风险</span>
              <span>中风险</span>
              <span>高风险</span>

        </div>

        <!-- 案件摘要 -->
        <div class="bg-white rounded-2xl shadow-card border border-bg-border p-5">
          <h4 class="text-sm font-semibold text-fg-primary mb-4 flex items-center gap-1.5">
            <iconify-icon icon="mdi:text-box-outline" class="text-brand"></iconify-icon>

          <p id="riskSummary" class="text-xs text-fg-secondary leading-relaxed">

      <!-- 风险雷达图 + 风险因素 -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5" data-animate="fade-in-up" data-delay="0.15">
        <!-- 雷达图 -->
        <div class="bg-white rounded-2xl shadow-card border border-bg-border p-5">
          <h4 class="text-sm font-semibold text-fg-primary mb-4 flex items-center gap-1.5">
            <iconify-icon icon="mdi:radar" class="text-wiki"></iconify-icon>
            多维风险雷达
          </h4>
          <div class="radar-chart-container">
            <canvas class="radar-chart" id="riskRadarChart"></canvas>
          </div>
        </div>

        <!-- 风险因素 -->
        <div class="bg-white rounded-2xl shadow-card border border-bg-border p-5">
          <h4 class="text-sm font-semibold text-fg-primary mb-4 flex items-center gap-1.5">
            <iconify-icon icon="mdi:format-list-bulleted" class="text-brand"></iconify-icon>
            风险因素分析
          </h4>
          <div class="space-y-3" id="riskFactorsList">
            <div class="text-center text-fg-tertiary text-sm py-8">
              暂无数据
            </div>
          </div>
        </div>
      </div>

      <!-- 相似案例 -->
      <div class="bg-white rounded-2xl shadow-card border border-bg-border p-5 mb-5" data-animate="fade-in-up" data-delay="0.2">
        <div class="flex items-center justify-between mb-4">
          <h4 class="text-sm font-semibold text-fg-primary flex items-center gap-1.5">
            <iconify-icon icon="mdi:scale-balance" class="text-brand"></iconify-icon>
            相似案例对比
          </h4>
          <button class="text-xs text-brand hover:underline flex items-center gap-1">
            查看更多
            <iconify-icon icon="mdi:chevron-right" class="text-sm"></iconify-icon>
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-[11px] text-fg-tertiary border-b border-bg-border">
                <th class="pb-3 pr-4 font-medium">案件名称</th>
                <th class="pb-3 pr-4 font-medium">审理法院</th>
                <th class="pb-3 pr-4 font-medium">案号</th>
                <th class="pb-3 pr-4 font-medium">相似度</th>
                <th class="pb-3 pr-4 font-medium">裁判结果</th>
                <th class="pb-3 font-medium">标的额</th>
              </tr>
            </thead>
            <tbody id="riskSimilarCases">
              <tr>
                <td colspan="6" class="py-6 text-center text-fg-tertiary text-sm">暂无数据</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 应对建议 -->
      <div class="bg-white rounded-2xl shadow-card border border-bg-border p-5 mb-5" data-animate="fade-in-up" data-delay="0.25">
        <h4 class="text-sm font-semibold text-fg-primary mb-4 flex items-center gap-1.5">
          <iconify-icon icon="mdi:lightbulb-on-outline" class="text-amber-500"></iconify-icon>
          应对建议
        </h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="riskSuggestionsList">
          <div class="text-center text-fg-tertiary text-sm py-4 md:col-span-2">
            暂无数据
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</div>

<script>
(function () {
    'use strict';

    function drawRadarChart(data) {
        var canvas = document.getElementById('riskRadarChart');
        if (!canvas || !data || data.length === 0) {
            return;
        }

        var ctx = canvas.getContext('2d');
        var size = 300;
        canvas.width = size;
        canvas.height = size;

        var centerX = size / 2;
        var centerY = size / 2;
        var maxRadius = 110;
        var levels = 5;
        var sides = data.length;

        ctx.clearRect(0, 0, size, size);

        for (var i = 1; i <= levels; i++) {
            var radius = (maxRadius / levels) * i;
            ctx.beginPath();
            for (var j = 0; j < sides; j++) {
                var angle = (Math.PI * 2 * j / sides) - Math.PI / 2;
                var x = centerX + Math.cos(angle) * radius;
                var y = centerY + Math.sin(angle) * radius;
                if (j === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.strokeStyle = '#E5E6EB';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        for (var k = 0; k < sides; k++) {
            var angle2 = (Math.PI * 2 * k / sides) - Math.PI / 2;
            var x2 = centerX + Math.cos(angle2) * maxRadius;
            var y2 = centerY + Math.sin(angle2) * maxRadius;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#E5E6EB';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        ctx.beginPath();
        for (var m = 0; m < sides; m++) {
            var angle3 = (Math.PI * 2 * m / sides) - Math.PI / 2;
            var value = data[m].score / data[m].max_score;
            var r = maxRadius * value;
            var x3 = centerX + Math.cos(angle3) * r;
            var y3 = centerY + Math.sin(angle3) * r;
            if (m === 0) {
                ctx.moveTo(x3, y3);
            } else {
                ctx.lineTo(x3, y3);
            }
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(22, 93, 255, 0.2)';
        ctx.fill();
        ctx.strokeStyle = '#165DFF';
        ctx.lineWidth = 2;
        ctx.stroke();

        for (var n = 0; n < sides; n++) {
            var angle4 = (Math.PI * 2 * n / sides) - Math.PI / 2;
            var value2 = data[n].score / data[n].max_score;
            var r2 = maxRadius * value2;
            var x4 = centerX + Math.cos(angle4) * r2;
            var y4 = centerY + Math.sin(angle4) * r2;
            ctx.beginPath();
            ctx.arc(x4, y4, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#165DFF';
            ctx.fill();
        }

        ctx.font = '11px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif';
        ctx.fillStyle = '#4E5969';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (var p = 0; p < sides; p++) {
            var angle5 = (Math.PI * 2 * p / sides) - Math.PI / 2;
            var labelRadius = maxRadius + 20;
            var lx = centerX + Math.cos(angle5) * labelRadius;
            var ly = centerY + Math.sin(angle5) * labelRadius;
            ctx.fillText(data[p].dimension, lx, ly);
        }
    }

    function getRiskLevelTag(level) {
        if (level === '低' || level === '低风险') {
            return 'risk-tag-low';
        } else if (level === '高' || level === '高风险') {
            return 'risk-tag-high';
        } else {
            return 'risk-tag-medium';
        }
    }

    function runRiskPrediction() {
        var btn = document.getElementById('riskPredictBtn');
        var resultSection = document.getElementById('riskResultSection');

        if (btn) {
            btn.disabled = true;
            var originalText = btn.innerHTML;
            btn.innerHTML = '<iconify-icon icon="mdi:loading" class="text-base animate-spin"></iconify-icon><span>分析中...</span>';
        }

        var body = {
            case_type: document.getElementById('riskCaseType').value,
            cause: document.getElementById('riskCause').value,
            amount: document.getElementById('riskAmount').value,
            court: document.getElementById('riskCourt').value,
            facts: document.getElementById('riskFacts').value,
            evidence: document.getElementById('riskEvidence').value,
            claims: document.getElementById('riskClaims').value
        };

        fetch('/api/risk/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (resultSection) {
                    resultSection.classList.remove('hidden');
                }
                renderRiskResult(data);
            })
            .catch(function () {
                var mockData = getMockRiskData();
                if (resultSection) {
                    resultSection.classList.remove('hidden');
                }
                renderRiskResult(mockData);
            })
            .finally(function () {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            });
    }

    function getMockRiskData() {
        return {
            win_rate: 72.5,
            risk_level: '中等',
            risk_score: 45,
            summary: '根据历史案例数据分析，本案为民间借贷纠纷，整体胜诉概率约为 72.5%。案件核心风险点在于证据完整性和被告偿付能力，建议重点关注借条效力、转账凭证、利息约定合法性等方面。',
            risk_factors: [
                { name: '证据完整性', level: '低风险', description: '现有证据较为完整，包含借条和转账记录', impact: 15, suggestion: '补充借款用途证明、催款记录等，进一步夯实证据链' },
                { name: '利息约定合法性', level: '中风险', description: '需核实约定利率是否超过法定上限', impact: 25, suggestion: '核对年利率是否超过 LPR 四倍，超出部分可能不被支持' },
                { name: '被告偿付能力', level: '高风险', description: '被告财产状况不明，存在执行风险', impact: 35, suggestion: '建议诉前调查被告财产线索，考虑申请财产保全' },
                { name: '诉讼时效', level: '低风险', description: '借款未超过诉讼时效', impact: 10, suggestion: '注意保留催款记录，确保时效中断' }
            ],
            similar_cases: [
                { case_id: '1', case_name: '张某诉李某民间借贷纠纷案', court: '北京市第一中级人民法院', case_number: '(2025)京01民初123号', similarity: 0.92, result: '原告胜诉', amount: '48万元', judgment_date: '2025-12-15' },
                { case_id: '2', case_name: '王某诉赵某借款合同纠纷案', court: '北京市朝阳区人民法院', case_number: '(2025)京0105民初456号', similarity: 0.85, result: '部分支持', amount: '60万元', judgment_date: '2025-11-20' },
                { case_id: '3', case_name: '刘某诉陈某民间借贷纠纷案', court: '北京市海淀区人民法院', case_number: '(2025)京0108民初789号', similarity: 0.78, result: '原告胜诉', amount: '35万元', judgment_date: '2025-10-08' }
            ],
            radar_data: [
                { dimension: '证据充分性', score: 75, max_score: 100 },
                { dimension: '法律支持度', score: 70, max_score: 100 },
                { dimension: '事实清晰度', score: 65, max_score: 100 },
                { dimension: '对方抗辩力', score: 45, max_score: 100 },
                { dimension: '执行可能性', score: 55, max_score: 100 },
                { dimension: '时间成本', score: 60, max_score: 100 }
            ],
            suggestions: [
                '尽快收集和整理全部证据材料，形成完整证据链',
                '建议诉前调查被告财产线索，必要时申请财产保全',
                '考虑先发律师函进行催告，争取协商解决',
                '详细计算诉讼请求金额，包括本金、利息、违约金等',
                '准备好庭审应对方案，预判对方可能的抗辩理由',
                '可考虑调解或和解，降低时间成本和不确定性'
            ]
        };
    }

    function renderRiskResult(data) {
        var winRateNeedle = document.getElementById('riskWinRateNeedle');
        var winRateValue = document.getElementById('riskWinRateValue');
        if (winRateNeedle && winRateValue) {
            var angle = -90 + (data.win_rate / 100) * 180;
            setTimeout(function () {
                winRateNeedle.style.transform = 'translateX(-50%) rotate(' + angle + 'deg)';
            }, 100);

            var current = 0;
            var target = data.win_rate;
            var interval = setInterval(function () {
                current += 1;
                if (current >= target) {
                    current = target;
                    clearInterval(interval);
                }
                winRateValue.textContent = current.toFixed(1) + '%';
            }, 20);
        }

        var riskLevelBadge = document.getElementById('riskLevelBadge');
        var riskLevelText = document.getElementById('riskLevelText');
        var riskScoreValue = document.getElementById('riskScoreValue');
        var riskScoreBar = document.getElementById('riskScoreBar');

        if (riskLevelBadge && riskLevelText) {
            riskLevelBadge.className = 'inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold ' + getRiskLevelTag(data.risk_level);
            riskLevelText.textContent = data.risk_level + '风险';
        }
        if (riskScoreValue) {
            riskScoreValue.textContent = data.risk_score;
        }
        if (riskScoreBar) {
            setTimeout(function () {
                riskScoreBar.style.width = data.risk_score + '%';
            }, 100);
        }

        var summaryEl = document.getElementById('riskSummary');
        if (summaryEl) {
            summaryEl.textContent = data.summary;
        }

        if (data.radar_data) {
            setTimeout(function () {
                drawRadarChart(data.radar_data);
            }, 200);
        }

        if (data.risk_factors) {
            var factorsList = document.getElementById('riskFactorsList');
            if (factorsList) {
                factorsList.innerHTML = '';
                for (var i = 0; i < data.risk_factors.length; i++) {
                    var factor = data.risk_factors[i];
                    var tagClass = getRiskLevelTag(factor.level);
                    var div = document.createElement('div');
                    div.className = 'p-3 bg-bg-subtle rounded-xl hover:bg-bg transition-colors';
                    div.innerHTML = '<div class="flex items-center justify-between mb-1.5">' +
                        '<span class="text-xs font-semibold text-fg-primary">' + factor.name + '</span>' +
                        '<span class="text-[10px] px-2 py-0.5 rounded-full ' + tagClass + ' font-medium">' + factor.level + '</span>' +
                        '</div>' +
                        '<p class="text-[11px] text-fg-secondary mb-2">' + factor.description + '</p>' +
                        '<div class="flex items-center gap-2 mb-2">' +
                        '<span class="text-[10px] text-fg-tertiary flex-shrink-0">影响度</span>' +
                        '<div class="flex-1 h-1.5 bg-white rounded-full overflow-hidden">' +
                        '<div class="h-full bg-gradient-to-r from-success to-urgent rounded-full" style="width:' + factor.impact + '%"></div>' +
                        '</div>' +
                        '<span class="text-[10px] text-fg-secondary font-medium w-6 text-right">' + factor.impact + '%</span>' +
                        '</div>' +
                        '<p class="text-[10px] text-brand">💡 ' + factor.suggestion + '</p>';
                    factorsList.appendChild(div);
                }
            }
        }

        if (data.similar_cases) {
            var casesBody = document.getElementById('riskSimilarCases');
            if (casesBody) {
                casesBody.innerHTML = '';
                for (var j = 0; j < data.similar_cases.length; j++) {
                    var sc = data.similar_cases[j];
                    var simPercent = Math.round(sc.similarity * 100);
                    var resultClass = sc.result.indexOf('胜诉') >= 0 ? 'text-success' : (sc.result.indexOf('部分') >= 0 ? 'text-urgent' : 'text-fg-secondary');
                    var tr = document.createElement('tr');
                    tr.className = 'border-b border-bg-border/50 hover:bg-bg-subtle/50 transition-colors cursor-pointer';
                    tr.innerHTML = '<td class="py-3 pr-4 text-xs text-fg-primary font-medium">' + sc.case_name + '</td>' +
                        '<td class="py-3 pr-4 text-[11px] text-fg-secondary">' + sc.court + '</td>' +
                        '<td class="py-3 pr-4 text-[11px] text-fg-tertiary font-mono">' + sc.case_number + '</td>' +
                        '<td class="py-3 pr-4">' +
                        '<div class="flex items-center gap-2">' +
                        '<div class="w-16 h-1.5 bg-bg rounded-full overflow-hidden">' +
                        '<div class="h-full bg-brand rounded-full" style="width:' + simPercent + '%"></div>' +
                        '</div>' +
                        '<span class="text-[11px] text-fg-secondary font-medium">' + simPercent + '%</span>' +
                        '</div>' +
                        '</td>' +
                        '<td class="py-3 pr-4 text-[11px] font-medium ' + resultClass + '">' + sc.result + '</td>' +
                        '<td class="py-3 text-[11px] text-fg-secondary">' + (sc.amount || '-') + '</td>';
                    casesBody.appendChild(tr);
                }
            }
        }

        if (data.suggestions) {
            var suggestionsList = document.getElementById('riskSuggestionsList');
            if (suggestionsList) {
                suggestionsList.innerHTML = '';
                var icons = [
                    'mdi:file-document-outline',
                    'mdi:magnify-scan',
                    'mdi:email-fast-outline',
                    'mdi:calculator-variant-outline',
                    'mdi:shield-account-outline',
                    'mdi:handshake-outline'
                ];
                var colors = ['text-brand', 'text-wiki', 'text-urgent', 'text-success', 'text-purple-500', 'text-pink-500'];
                for (var k = 0; k < data.suggestions.length; k++) {
                    var sug = data.suggestions[k];
                    var icon = icons[k % icons.length];
                    var color = colors[k % colors.length];
                    var div2 = document.createElement('div');
                    div2.className = 'p-3 bg-bg-subtle rounded-xl hover:bg-bg border border-transparent hover:border-bg-border transition-all';
                    div2.innerHTML = '<div class="flex items-start gap-2.5">' +
                        '<div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center flex-shrink-0 shadow-sm">' +
                        '<iconify-icon icon="' + icon + '" class="text-base ' + color + '"></iconify-icon>' +
                        '</div>' +
                        '<p class="text-xs text-fg-secondary leading-relaxed pt-0.5">' + sug + '</p>' +
                        '</div>';
                    suggestionsList.appendChild(div2);
                }
            }
        }
    }

    window.runRiskPrediction = runRiskPrediction;
})();
</script>
