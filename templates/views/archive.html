<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-3 md:p-4 space-y-3 md:space-y-4" id="view-archive">
<!-- 头部 -->
<div class="flex-none flex items-center justify-between" data-animate="fade-in-up" data-delay="0">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-gradient-to-br from-wiki to-purple-600 flex items-center justify-center text-white shadow-md shadow-wiki/20">
<iconify-icon icon="mdi:archive-outline" class="text-xl"></iconify-icon>
</div>
<div>
<h2 class="text-lg font-bold text-fg-primary">档案管理</h2>
<p class="text-[10px] text-fg-tertiary mt-0.5">归档已完成或关闭的案件，方便以后查阅</p>
</div>
</div>
<div class="flex items-center gap-2">
<button class="flex items-center gap-1.5 h-9 px-4 text-xs font-medium rounded-xl bg-gradient-to-r from-wiki to-purple-600 text-white hover:shadow-lg hover:shadow-wiki/25 transition-all duration-300 hover:-translate-y-0.5 group" onclick="batchExportArchive()">
<iconify-icon icon="mdi:download-outline" class="text-sm group-hover:scale-110 transition-transform"></iconify-icon>
批量导出
</button>
</div>
</div>

<!-- 搜索筛选区 -->
<div class="ws-card p-4 md:p-5" data-animate="fade-in-up" data-delay="0.08">
<div class="flex items-center gap-3 flex-wrap">
<div class="relative flex-1 min-w-[200px] group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<iconify-icon class="text-fg-tertiary group-focus-within:text-brand transition-colors" icon="mdi:magnify"></iconify-icon>
</div>
<input id="archiveSearchInput" class="w-full bg-bg-subtle border border-bg-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10 transition-all duration-200 placeholder:text-fg-disabled" placeholder="搜索案号、当事人、案由..." type="text" oninput="filterArchiveList()"/>
</div>
<div class="relative">
<select id="archiveYearFilter" class="appearance-none bg-bg-subtle border border-bg-border rounded-xl px-4 py-2.5 pr-9 text-sm text-fg-secondary focus:outline-none focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10 transition-all duration-200 cursor-pointer hover:border-brand/40" onchange="filterArchiveList()">
<option value="">全部年份</option>
<option value="2026">2026年</option>
<option value="2025">2025年</option>
<option value="2024">2024年</option>
</select>
<div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
<iconify-icon class="text-fg-tertiary text-xs" icon="mdi:chevron-down"></iconify-icon>
</div>
</div>
<div class="relative">
<select id="archiveTypeFilter" class="appearance-none bg-bg-subtle border border-bg-border rounded-xl px-4 py-2.5 pr-9 text-sm text-fg-secondary focus:outline-none focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10 transition-all duration-200 cursor-pointer hover:border-brand/40" onchange="filterArchiveList()">
<option value="">全部案由</option>
<option value="民事">民事</option>
<option value="商事">商事</option>
<option value="劳动争议">劳动争议</option>
</select>
<div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
<iconify-icon class="text-fg-tertiary text-xs" icon="mdi:chevron-down"></iconify-icon>
</div>
</div>
<div class="flex items-center gap-1.5 ml-auto order-last md:order-none">
<div class="flex items-center gap-1.5 px-3 py-1.5 bg-wiki-tint rounded-full">
<iconify-icon class="text-wiki text-sm" icon="mdi:archive-multiple-outline"></iconify-icon>
<span id="archiveResultCount" class="text-xs font-semibold text-wiki">共 0 条</span>
</div>
</div>
</div>
</div>

<!-- 归档分类标签 -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-3" data-animate="fade-in-up" data-delay="0.16" id="archive-stats-cards">
<div class="archive-stat-card bg-gradient-to-br from-wiki-tint to-purple-50 rounded-2xl p-4 border border-purple-100 hover:shadow-lg hover:shadow-purple-100/50 transition-all duration-300 hover:-translate-y-0.5 cursor-pointer group" onclick="filterByArchiveYear('all')">
<div class="flex items-center justify-between mb-2">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-wiki to-purple-600 flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
<iconify-icon icon="mdi:archive-outline" class="text-white text-base"></iconify-icon>
</div>
<span class="text-2xl font-bold text-wiki">5</span>
</div>
<p class="text-xs font-medium text-fg-primary">全部归档</p>
<p class="text-[10px] text-fg-tertiary mt-0.5">历史所有归档案件</p>
</div>
<div class="archive-stat-card bg-gradient-to-br from-brand-tint3 to-blue-50 rounded-2xl p-4 border border-blue-100 hover:shadow-lg hover:shadow-blue-100/50 transition-all duration-300 hover:-translate-y-0.5 cursor-pointer group" onclick="filterByArchiveYear('2026')">
<div class="flex items-center justify-between mb-2">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand to-brand-hover flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
<iconify-icon icon="mdi:calendar-star" class="text-white text-base"></iconify-icon>
</div>
<span class="text-2xl font-bold text-brand">1</span>
</div>
<p class="text-xs font-medium text-fg-primary">2026年</p>
<p class="text-[10px] text-fg-tertiary mt-0.5">本年度归档案件</p>
</div>
<div class="archive-stat-card bg-gradient-to-br from-green-50 to-success-tint rounded-2xl p-4 border border-green-100 hover:shadow-lg hover:shadow-green-100/50 transition-all duration-300 hover:-translate-y-0.5 cursor-pointer group" onclick="filterByArchiveYear('2025')">
<div class="flex items-center justify-between mb-2">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-green-500 to-success flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
<iconify-icon icon="mdi:calendar-check" class="text-white text-base"></iconify-icon>
</div>
<span class="text-2xl font-bold text-success">2</span>
</div>
<p class="text-xs font-medium text-fg-primary">2025年</p>
<p class="text-[10px] text-fg-tertiary mt-0.5">上年度归档案件</p>
</div>
<div class="archive-stat-card bg-gradient-to-br from-warning-tint/50 to-orange-50 rounded-2xl p-4 border border-orange-100 hover:shadow-lg hover:shadow-orange-100/50 transition-all duration-300 hover:-translate-y-0.5 cursor-pointer group" onclick="filterByArchiveYear('2024')">
<div class="flex items-center justify-between mb-2">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-400 to-warning flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
<iconify-icon icon="mdi:calendar-clock-outline" class="text-white text-base"></iconify-icon>
</div>
<span class="text-2xl font-bold text-warning">2</span>
</div>
<p class="text-xs font-medium text-fg-primary">2024年</p>
<p class="text-[10px] text-fg-tertiary mt-0.5">历史归档案件</p>
</div>
</div>

<!-- 归档列表 -->
<div class="ws-card overflow-hidden flex-1 flex flex-col" data-animate="fade-in-up" data-delay="0.24">
<div class="overflow-x-auto flex-1">
<!-- 骨架屏容器 -->
<div id="archiveSkeletonContainer" class="hidden py-4 px-5">
<div class="space-y-4">
<div class="skeleton skeleton-line w-1/3 h-5 rounded"></div>
<div class="grid grid-cols-6 gap-4">
<div class="skeleton skeleton-line h-4 rounded"></div>
<div class="skeleton skeleton-line h-4 rounded"></div>
<div class="skeleton skeleton-line h-4 rounded w-2/3"></div>
<div class="skeleton skeleton-line h-4 rounded w-1/2"></div>
<div class="skeleton skeleton-line h-4 rounded w-2/3"></div>
<div class="skeleton skeleton-line h-4 rounded w-1/3"></div>
</div>
<div class="h-px bg-bg-border"></div>
<div class="grid grid-cols-6 gap-4">
<div class="skeleton skeleton-line h-4 rounded"></div>
<div class="skeleton skeleton-line h-4 rounded"></div>
<div class="skeleton skeleton-line h-4 rounded w-2/3"></div>
<div class="skeleton skeleton-line h-4 rounded w-1/2"></div>
<div class="skeleton skeleton-line h-4 rounded w-2/3"></div>
<div class="skeleton skeleton-line h-4 rounded w-1/3"></div>
</div>
</div>
</div>
<table class="w-full text-sm table-fixed min-w-[880px]" id="archiveTable">
<thead>
<tr class="bg-gradient-to-r from-bg-subtle to-bg-subtle/50 border-b border-bg-border">
<th scope="col" class="text-left py-3.5 px-5 text-xs font-semibold text-fg-tertiary uppercase tracking-wider w-[40px]">
<input type="checkbox" class="w-4 h-4 rounded border-bg-border cursor-pointer" onchange="toggleAllArchive(this)"/>
</th>
<th scope="col" class="text-left py-3.5 px-5 text-xs font-semibold text-fg-tertiary uppercase tracking-wider w-[180px]">案号</th>
<th scope="col" class="text-left py-3.5 px-5 text-xs font-semibold text-fg-tertiary uppercase tracking-wider w-[140px]">案由</th>
<th scope="col" class="text-left py-3.5 px-5 text-xs font-semibold text-fg-tertiary uppercase tracking-wider w-[100px]">原告</th>
<th scope="col" class="text-left py-3.5 px-5 text-xs font-semibold text-fg-tertiary uppercase tracking-wider w-[100px]">被告</th>
<th scope="col" class="text-center py-3.5 px-5 text-xs font-semibold text-fg-tertiary uppercase tracking-wider w-[120px]">归档时间</th>
<th scope="col" class="text-center py-3.5 px-5 text-xs font-semibold text-fg-tertiary uppercase tracking-wider w-[200px]">操作</th>
</tr>
</thead>
<tbody id="archiveTableBody" class="divide-y divide-bg-border/60">
<!-- 表格内容由 JS 渲染 -->
</tbody>
</table>
<!-- 空状态 -->
<div id="archiveEmptyState" class="hidden flex-col items-center justify-center py-16 px-4"></div>
</div>
<!-- 分页 -->
<div class="flex items-center justify-between px-5 py-4 border-t border-bg-border/60 bg-bg-subtle/30">
<div class="flex items-center gap-3">
<div class="relative">
<select id="archivePageSize" class="appearance-none bg-white border border-bg-border rounded-xl px-3 py-2 pr-8 text-xs text-fg-secondary focus:outline-none focus:border-brand transition-all cursor-pointer hover:border-brand/40" onchange="filterArchiveList()">
<option value="10">每页 10 条</option>
<option value="20">每页 20 条</option>
<option value="50">每页 50 条</option>
</select>
<div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
<iconify-icon class="text-fg-tertiary text-[10px]" icon="mdi:chevron-down"></iconify-icon>
</div>
</div>
<span id="archivePaginationInfo" class="text-xs text-fg-tertiary"></span>
</div>
<div class="flex gap-1.5" id="archivePaginationBtns"></div>
</div>
</div>
</div>
