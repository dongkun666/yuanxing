// ===== 标签切换 =====
function oaSwitchTab(tab) {
  var tabs = document.querySelectorAll(".oa-tab");
  var contents = document.querySelectorAll(".oa-tab-content");
  
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove("active");
  }
  for (var i = 0; i < contents.length; i++) {
    contents[i].classList.remove("active");
  }
  
  var activeTab = document.querySelector('.oa-tab[data-tab="' + tab + '"]');
  var activeContent = document.getElementById("oa-tab-" + tab);
  if (activeTab) activeTab.classList.add("active");
  if (activeContent) activeContent.classList.add("active");
}

// ===== 部门树 =====
function oaRenderDeptTree(containerId) {
  var container = document.getElementById(containerId);
  if (!container) return;
  
  function renderDept(dept, level) {
    var hasChildren = dept.children && dept.children.length > 0;
    var html = '<li>' +
      '<div class="oa-tree-item' + (level === 0 ? ' active' : '') + '" onclick="oaSelectDept(' + dept.id + ', this)">' +
        '<span class="oa-tree-arrow ' + (level < 2 ? 'expanded' : '') + '" onclick="event.stopPropagation(); oaToggleDept(this)">' + (hasChildren ? '▶' : '') + '</span>' +
        '<span class="oa-tree-icon">🏢</span>' +
        '<span>' + dept.name + '</span>' +
        '<span class="oa-tree-count">' + dept.member_count + '</span>' +
      '</div>';
    
    if (hasChildren) {
      html += '<ul class="oa-tree-children ' + (level < 2 ? 'show' : '') + '">';
      for (var i = 0; i < dept.children.length; i++) {
        html += renderDept(dept.children[i], level + 1);
      }
      html += '</ul>';
    }
    
    html += '</li>';
    return html;
  }
  
  var html = "";
  for (var i = 0; i < oaDepartments.length; i++) {
    html += renderDept(oaDepartments[i], 0);
  }
  
  container.innerHTML = html;
}

function oaToggleDept(arrowEl) {
  arrowEl.classList.toggle("expanded");
  var next = arrowEl.parentElement.nextElementSibling;
  if (next && next.classList.contains("oa-tree-children")) {
    next.classList.toggle("show");
  }
}

function oaSelectDept(deptId, el) {
  var items = document.querySelectorAll("#oaDeptTree .oa-tree-item");
  for (var i = 0; i < items.length; i++) {
    items[i].classList.remove("active");
  }
  el.classList.add("active");
  
  oaMemberFilter.dept_id = deptId;
  oaMemberPage = 1;
  oaRenderMemberTable();
  oaRenderMemberPagination();
}

// ===== 成员表格 =====
function oaGetFilteredMembers() {
  return oaMembers.filter(function(m) {
    if (oaMemberFilter.keyword) {
      var kw = oaMemberFilter.keyword.toLowerCase();
      if (m.name.toLowerCase().indexOf(kw) === -1 && m.email.toLowerCase().indexOf(kw) === -1) return false;
    }
    if (oaMemberFilter.role && m.role !== oaMemberFilter.role) return false;
    if (oaMemberFilter.status && m.status !== oaMemberFilter.status) return false;
    if (oaMemberFilter.dept_id && m.dept_id !== oaMemberFilter.dept_id) {
      var dept = oaFindDept(oaMemberFilter.dept_id);
      if (dept) {
        var childIds = oaGetDeptChildIds(dept);
        if (childIds.indexOf(m.dept_id) === -1) return false;
      } else {
        return false;
      }
    }
    return true;
  });
}

function oaFindDept(id, depts) {
  if (!depts) depts = oaDepartments;
  for (var i = 0; i < depts.length; i++) {
    if (depts[i].id === id) return depts[i];
    if (depts[i].children) {
      var found = oaFindDept(id, depts[i].children);
      if (found) return found;
    }
  }
  return null;
}

function oaGetDeptChildIds(dept) {
  var ids = [dept.id];
  if (dept.children) {
    for (var i = 0; i < dept.children.length; i++) {
      ids = ids.concat(oaGetDeptChildIds(dept.children[i]));
    }
  }
  return ids;
}

function oaRenderMemberTable() {

  var filtered = oaGetFilteredMembers();
  var start = (oaMemberPage - 1) * oaMemberPageSize;

  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #86909C;">暂无成员</td></tr>';
    return;
  }
  
  var roleNames = { owner: "所有者", admin: "管理员", lawyer: "律师", paralegal: "律师助理", guest: "访客" };
  
  var html = "";
  for (var i = 0; i < pageData.length; i++) {

    html += '<tr class="fade-in">' +
      '<td><input type="checkbox"></td>' +
      '<td>' +
        '<div class="oa-user-cell">' +
          '<div class="oa-avatar c' + m.avatar_color + '">' + m.name.charAt(0) + '</div>' +
          '<div class="oa-user-info">' +

            '<span class="oa-user-email">' + m.email + '</span>' +
          '</div>' +
        '</div>' +
      '</td>' +
      '<td><span class="oa-role-tag ' + m.role + '">' + roleNames[m.role] + '</span></td>' +
      '<td>' + m.dept_name + '</td>' +
      '<td>' + m.position + '</td>' +
      '<td><span class="oa-tag ' + m.status + '">' + (m.status === "active" ? "在职" : "离职") + '</span></td>' +
      '<td style="color: #86909C;">' + m.last_login + '</td>' +
      '<td>' +
        '<button class="oa-action-btn">编辑</button>' +
        '<button class="oa-action-btn danger">停用</button>' +
      '</td>' +
    '</tr>';
  }
  
  tbody.innerHTML = html;
}

function oaRenderMemberPagination() {
  var container = document.getElementById("oaMemberPagination");
  var totalEl = document.getElementById("oaMemberTotal");
  if (!container) return;
  
  var filtered = oaGetFilteredMembers();
  var total = filtered.length;
  var totalPages = Math.ceil(total / oaMemberPageSize) || 1;
  
  if (totalEl) totalEl.textContent = total;
  
  var html = "";
  html += '<button class="oa-page-btn" onclick="oaGoMemberPage(' + (oaMemberPage - 1) + ')" ' + (oaMemberPage <= 1 ? "disabled" : "") + '>上一页</button>';
  
  var start = Math.max(1, oaMemberPage - 2);
  var end = Math.min(totalPages, oaMemberPage + 2);
  
  for (var p = start; p <= end; p++) {
    html += '<button class="oa-page-btn ' + (p === oaMemberPage ? "active" : "") + '" onclick="oaGoMemberPage(' + p + ')">' + p + '</button>';
  }
  
  html += '<button class="oa-page-btn" onclick="oaGoMemberPage(' + (oaMemberPage + 1) + ')" ' + (oaMemberPage >= totalPages ? "disabled" : "") + '>下一页</button>';
  
  container.innerHTML = html;
}

function oaGoMemberPage(page) {
  var filtered = oaGetFilteredMembers();
  var totalPages = Math.ceil(filtered.length / oaMemberPageSize) || 1;
  if (page < 1 || page > totalPages) return;
  oaMemberPage = page;
  oaRenderMemberTable();
  oaRenderMemberPagination();
}
