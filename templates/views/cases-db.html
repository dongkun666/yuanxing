<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-6 bg-bg" id="view-cases-db">
<div class="max-w-6xl mx-auto w-full space-y-5">
    <div class="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-xl border border-blue-200 p-5">
        <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center flex-shrink-0 shadow-sm">
                <iconify-icon class="text-2xl text-blue-600" icon="mdi:library-books"></iconify-icon>
            </div>
            <div class="flex-1">
                <h1 class="text-lg font-bold text-fg-primary">案例数据库</h1>
                <p class="text-xs text-fg-secondary mt-1">海量裁判文书案例库，支持按案由、法院、当事人、律师等多维度检索。</p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-bg-border p-5">
        <div class="flex items-center gap-2 mb-3">
            <iconify-icon class="text-base text-fg-tertiary" icon="mdi:magnify"></iconify-icon>
            <h2 class="text-sm font-semibold text-fg-primary">案例检索</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-3">
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">关键词</label>
                <input type="text" id="cases-db-keyword" placeholder="案由/当事人/关键词" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors"/>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">案由</label>
                <select id="cases-db-cause" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-secondary focus:outline-none focus:border-brand transition-colors">
                    <option>全部案由</option>
                    <option>合同纠纷</option>
                    <option>侵权责任纠纷</option>
                    <option>劳动争议</option>
                    <option>知识产权纠纷</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">审理法院</label>
                <select id="cases-db-court" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-secondary focus:outline-none focus:border-brand transition-colors">
                    <option>全部法院</option>
                    <option>最高人民法院</option>
                    <option>北京市高级人民法院</option>
                    <option>上海市高级人民法院</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">裁判年份</label>
                <select id="cases-db-year" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2 text-sm text-fg-secondary focus:outline-none focus:border-brand transition-colors">
                    <option>全部年份</option>
                    <option>2026年</option>
                    <option>2025年</option>
                    <option>2024年</option>
                    <option>2023年</option>
                </select>
            </div>
        </div>

        <div class="flex items-center justify-end">
            <button onclick="searchCases()" class="px-4 py-2 text-sm text-white bg-brand hover:bg-blue-600 rounded-lg transition-colors flex items-center gap-1.5">
                <iconify-icon class="text-base" icon="mdi:magnify"></iconify-icon>
                检索案例
            </button>
        </div>
    </div>

    <div class="bg-white rounded-xl border border-bg-border overflow-hidden">
        <div class="flex items-center justify-between px-5 py-3 border-b border-bg-border">
            <span class="text-xs text-fg-tertiary" id="cases-db-result-count">共 12,586 条结果</span>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-fg-tertiary">排序：</span>
                <select id="cases-db-sort" onchange="changeCasesSort()" class="text-[10px] border border-bg-border rounded px-2 py-1 text-fg-secondary focus:outline-none focus:border-brand bg-white">
                    <option>相关度</option>
                    <option>裁判日期</option>
                    <option>法院层级</option>
                </select>
            </div>
        </div>
        <div class="divide-y divide-bg" id="cases-db-results"></div>
        <div class="flex items-center justify-center gap-1 px-5 py-4 border-t border-bg-border" id="cases-db-pagination"></div>
    </div>
</div>
</div>
