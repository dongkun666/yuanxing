<!-- 判例库 view - 2026-06-28 -->
<!-- 依赖: cases-data.js (mock) + cases-db.js (UI) + API (可选) -->
<div class="hidden view-content flex-1 flex flex-col overflow-y-auto p-6 bg-bg" id="view-cases-db">
  <div class="max-w-7xl mx-auto w-full space-y-4">

    <!-- 联邦模式入口 (B 任务: 4 源强反爬, 跳转公开查询) -->
    <div class="federated-banner rounded-xl p-3 mb-1 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-brand-tint flex items-center justify-center flex-shrink-0">
        <iconify-icon class="text-base text-brand" icon="mdi:link-variant"></iconify-icon>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-fg-primary">联邦查询模式 (公开数据源受反爬保护)</p>
        <p class="text-[10px] text-fg-tertiary mt-0.5">LexPrime 自建 100 条精选判例 + 律所内部录入 · 公开数据跳转查询</p>
      </div>
      <a href="https://rmfyalk.court.gov.cn/caseSearch" target="_blank" rel="noopener" class="text-[11px] px-3 py-1.5 rounded-lg bg-brand text-white hover:bg-brand-hover flex items-center gap-1 flex-shrink-0">
        <iconify-icon class="text-sm" icon="mdi:open-in-new"></iconify-icon>
        去案例库查
      </a>
    </div>

    <!-- 顶部统计 -->
    <div class="grid grid-cols-4 gap-3">
      <div class="bg-white rounded-xl border border-bg-border p-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center">
          <iconify-icon class="text-xl text-brand" icon="mdi:scale-balance"></iconify-icon>
        </div>
        <div>
          <p class="text-xs text-fg-tertiary">判例库总数</p>
          <p class="text-xl font-bold text-fg-primary" id="cases-db-stat-total">--</p>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-bg-border p-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-green-50 flex items-center justify-center">
          <iconify-icon class="text-xl text-success" icon="mdi:check-decagram"></iconify-icon>
        </div>
        <div>
          <p class="text-xs text-fg-tertiary">指导性案例</p>
          <p class="text-xl font-bold text-fg-primary" id="cases-db-stat-guide">--</p>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-bg-border p-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-purple-50 flex items-center justify-center">
          <iconify-icon class="text-xl text-wiki" icon="mdi:account-tie"></iconify-icon>
        </div>
        <div>
          <p class="text-xs text-fg-tertiary">律所内部</p>
          <p class="text-xl font-bold text-fg-primary" id="cases-db-stat-firm">--</p>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-bg-border p-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-amber-50 flex items-center justify-center">
          <iconify-icon class="text-xl text-urgent" icon="mdi:source-pull"></iconify-icon>
        </div>
        <div>
          <p class="text-xs text-fg-tertiary">数据源</p>
          <p class="text-sm font-semibold text-fg-primary" id="cases-db-stat-source">4 免费源 + cncases</p>
        </div>
      </div>
    </div>

    <!-- 搜索 + 筛选 -->
    <div class="bg-white rounded-xl border border-bg-border p-4 space-y-3">
      <!-- 高频案由 tab -->
      <div class="flex items-center gap-1.5 flex-wrap">
        <button class="cases-db-pill text-[11px] px-3 py-1 rounded-full bg-brand text-white font-medium transition-colors" data-pill="all" onclick="filterCasesByPill(this, 'all')">全部</button>
        <button class="cases-db-pill text-[11px] px-3 py-1 rounded-full bg-bg-subtle text-fg-secondary hover:bg-bg-hover font-medium transition-colors" data-pill="合同纠纷" onclick="filterCasesByPill(this, '合同纠纷')">合同纠纷</button>
        <button class="cases-db-pill text-[11px] px-3 py-1 rounded-full bg-bg-subtle text-fg-secondary hover:bg-bg-hover font-medium transition-colors" data-pill="婚姻家事" onclick="filterCasesByPill(this, '婚姻家事')">婚姻家事</button>
        <button class="cases-db-pill text-[11px] px-3 py-1 rounded-full bg-bg-subtle text-fg-secondary hover:bg-bg-hover font-medium transition-colors" data-pill="侵权责任" onclick="filterCasesByPill(this, '侵权责任')">侵权责任</button>
        <button class="cases-db-pill text-[11px] px-3 py-1 rounded-full bg-bg-subtle text-fg-secondary hover:bg-bg-hover font-medium transition-colors" data-pill="知识产权" onclick="filterCasesByPill(this, '知识产权')">知识产权</button>
        <button class="cases-db-pill text-[11px] px-3 py-1 rounded-full bg-bg-subtle text-fg-secondary hover:bg-bg-hover font-medium transition-colors" data-pill="刑事" onclick="filterCasesByPill(this, '刑事')">刑事</button>
        <button class="cases-db-pill text-[11px] px-3 py-1 rounded-full bg-bg-subtle text-fg-secondary hover:bg-bg-hover font-medium transition-colors" data-pill="执行" onclick="filterCasesByPill(this, '执行')">执行</button>
        <button class="cases-db-pill text-[11px] px-3 py-1 rounded-full bg-bg-subtle text-fg-secondary hover:bg-bg-hover font-medium transition-colors" data-pill="行政" onclick="filterCasesByPill(this, '行政')">行政</button>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <div class="flex-1 relative min-w-[240px]">
          <iconify-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-fg-tertiary text-base" icon="mdi:magnify"></iconify-icon>
          <input type="text" id="cases-db-search" placeholder="搜索案号 / 案由 / 全文 / 法条..." class="w-full bg-bg-subtle border border-bg-border rounded-lg pl-9 pr-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors"/>
        </div>
        <select id="cases-db-court-filter" class="appearance-none bg-bg-subtle border border-bg-border rounded-lg pl-3 pr-9 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors">
          <option value="all">全部法院</option>
          <option value="最高人民法院">最高人民法院</option>
          <option value="高级人民法院">高级人民法院</option>
          <option value="中级人民法院">中级人民法院</option>
          <option value="基层人民法院">基层人民法院</option>
        </select>
        <select id="cases-db-source-filter" class="appearance-none bg-bg-subtle border border-bg-border rounded-lg pl-3 pr-9 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors">
          <option value="all">全部来源</option>
          <option value="court_cases">人民法院案例库</option>
          <option value="cncases">cncases 8500万</option>
          <option value="lawyer_added">律师自加</option>
        </select>
        <select id="cases-db-year-filter" class="appearance-none bg-bg-subtle border border-bg-border rounded-lg pl-3 pr-9 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors">
          <option value="all">全部年份</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2022">2022</option>
          <option value="2021">2021</option>
        </select>
        <select id="cases-db-sort" class="appearance-none bg-bg-subtle border border-bg-border rounded-lg pl-3 pr-9 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors">
          <option value="lex_score_desc">按 Lex 评分</option>
          <option value="year_desc">按年份</option>
          <option value="view_count_desc">按浏览量</option>
          <option value="law_refs_desc">按法条引用</option>
        </select>
      </div>
      <div class="flex items-center justify-between text-[10px] text-fg-tertiary">
        <span>
          <iconify-icon class="text-xs" icon="mdi:format-list-bulleted"></iconify-icon>
          共 <span id="cases-db-count">--</span> 条判例
          <span class="ml-3" id="cases-db-api-status"></span>
        </span>
        <span>
          <iconify-icon class="text-xs" icon="mdi:database"></iconify-icon>
          自建数据 (cncases 102GB + 4 免费源)
        </span>
      </div>
    </div>

    <!-- 列表区 -->
    <div id="cases-db-list" class="space-y-2.5">
      <div class="bg-white rounded-xl border border-bg-border p-12 text-center">
        <iconify-icon class="text-4xl text-fg-disabled mb-2" icon="mdi:loading"></iconify-icon>
        <p class="text-sm text-fg-tertiary">加载中...</p>
      </div>
    </div>
  </div>
</div>
