    { date: "07-03", value: 1245 }
  ];
  
  var max = Math.max.apply(null, data.map(function(d) { return d.value; }));
  
  var html = "";

    var height = (data[i].value / max) * 100;

}

function alGetFilteredLogs() {
  return alLogs.filter(function(log) {
    if (alFilterKeyword) {
      var kw = alFilterKeyword.toLowerCase();
      var desc = (log.description || "").toLowerCase();
      var name = (log.name || "").toLowerCase();
      if (desc.indexOf(kw) === -1 && name.indexOf(kw) === -1) return false;
    }
    if (alFilterActionType && log.action_type !== alFilterActionType) return false;
    if (alFilterCategory && log.category !== alFilterCategory) return false;
    if (alFilterLevel && log.level !== alFilterLevel) return false;
    if (alFilterStatus && log.status !== alFilterStatus) return false;
    return true;
  });
}

function alRenderTable() {
  var tbody = document.getElementById("alLogTableBody");
  if (!tbody) return;
  
  var filtered = alGetFilteredLogs();
  var start = (alPage - 1) * alPageSize;
  var pageData = filtered.slice(start, start + alPageSize);
  
  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #86909C;">暂无数据</td></tr>';
    return;
  }
  
  var html = "";
  for (var i = 0; i < pageData.length; i++) {
    var log = pageData[i];
    var levelClass = log.level === "high" || log.level === "critical" ? "danger" : log.level === "warning" ? "warning" : "info";
    var statusClass = log.status === "success" ? "success" : "danger";
    
    html += '<tr class="fade-in">' +
      '<td style="color: #86909C; white-space: nowrap;">' + log.time + '</td>' +
      '<td>' +
        '<div class="al-user-cell">' +
          '<div class="al-avatar">' + (log.name ? log.name.charAt(0) : "?") + '</div>' +
          '<div class="al-user-info">' +
            '<span class="al-user-name">' + (log.name || "未知用户") + '</span>' +
            '<span class="al-user-ip">' + log.ip + '</span>' +
          '</div>' +
        '</div>' +
      '</td>' +
      '<td><span class="al-tag ' + levelClass + '">' + log.action_name + '</span></td>' +
      '<td style="color: #4E5969;">' + log.category_name + '</td>' +
      '<td><span class="al-tag ' + levelClass + '">' + (log.level === "info" ? "信息" : log.level === "warning" ? "警告" : log.level === "high" ? "高危" : log.level) + '</span></td>' +
      '<td>' + log.description + '</td>' +
      '<td><span class="al-tag ' + statusClass + '">' + (log.status === "success" ? "成功" : "失败") + '</span></td>' +
      '<td><button class="al-action-btn" onclick="alShowDetail(\'' + log.log_id + '\')">详情</button></td>' +
    '</tr>';
  }
  
  tbody.innerHTML = html;
}

function alRenderPagination() {
  var container = document.getElementById("alPagination");
  var totalEl = document.getElementById("alTotalCount");
  if (!container) return;
  
  var filtered = alGetFilteredLogs();
  var total = filtered.length;
  var totalPages = Math.ceil(total / alPageSize) || 1;
  
  if (totalEl) totalEl.textContent = total.toLocaleString();
  
  var html = "";
  html += '<button class="al-page-btn" onclick="alGoPage(' + (alPage - 1) + ')" ' + (alPage <= 1 ? "disabled" : "") + '>上一页</button>';
  
  var start = Math.max(1, alPage - 2);
  var end = Math.min(totalPages, alPage + 2);
  
  if (start > 1) {
    html += '<button class="al-page-btn" onclick="alGoPage(1)">1</button>';
    if (start > 2) html += '<span style="padding: 0 4px; color: #86909C;">...</span>';
  }
  
  for (var p = start; p <= end; p++) {
    html += '<button class="al-page-btn ' + (p === alPage ? "active" : "") + '" onclick="alGoPage(' + p + ')">' + p + '</button>';
  }
  
  if (end < totalPages) {
    if (end < totalPages - 1) html += '<span style="padding: 0 4px; color: #86909C;">...</span>';
    html += '<button class="al-page-btn" onclick="alGoPage(' + totalPages + ')">' + totalPages + '</button>';
  }
  
  html += '<button class="al-page-btn" onclick="alGoPage(' + (alPage + 1) + ')" ' + (alPage >= totalPages ? "disabled" : "") + '>下一页</button>';
  
  container.innerHTML = html;
}

function alGoPage(page) {
  var filtered = alGetFilteredLogs();
  var totalPages = Math.ceil(filtered.length / alPageSize) || 1;
  if (page < 1 || page > totalPages) return;
  alPage = page;
  alRenderTable();
  alRenderPagination();
}

function alSearch(keyword) {
  alFilterKeyword = keyword;
  alPage = 1;
  alRenderTable();
  alRenderPagination();
}

function alFilterChange() {
  alFilterActionType = document.getElementById("alActionType").value;
  alFilterCategory = document.getElementById("alCategory").value;
  alFilterLevel = document.getElementById("alLevel").value;
  alFilterStatus = document.getElementById("alStatus").value;
  alPage = 1;
  alRenderTable();
  alRenderPagination();
}

    '</div>' +

    '</div>' +
    '<div class="al-detail-row">' +

    '</div>';

}
