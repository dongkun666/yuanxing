<!-- 登录/注册视图 (Phase 3 P0) - fixed 全屏, 盖住 sidebar + 主内容 -->
<div class="view-content hidden fixed inset-0 z-50 flex items-center justify-center bg-bg-subtle" id="view-login">
    <div class="w-full max-w-md">
        <!-- Logo + 品牌 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand text-white text-3xl mb-4">⚖</div>
            <h1 class="text-2xl font-bold">
                <span class="text-fg-primary">LexPrime</span>
                <span class="text-brand ml-1">元枢法智</span>
            </h1>
            <p class="text-sm text-fg-tertiary mt-2">律师的第二大脑 · LLM Wiki 持续维护</p>
        </div>

        <!-- 登录卡片 -->
        <div class="bg-white rounded-2xl border border-bg-border p-8 shadow-xl shadow-fg-primary/5">
            <!-- Tab 切换 -->
            <div class="flex items-center gap-1 mb-6 bg-bg-subtle rounded-xl p-1">
                <button id="login-tab-btn" class="flex-1 py-2 rounded-lg bg-white text-brand text-sm font-medium shadow-sm transition-all">
                    登录
                </button>
                <button id="register-tab-btn" class="flex-1 py-2 rounded-lg text-fg-secondary text-sm hover:text-fg-primary transition-all">
                    注册
                </button>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-fg-secondary font-medium mb-1.5">邮箱</label>
                    <input type="email" id="login-email" required
                           class="w-full px-4 py-2.5 bg-bg-subtle border border-bg-border rounded-lg text-sm focus:outline-none focus:border-brand focus:bg-white transition-colors"
                           placeholder="you@lawfirm.com">
                </div>
                <div>
                    <label class="block text-xs text-fg-secondary font-medium mb-1.5">密码</label>
                    <input type="password" id="login-password" required
                           class="w-full px-4 py-2.5 bg-bg-subtle border border-bg-border rounded-lg text-sm focus:outline-none focus:border-brand focus:bg-white transition-colors"
                           placeholder="••••••••">
                </div>
                <div id="login-error" class="hidden text-xs text-danger"></div>
                <button type="submit" class="w-full py-3 bg-brand text-white font-medium rounded-lg hover:bg-brand-hover transition-colors">
                    登录
                </button>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs text-fg-secondary font-medium mb-1.5">姓名</label>
                    <input type="text" id="register-name" required
                           class="w-full px-4 py-2.5 bg-bg-subtle border border-bg-border rounded-lg text-sm focus:outline-none focus:border-brand focus:bg-white transition-colors"
                           placeholder="张律师">
                </div>
                <div>
                    <label class="block text-xs text-fg-secondary font-medium mb-1.5">邮箱</label>
                    <input type="email" id="register-email" required
                           class="w-full px-4 py-2.5 bg-bg-subtle border border-bg-border rounded-lg text-sm focus:outline-none focus:border-brand focus:bg-white transition-colors"
                           placeholder="you@lawfirm.com">
                </div>
                <div>
                    <label class="block text-xs text-fg-secondary font-medium mb-1.5">密码</label>
                    <input type="password" id="register-password" required minlength="6"
                           class="w-full px-4 py-2.5 bg-bg-subtle border border-bg-border rounded-lg text-sm focus:outline-none focus:border-brand focus:bg-white transition-colors"
                           placeholder="至少 6 位">
                </div>
                <div id="register-error" class="hidden text-xs text-danger"></div>
                <button type="submit" class="w-full py-3 bg-brand text-white font-medium rounded-lg hover:bg-brand-hover transition-colors">
                    注册并登录
                </button>
            </form>

            <!-- 分隔线 -->
            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-bg-border"></div>
                <span class="text-xs text-fg-tertiary">或</span>
                <div class="flex-1 h-px bg-bg-border"></div>
            </div>

            <!-- Demo 模式 -->
            <button id="demo-login-btn" class="w-full py-3 border border-bg-border text-fg-secondary font-medium rounded-lg hover:bg-bg-subtle transition-colors text-sm">
                🚀 以 Demo 模式进入 (免登录)
            </button>
            <p class="text-xs text-fg-tertiary text-center mt-3">
                Demo 模式使用模拟用户 (MVP_USER_ID=u-1), 无需后端 auth。
            </p>
        </div>

        <!-- 底部 -->
        <p class="text-xs text-fg-tertiary text-center mt-6">
            © 2026 LexPrime 元枢法智 · AI 辅助, 不替代律师
        </p>
    </div>
</div>
