<!-- 企业征信库 view - 2026-06-28 -->
<div class="hidden view-content flex-1 flex flex-col overflow-y-auto p-6 bg-bg" id="view-companies-db">
  <div class="max-w-7xl mx-auto w-full space-y-4">

    <!-- 顶部统计 -->
    <div class="grid grid-cols-4 gap-3">
      <div class="bg-white rounded-xl border border-bg-border p-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center">
          <iconify-icon class="text-xl text-brand" icon="mdi:office-building"></iconify-icon>
        </div>
        <div>
          <p class="text-xs text-fg-tertiary">企业总数</p>
          <p class="text-xl font-bold text-fg-primary" id="companies-db-stat-total">--</p>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-bg-border p-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-red-50 flex items-center justify-center">
          <iconify-icon class="text-xl text-red-500" icon="mdi:alert-decagram"></iconify-icon>
        </div>
        <div>
          <p class="text-xs text-fg-tertiary">失信被执行</p>
          <p class="text-xl font-bold text-fg-primary" id="companies-db-stat-zxgk">--</p>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-bg-border p-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-amber-50 flex items-center justify-center">
          <iconify-icon class="text-xl text-urgent" icon="mdi:cancel"></iconify-icon>
        </div>
        <div>
          <p class="text-xs text-fg-tertiary">经营异常</p>
          <p class="text-xl font-bold text-fg-primary" id="companies-db-stat-abnormal">--</p>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-bg-border p-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-green-50 flex items-center justify-center">
          <iconify-icon class="text-xl text-success" icon="mdi:database"></iconify-icon>
        </div>
        <div>
          <p class="text-xs text-fg-tertiary">数据源</p>
          <p class="text-sm font-semibold text-fg-primary">国家企业信用</p>
        </div>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="bg-white rounded-xl border border-bg-border p-4 space-y-3">
      <div class="flex items-center gap-2 flex-wrap">
        <div class="flex-1 relative min-w-[240px]">
          <iconify-icon class="absolute left-3 top-1/2 -translate-y-1/2 text-fg-tertiary text-base" icon="mdi:magnify"></iconify-icon>
          <input type="text" id="companies-db-search" placeholder="搜索公司名称 / 法人 / 统一社会信用代码..." class="w-full bg-bg-subtle border border-bg-border rounded-lg pl-9 pr-3 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors"/>
        </div>
        <select id="companies-db-region-filter" class="appearance-none bg-bg-subtle border border-bg-border rounded-lg pl-3 pr-9 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors">
          <option value="all">全部地区</option>
          <option value="北京">北京</option>
          <option value="上海">上海</option>
          <option value="广东">广东</option>
          <option value="浙江">浙江</option>
          <option value="江苏">江苏</option>
        </select>
        <select id="companies-db-status-filter" class="appearance-none bg-bg-subtle border border-bg-border rounded-lg pl-3 pr-9 py-2 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white transition-colors">
          <option value="all">全部状态</option>
          <option value="存续">存续</option>
          <option value="注销">注销</option>
          <option value="吊销">吊销</option>
          <option value="迁出">迁出</option>
        </select>
        <label class="flex items-center gap-1.5 cursor-pointer px-3 py-2 bg-bg-subtle border border-bg-border rounded-lg hover:bg-white transition-colors">
          <input type="checkbox" id="companies-db-zxgk-only" class="w-4 h-4 text-brand border-bg-border rounded focus:ring-brand"/>
          <span class="text-xs text-fg-secondary whitespace-nowrap">只看失信</span>
        </label>
      </div>
      <div class="flex items-center justify-between text-[10px] text-fg-tertiary">
        <span>
          <iconify-icon class="text-xs" icon="mdi:format-list-bulleted"></iconify-icon>
          共 <span id="companies-db-count">--</span> 家企业
        </span>
        <span>
          <iconify-icon class="text-xs" icon="mdi:link-variant"></iconify-icon>
          主源: 国家企业信用信息公示系统
        </span>
      </div>
    </div>

    <!-- 列表 -->
    <div id="companies-db-list" class="space-y-2.5">
      <div class="bg-white rounded-xl border border-bg-border p-12 text-center">
        <iconify-icon class="text-4xl text-fg-disabled mb-2" icon="mdi:loading"></iconify-icon>
        <p class="text-sm text-fg-tertiary">加载中...</p>
      </div>
    </div>
  </div>
</div>
