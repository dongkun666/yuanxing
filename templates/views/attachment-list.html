<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-3 md:p-4 space-y-3 md:space-y-4" id="view-attachment-list">
<!-- 头部 -->
<div class="flex-none flex items-center justify-between" data-animate="fade-in-up" data-delay="0">
<div class="flex items-center gap-3">
<button class="w-9 h-9 flex items-center justify-center rounded-xl hover:bg-bg-subtle text-fg-secondary hover:text-brand transition-all hover:-translate-y-0.5" onclick="switchView('workstation')">
<iconify-icon class="text-lg" icon="mdi:arrow-left"></iconify-icon>
</button>
<div>
<h2 class="text-lg font-bold text-fg-primary">附件列表</h2>
<p class="text-[10px] text-fg-tertiary mt-0.5">管理您的所有文件和证据材料</p>
</div>
</div>
<div class="flex items-center gap-2">
<button class="flex items-center gap-1.5 h-9 px-4 text-xs font-medium rounded-xl bg-gradient-to-r from-brand to-ai text-white hover:shadow-lg hover:shadow-brand/25 transition-all duration-300 hover:-translate-y-0.5 group" onclick="openBatchUploadModal()">
<iconify-icon icon="mdi:cloud-upload-outline" class="text-sm group-hover:scale-110 transition-transform"></iconify-icon>
上传文件
</button>
</div>
</div>

<!-- 搜索筛选区 -->
<div class="ws-card p-4 md:p-5" data-animate="fade-in-up" data-delay="0.08">
<div class="flex items-center gap-3 flex-wrap">
<div class="relative flex-1 min-w-[200px] group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<iconify-icon class="text-fg-tertiary group-focus-within:text-brand transition-colors" icon="mdi:magnify"></iconify-icon>
</div>
<input id="attachment-search" class="w-full bg-bg-subtle border border-bg-border rounded-xl pl-10 pr-4 py-2.5 text-sm text-fg-primary focus:outline-none focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10 transition-all duration-200 placeholder:text-fg-disabled" placeholder="搜索文件名、案件..." type="text"/>
</div>
<div class="relative">
<select id="attachment-type-filter" class="appearance-none bg-bg-subtle border border-bg-border rounded-xl px-4 py-2.5 pr-9 text-sm text-fg-secondary focus:outline-none focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10 transition-all duration-200 cursor-pointer hover:border-brand/40">
</select>
<div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
<iconify-icon class="text-fg-tertiary text-xs" icon="mdi:chevron-down"></iconify-icon>
</div>
</div>
<div class="relative">
<select id="attachment-case-filter" class="appearance-none bg-bg-subtle border border-bg-border rounded-xl px-4 py-2.5 pr-9 text-sm text-fg-secondary focus:outline-none focus:border-brand focus:bg-white focus:ring-2 focus:ring-brand/10 transition-all duration-200 cursor-pointer hover:border-brand/40">
</select>
<div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
<iconify-icon class="text-fg-tertiary text-xs" icon="mdi:chevron-down"></iconify-icon>
</div>
</div>
<div class="flex items-center gap-1.5 ml-auto order-last md:order-none">
<div class="flex items-center gap-1.5 px-3 py-1.5 bg-brand-tint3 rounded-full">
<iconify-icon class="text-brand text-sm" icon="mdi:file-document-multiple-outline"></iconify-icon>
<span id="attachment-count" class="text-xs font-semibold text-brand">共 24 个文件</span>
</div>
</div>
<div class="flex items-center border border-bg-border rounded-xl overflow-hidden bg-white">
<button id="attachment-grid-view" class="flex items-center justify-center w-9 h-9 text-xs bg-gradient-to-r from-brand to-brand-hover text-white shadow-sm" aria-label="网格视图">
<iconify-icon icon="mdi:grid-view" class="text-sm"></iconify-icon>
</button>
<button id="attachment-list-view" class="flex items-center justify-center w-9 h-9 text-xs bg-white text-fg-secondary hover:bg-bg-subtle transition-colors" aria-label="列表视图">
<iconify-icon icon="mdi:format-list-bulleted" class="text-sm"></iconify-icon>
</button>
</div>
</div>
</div>

<!-- 文件类型概览标签 -->
<div class="hidden md:flex items-center gap-2 flex-wrap" data-animate="fade-in-up" data-delay="0.16" id="attachment-type-tags">
<button class="file-type-tag active px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 transition-all duration-200" data-type="all" onclick="filterByFileType('all')">
<iconify-icon icon="mdi:folder-multiple-outline" class="text-sm"></iconify-icon>
全部
<span class="file-type-count">24</span>
</button>
<button class="file-type-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 transition-all duration-200" data-type="pdf" onclick="filterByFileType('pdf')">
<iconify-icon icon="mdi:file-pdf-outline" class="text-sm"></iconify-icon>
PDF
<span class="file-type-count">12</span>
</button>
<button class="file-type-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 transition-all duration-200" data-type="word" onclick="filterByFileType('word')">
<iconify-icon icon="mdi:file-word-outline" class="text-sm"></iconify-icon>
Word
<span class="file-type-count">6</span>
</button>
<button class="file-type-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 transition-all duration-200" data-type="excel" onclick="filterByFileType('excel')">
<iconify-icon icon="mdi:file-excel-outline" class="text-sm"></iconify-icon>
Excel
<span class="file-type-count">3</span>
</button>
<button class="file-type-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 transition-all duration-200" data-type="image" onclick="filterByFileType('image')">
<iconify-icon icon="mdi:file-image-outline" class="text-sm"></iconify-icon>
图片
<span class="file-type-count">3</span>
</button>
</div>

<!-- 附件网格/列表 -->
<div class="ws-card overflow-hidden flex-1 flex flex-col" data-animate="fade-in-up" data-delay="0.24">
<div class="flex-1 min-h-0 overflow-y-auto p-4 md:p-5">
<!-- 骨架屏容器 -->
<div id="attachmentSkeletonContainer" class="hidden">
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
<div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text w-1/2"></div></div>
<div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text w-1/2"></div></div>
<div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text w-1/2"></div></div>
<div class="skeleton-card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text w-1/2"></div></div>
</div>
</div>
<!-- 空状态容器 -->
<div id="attachmentEmptyState" class="hidden"></div>
<div id="attachment-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4">
<!-- 文件卡片由 JS 渲染 -->
</div>
</div>
</div>
</div>
