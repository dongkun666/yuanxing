<div class="view-content hidden flex-1 flex flex-col overflow-y-auto p-4 md:p-6 bg-bg" id="view-deadline">
<div class="max-w-6xl mx-auto w-full space-y-4 md:space-y-5">

    <!-- 顶部 Hero 区域 -->
    <div class="relative overflow-hidden bg-gradient-to-br from-orange-500 via-urgent to-red-500 rounded-2xl px-5 py-6 md:px-6 md:py-7" data-animate="fade-in-up" data-delay="0">
        <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/2 blur-3xl"></div>
        <div class="absolute bottom-0 left-1/3 w-48 h-48 bg-white/5 rounded-full translate-y-1/2 blur-2xl"></div>
        <div class="relative z-10">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 md:w-14 md:h-14 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center flex-shrink-0">
                        <iconify-icon class="text-2xl md:text-3xl text-white" icon="mdi:clock-alert-outline"></iconify-icon>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold text-white mb-1">法律期限计算器</h1>
                        <p class="text-white/80 text-xs md:text-sm">选择案件类型 + 触发事件 + 起始日期，自动计算所有相关期限</p>
                        <p class="text-[10px] text-white/60 mt-1 flex items-center gap-1">
                            <iconify-icon icon="mdi:alert-circle"></iconify-icon>
                            AI 辅助参考，请以现行法律法规和司法机关通知为准
                        </p>
                    </div>
                </div>
            </div>

            <!-- 顶部数据概览卡片 -->
            <div class="grid grid-cols-3 gap-3 mt-5">
                <div class="bg-white/15 backdrop-blur-md rounded-xl p-3 border border-white/20 hover:bg-white/20 transition-all duration-300 hover:-translate-y-0.5 group" data-animate="scale-in" data-stagger-group="dl-stats" data-stagger-index="0" data-delay="0.1">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-white/70 text-[11px]">即将到期</span>
                        <div class="w-7 h-7 rounded-lg bg-red-400/40 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <iconify-icon icon="mdi:alarm-light-outline" class="text-white text-sm"></iconify-icon>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white kb-tabular-nums">3</p>
                    <p class="text-[10px] text-white/60 mt-0.5">7 天内到期</p>
                </div>
                <div class="bg-white/15 backdrop-blur-md rounded-xl p-3 border border-white/20 hover:bg-white/20 transition-all duration-300 hover:-translate-y-0.5 group" data-animate="scale-in" data-stagger-group="dl-stats" data-stagger-index="1" data-delay="0.1">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-white/70 text-[11px]">已逾期</span>
                        <div class="w-7 h-7 rounded-lg bg-orange-400/40 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <iconify-icon icon="mdi:clock-remove-outline" class="text-white text-sm"></iconify-icon>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white kb-tabular-nums">0</p>
                    <p class="text-[10px] text-white/60 mt-0.5">当前无逾期</p>
                </div>
                <div class="bg-white/15 backdrop-blur-md rounded-xl p-3 border border-white/20 hover:bg-white/20 transition-all duration-300 hover:-translate-y-0.5 group" data-animate="scale-in" data-stagger-group="dl-stats" data-stagger-index="2" data-delay="0.1">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-white/70 text-[11px]">全部期限</span>
                        <div class="w-7 h-7 rounded-lg bg-green-400/40 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <iconify-icon icon="mdi:calendar-check-outline" class="text-white text-sm"></iconify-icon>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white kb-tabular-nums">5</p>
                    <p class="text-[10px] text-white/60 mt-0.5">项相关期限</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 案件类型选择 -->
    <div class="ws-card p-4" data-animate="fade-in-up" data-delay="0.2">
        <div class="flex items-center gap-2 mb-3">
            <div class="w-6 h-6 rounded-md bg-gradient-to-br from-brand to-brand-hover flex items-center justify-center flex-shrink-0">
                <span class="text-xs font-bold text-white">1</span>
            </div>
            <h2 class="text-sm font-semibold text-fg-primary">选择案件类型</h2>
        </div>
        <div class="flex flex-wrap gap-2" id="deadline-case-type-chips">
            <button class="deadline-chip active" data-type="civil-first" onclick="selectDeadlineCaseType('civil-first', this)">
                <iconify-icon class="text-base" icon="mdi:gavel"></iconify-icon>
                民事一审
            </button>
            <button class="deadline-chip" data-type="civil-second" onclick="selectDeadlineCaseType('civil-second', this)">
                <iconify-icon class="text-base" icon="mdi:scale-balance"></iconify-icon>
                民事二审
            </button>
            <button class="deadline-chip" data-type="admin" onclick="selectDeadlineCaseType('admin', this)">
                <iconify-icon class="text-base" icon="mdi:bank-outline"></iconify-icon>
                行政诉讼
            </button>
            <button class="deadline-chip" data-type="criminal" onclick="selectDeadlineCaseType('criminal', this)">
                <iconify-icon class="text-base" icon="mdi:shield-alert-outline"></iconify-icon>
                刑事案件
            </button>
            <button class="deadline-chip" data-type="execution" onclick="selectDeadlineCaseType('execution', this)">
                <iconify-icon class="text-base" icon="mdi:file-document-check-outline"></iconify-icon>
                申请执行
            </button>
            <button class="deadline-chip" data-type="payment-order" onclick="selectDeadlineCaseType('payment-order', this)">
                <iconify-icon class="text-base" icon="mdi:cash-fast"></iconify-icon>
                支付令
            </button>
            <button class="deadline-chip" data-type="work-injury" onclick="selectDeadlineCaseType('work-injury', this)">
                <iconify-icon class="text-base" icon="mdi:medical-bag"></iconify-icon>
                工伤认定
            </button>
            <button class="deadline-chip" data-type="divorce" onclick="selectDeadlineCaseType('divorce', this)">
                <iconify-icon class="text-base" icon="mdi:heart-broken"></iconify-icon>
                婚姻家事
            </button>
            <button class="deadline-chip" data-type="arbitration" onclick="selectDeadlineCaseType('arbitration', this)">
                <iconify-icon class="text-base" icon="mdi:scale-balance"></iconify-icon>
                商事仲裁
            </button>
            <button class="deadline-chip" data-type="public-notice" onclick="selectDeadlineCaseType('public-notice', this)">
                <iconify-icon class="text-base" icon="mdi:bullhorn-outline"></iconify-icon>
                公示催告
            </button>
        </div>
    </div>

    <!-- 触发事件 + 日期 -->
    <div class="ws-card p-4" data-animate="fade-in-up" data-delay="0.3">
        <div class="flex items-center gap-2 mb-3">
            <div class="w-6 h-6 rounded-md bg-gradient-to-br from-brand to-brand-hover flex items-center justify-center flex-shrink-0">
                <span class="text-xs font-bold text-white">2</span>
            </div>
            <h2 class="text-sm font-semibold text-fg-primary">设置触发事件与起始日期</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">触发事件</label>
                <div class="relative">
                    <select id="deadline-event-select" class="w-full appearance-none bg-bg-subtle border border-bg-border rounded-lg pl-3 pr-9 py-2.5 text-sm text-fg-primary focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 focus:bg-white transition-all">
                        <!-- 动态填充 -->
                    </select>
                    <iconify-icon class="absolute right-3 top-1/2 -translate-y-1/2 text-fg-tertiary pointer-events-none" icon="mdi:chevron-down"></iconify-icon>
                </div>
                <p class="text-[10px] text-fg-tertiary mt-1" id="deadline-event-hint"></p>
            </div>
            <div>
                <label class="block text-xs font-medium text-fg-secondary mb-1.5">起始日期</label>
                <input type="date" id="deadline-start-date" class="w-full bg-bg-subtle border border-bg-border rounded-lg px-3 py-2.5 text-sm text-fg-primary focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 focus:bg-white transition-all" onchange="recalculateDeadlines()"/>
                <p class="text-[10px] text-fg-tertiary mt-1" id="deadline-today-hint"></p>
            </div>
        </div>
        <!-- 一键快捷日期 -->
        <div class="flex items-center gap-2 mt-3 flex-wrap">
            <span class="text-[10px] text-fg-tertiary mr-1">快捷：</span>
            <button class="text-[10px] px-2.5 py-1 rounded-md bg-bg-subtle text-fg-secondary hover:bg-brand-tint hover:text-brand transition-all" onclick="setDeadlineDate(0)">今天</button>
            <button class="text-[10px] px-2.5 py-1 rounded-md bg-bg-subtle text-fg-secondary hover:bg-brand-tint hover:text-brand transition-all" onclick="setDeadlineDate(-1)">昨天</button>
            <button class="text-[10px] px-2.5 py-1 rounded-md bg-bg-subtle text-fg-secondary hover:bg-brand-tint hover:text-brand transition-all" onclick="setDeadlineDate(-7)">7 天前</button>
            <button class="text-[10px] px-2.5 py-1 rounded-md bg-bg-subtle text-fg-secondary hover:bg-brand-tint hover:text-brand transition-all" onclick="setDeadlineDate(-30)">30 天前</button>
            <button class="text-[10px] px-2.5 py-1 rounded-md bg-bg-subtle text-fg-secondary hover:bg-brand-tint hover:text-brand transition-all" onclick="setDeadlineDate(-90)">3 个月前</button>
        </div>
    </div>

    <!-- 筛选区域 -->
    <div class="ws-card p-4" data-animate="fade-in-up" data-delay="0.35">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-md bg-gradient-to-br from-urgent to-orange-500 flex items-center justify-center flex-shrink-0">
                    <iconify-icon icon="mdi:filter-variant" class="text-xs text-white"></iconify-icon>
                </div>
                <h2 class="text-sm font-semibold text-fg-primary">期限筛选</h2>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button class="px-3 py-1.5 text-[10px] font-medium rounded-md bg-gradient-to-r from-brand to-brand-hover text-white shadow-md shadow-brand/20">全部</button>
                <button class="px-3 py-1.5 text-[10px] font-medium rounded-md bg-red-50 text-red-600 hover:bg-red-100 transition-all">高危</button>
                <button class="px-3 py-1.5 text-[10px] font-medium rounded-md bg-orange-50 text-orange-600 hover:bg-orange-100 transition-all">中危</button>
                <button class="px-3 py-1.5 text-[10px] font-medium rounded-md bg-blue-50 text-blue-600 hover:bg-blue-100 transition-all">低危</button>
                <button class="px-3 py-1.5 text-[10px] font-medium rounded-md bg-green-50 text-green-600 hover:bg-green-100 transition-all">已完成</button>
            </div>
        </div>
    </div>

    <!-- 期限结果 -->
    <div class="ws-card p-4" id="deadline-results-card" data-animate="fade-in-up" data-delay="0.4">
        <div class="flex items-center gap-2 mb-4">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-success to-green-600 flex items-center justify-center text-white shadow-md shadow-success/20">
                <iconify-icon class="text-base" icon="mdi:calendar-check-outline"></iconify-icon>
            </div>
            <div>
                <h2 class="text-sm font-semibold text-fg-primary">期限计算结果</h2>
                <p class="text-[10px] text-fg-tertiary">按截止日期从近到远排序</p>
            </div>
            <span class="text-[10px] text-fg-tertiary ml-auto" id="deadline-results-count"></span>
        </div>

        <!-- 空态 -->
        <div class="text-center py-8" id="deadline-empty">
            <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-br from-orange-50 to-warning-tint flex items-center justify-center mb-4">
                <iconify-icon class="text-4xl text-urgent/60" icon="mdi:calendar-arrow-right"></iconify-icon>
            </div>
            <p class="text-sm font-medium text-fg-secondary">请选择案件类型 + 触发事件 + 起始日期</p>
            <p class="text-[11px] text-fg-tertiary mt-1">系统会自动计算所有相关期限</p>
            <button class="mt-4 px-4 py-2 text-xs font-medium rounded-lg bg-gradient-to-r from-brand to-brand-hover text-white hover:shadow-md hover:shadow-brand/20 transition-all duration-200 hover:-translate-y-0.5 flex items-center gap-1.5 mx-auto" onclick="setDeadlineDate(0)">
                <iconify-icon icon="mdi:calendar-today"></iconify-icon>
                使用今天日期
            </button>
        </div>

        <!-- 结果列表 (动态填充) -->
        <div class="space-y-3 hidden" id="deadline-results-list">
            <!-- 由 deadline.js 动态渲染 -->
        </div>
    </div>

    <!-- 期限规则库（参考） -->
    <div class="ws-card p-4" data-animate="fade-in-up" data-delay="0.5">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-wiki flex items-center justify-center text-white shadow-md shadow-wiki/20">
                    <iconify-icon class="text-base" icon="mdi:book-open-page-variant-outline"></iconify-icon>
                </div>
                <div>
                    <h2 class="text-sm font-semibold text-fg-primary">期限规则说明</h2>
                    <p class="text-[10px] text-fg-tertiary">数据来源：民事诉讼法/行政诉讼法/刑事诉讼法/民法典</p>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-[11px]" id="deadline-rule-refs">
            <!-- 由 deadline.js 动态渲染 -->
        </div>
    </div>

    <!-- 底部提示 -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pb-2" data-animate="fade-in-up" data-delay="0.55">
        <p class="text-[11px] text-fg-tertiary flex items-center gap-1">
            <iconify-icon icon="mdi:information-outline"></iconify-icon>
            本工具仅供参考，具体期限请以法律法规及法院通知为准
        </p>
        <div class="flex items-center gap-2">
            <button class="px-3 py-1.5 text-[10px] font-medium rounded-lg border border-bg-border text-fg-secondary hover:bg-bg-subtle hover:shadow-sm transition-all duration-200 flex items-center gap-1" onclick="copyAllDeadlines()">
                <iconify-icon icon="mdi:content-copy" class="text-xs"></iconify-icon>
                复制全部
            </button>
            <button class="px-3 py-1.5 text-[10px] font-medium rounded-lg bg-gradient-to-r from-brand to-brand-hover text-white hover:shadow-md hover:shadow-brand/20 transition-all duration-200 hover:-translate-y-0.5 flex items-center gap-1">
                <iconify-icon icon="mdi:download-outline" class="text-xs"></iconify-icon>
                导出清单
            </button>
        </div>
    </div>

</div>
</div>
