<!DOCTYPE html>

<meta charset="utf-8"/>

<!-- Iconify 图标 -->

<!-- Iconify 本地图标配置 -->
<script>
(function() {
    // 配置 Iconify 使用本地图标数据
    if (typeof Iconify !== 'undefined') {
        Iconify.setAPI({
            local: {
                url: './assets/icons/{prefix}.json'

        });

})();
</script>
<!-- ECharts -->

<!-- 自定义样式 -->

</head>
<body class="h-screen flex flex-col min-w-[1024px]">
<!-- 顶部导航栏 -->
<header class="h-12 bg-white border-b border-[#E5E6EB] flex items-center justify-between px-4 z-50 flex-none">

<button class="w-full flex items-center gap-3 px-4 py-2 text-xs text-[#4E5969] hover:bg-[#F7F8FA] transition-colors" onclick="event.stopPropagation(); switchToMemberCenter()">

<!-- 主内容区（动态加载视图模板） -->
<main class="flex-1 min-w-[784px] overflow-hidden relative flex flex-col" id="main-content">

</main>

<!-- 主脚本 -->
<script src="./assets/js/script.js?v=10"></script>
<!-- 预加载弹窗模板 -->
<script>
(function() {
    // 加载弹窗模板
    fetch('templates/modals.html')
        .then(function(response) { return response.text(); })
        .then(function(html) {
            document.body.insertAdjacentHTML('beforeend', html);
        })
        .catch(function(err) { console.error('加载弹窗模板失败:', err); });
    // 预加载工作台视图（默认显示）
    fetch('templates/views/workstation.html')
        .then(function(response) { return response.text(); })
        .then(function(html) {
            document.getElementById('main-content').innerHTML = html;
        })
        .catch(function(err) { console.error('加载工作台视图失败:', err); });
})();
</script>
