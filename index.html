<script>
(function() {

    function addLocalIconSet() {
        if (typeof Iconify !== 'undefined' && typeof Iconify.addCollection === 'function') {
            fetch('./assets/icons/mdi.json')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    Iconify.addCollection(data);
                })
                .catch(function(err) {
                    console.warn('加载本地图标集失败:', err);
                });
        } else {
            setTimeout(addLocalIconSet, 100);
        }
    }
    addLocalIconSet();
})();
