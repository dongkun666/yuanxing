version: '3.8'

services:
  backend:
    build:
      context: ./backend/cases-crawler
      dockerfile: Dockerfile
    container_name: lexprime-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=false
      - API_CORS_ORIGINS=http://localhost,http://localhost:80
    networks:
      - lexprime-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lexprime-frontend
    ports:
      - "80:80"
    networks:
      - lexprime-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"

networks:
  lexprime-network:
    driver: bridge