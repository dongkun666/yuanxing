name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'phase5-rust/**'
  pull_request:
    branches: [main]
    paths:
      - 'phase5-rust/**'

jobs:
  rust-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: phase5-rust

      - name: Run cargo test
        working-directory: phase5-rust
        run: cargo test
