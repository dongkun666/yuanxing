name: CD

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types:
      - completed

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend/cases-crawler
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lexprime-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/lexprime-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lexprime-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/lexprime-frontend:${{ github.sha }}