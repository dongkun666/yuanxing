name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Archive build artifacts
        run: zip -r lexprime-frontend-${{ github.ref_name }}.zip dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lexprime-frontend
          path: lexprime-frontend-${{ github.ref_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lexprime-frontend

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            - See [CHANGELOG](CHANGELOG.md) for details
          files: |
            lexprime-frontend-${{ github.ref_name }}.zip
          draft: false
          prerelease: false