version: 1
plan:
  name: 'LexPrime Phase 4 Week 5: W5 接力 (UI 实施 + W4 reindex 闭环 + OCR + 试用版)'
  max_concurrency: 4
  max_consecutive_failures: 2
  max_cycles: 4
  auto_accept: true
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  # Task 1: W5 UI 实施 (5 页面按 W4 lex-design 原型)
  - id: 'w5-ui-impl'
    title: 'W5 合同审查 UI 实施 (5 页面按 W4 原型 + 6 项 P1-P3 修复 + 移动端)'
    prompt: |
      接力 W4 lex-design 完成的 5 页面 HTML 高保真原型, W5 实施真正的 UI。

      必读文档:
      - W4 UI 设计稿: docs/designs/contract-review/ (5 HTML + README.md + review-by-lawyer.md)
      - W4 design commits: 6511176 + a663580 + a2af3b3
      - W1 设计系统: docs/design-system.md + tailwind.config.js (#165DFF 品牌色)
      - W1 3 个原型参考: docs/designs/workstation.html + case-list.html + case-detail.html
      - 你的 agent.md (含防越权约束): C:\Users\42081\.mavis\agents\lex-coder\agent.md
      - PRD § 3.12.2 各类合同 + § 5.4 Skill Hub

      W5 工作范围:
      1. **5 页面实施** (W5 Day 1-4, 按 lex-design 建议顺序):
         1. 02-review-result.html (核心页, 风险高亮 + 条款定位)
         2. 01-upload.html (上传 + 立场选择)
         3. 05-export.html (Word/PDF/Markdown 导出)
         4. 03-suggestion-detail.html (条款级建议 + 法条 + 历史样本)
         5. 04-negotiation.html (谈判策略弹窗)
         - 落地路径: templates/views/contract-review/*.html
         - 复用 W1 Tailwind 配置 (深蓝品牌色 + 风险色红黄蓝)
         - 5 页面 = 5 commits (1 页面 1 commit, 跟 W4 lex-design 同款粒度)
      2. **6 项 P1-P3 修复** (W5 Day 5):
         - P1: 02 头部加 Tab 切换"单合同审查 / 版本比对"
         - P2: 01 上传页加"立场影响预览" + 02 头部"立场切换器"
         - P2: 02 致命条款 > 3 自动折叠 + 风险条款导航固定
         - P1: 03 采用按钮 → Toast + 02 状态同步 + 审计 log
         - P3: 移动端 < 768px 适配 (7+5 / 8+4 → 单栏堆叠 + 模态框全屏)
         - P2: 无障碍 / 键盘可达 (tabindex + focus:ring + ARIA)
      3. **Skill 2 API 接入** (W5 Day 4):
         - /api/contract-review/upload (复用 W3 lex-ai reviewer)
         - /api/contract-review/result (返回风险列表 + retrieval_evidence)
         - /api/contract-review/negotiation (谈判策略)
         - /api/contract-review/export (Word/PDF 生成)
      4. **demo 模式 fallback** (W5 Day 5):
         - 静态 5 合同 baseline (复用 lex-pm W4 test-contracts-results)
         - Demo 模式不调真 API, 用 fixture 数据
      5. **必跑**: ruff 0 + pytest 100% + playwright 截图 5 页面
      6. **git commit + push** (5 commits minimum + 1 修复 commit = 6 total)

      Stop when (W5 末):
      - 5 页面 templates/views/contract-review/*.html 实施完成
      - Skill 2 API 接入 (4 endpoint)
      - Demo 模式 5 合同 fixture 跑通
      - 6 项 P1-P3 修复完成
      - 移动端 < 768px 适配
      - 键盘可达 / ARIA 标签完整
      - pytest 100% + ruff 0
      - playwright 截图 5 页面
      - git log 显示 5+ W5 commits
    assigned_to: 'lex-coder'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证 W5 UI 实施交付:
      1. templates/views/contract-review/ 5 HTML 文件 + JS 全部存在
      2. 设计系统与 W4 原型字节级一致 (#165DFF 品牌色 + 风险色)
      3. 风险高亮 (致命/重大/建议) DOM + CSS 真实落地
      4. 5 页面 Playwright 截图 (桌面 1440 + 移动 375) 全部生成
      5. Skill 2 API 4 endpoint 接入 (curl 验证)
      6. Demo 模式 5 合同 fixture 跑通
      7. 6 项 P1-P3 修复 (grep 关键特征: Tab 切换 / 立场预览 / 折叠 / Toast / 移动端 media query / ARIA)
      8. 键盘可达 (tabindex + focus:ring + ESC 关闭)
      9. pytest 100% + ruff 0
      10. git log 显示 5+ W5 commits

      PASS/FAIL 报告.
    max_retries: 2
    timeout_ms: 1200000
    hang_alert_after_ms: 900000

  # Task 2: W4 reindex 闭环 (W4 集成遗留 gap)
  - id: 'w5-reindex-gap'
    title: 'W5 W4 集成遗留 gap 闭环 (6076 合同 reindex 进 BGE LanceDB)'
    prompt: |
      W4 集成验证发现 1 个遗留 gap: lex-data 扩量 6076 合同模板未进入 BGE LanceDB 索引。
      根因: scripts/index_contracts.py:48 glob 只 load 顶层 *.json, 不递归 w4_extended/。

      必读文档:
      - W4 集成验证报告: docs/plans/plan-04-w4-final-report.md § 4 "1 个 W5 follow-up"
      - W4 合同扩量 commits: cdec225 + ef4e89d + a9be26e + 32fc4c1
      - BGE embedding 服务: backend/cases-crawler/core/embeddings.py
      - LanceDB 索引: backend/cases-crawler/core/lancedb_index.py
      - index_contracts.py: backend/cases-crawler/scripts/index_contracts.py:48 (需修改这一行)

      W5 工作范围:
      1. **改 index_contracts.py:48 glob**:
         - 现状: `files = sorted(contracts_dir.glob("*.json"))` (只顶层)
         - 改为: `files = sorted(contracts_dir.glob("**/*.json"))` (递归)
         - 兼容 W3 baseline (顶层 56) + W4 扩量 (w4_extended/*/*.json 6020)
      2. **重跑 index_contracts.py**:
         - 验证: LanceDB contract_clauses 56 → 6076 rows
         - 验证: contract_risks 280 → 30500 rows (6076 × 5 avg)
         - 性能: 期望 P95 embedding < 100ms × 6076 模板 ≈ 10-15 min 总耗时
      3. **回归测试**:
         - Skill 2 reviewer 端到端: 输入新合同 → 召回 W4 历史样本 (不再是空)
         - retrieval_stats: index_enabled=True, recall_pct >= 80% (top-5)
      4. **更新 lex-data W4 deliverable + lex-ai W4 deliverable**:
         - 标注 W4 reindex 已闭环
      5. **git commit + push** (1 commit)
      6. **W5 集成验证准备**: 记录 W5 集成验证需要 recheck E2E

      Stop when (W5 末):
      - index_contracts.py:48 改完 (glob('**/*.json'))
      - LanceDB contract_clauses = 6076 rows (不是 56)
      - LanceDB contract_risks >= 30000 rows
      - Skill 2 reviewer E2E 召回 W4 历史样本 (retrieval_evidence 至少 1 条 sim > 0.5)
      - pytest 100% (含 regression test)
      - ruff 0
      - git log 显示 1+ W5 commit
    assigned_to: 'lex-ai'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证 W4 reindex 闭环:
      1. index_contracts.py:48 已改 glob('**/*.json')
      2. LanceDB contract_clauses count = 6076 (SQLite count + LanceDB table count)
      3. LanceDB contract_risks count >= 30000
      4. Skill 2 reviewer E2E: 新合同输入 → retrieval_evidence 至少 1 条 sim > 0.5 来自 W4 扩量
      5. retrieval_stats: index_enabled=True, recall_pct >= 80% (top-5)
      6. pytest 100% (含 regression test, 不破坏 W3 baseline)
      7. ruff 0
      8. git log 显示 1+ W5 commit

      PASS/FAIL 报告.
    max_retries: 2
    timeout_ms: 1200000
    hang_alert_after_ms: 900000

  # Task 3: OCR 接入 (Track B 启动)
  - id: 'w5-ocr-track-b'
    title: 'W5 Track B 启动: PaddleOCR 接入 Skill 2 合同图片识别'
    prompt: |
      启动 Track B 基础设施: PaddleOCR 接入 Skill 2 合同审查 (W4 UI 01 上传页有"拍照 OCR"入口)。

      必读文档:
      - PRD § 4.1 OCR 与全文识别 + § 4.3 文档理解
      - docs/prd/tracks/B-ocr.md
      - T-REF-15 (附录 16) PaddleOCR 借鉴
      - 律师执业证 W3 OCR commit 8e01a83 (复用 PaddleOCR 基础设施)
      - W4 UI 01-upload.html "其他方式" 含拍照 OCR 入口

      W5 工作范围:
      1. **PaddleOCR 部署** (W5 Day 1):
         - pip install paddleocr paddlepaddle
         - 模型: chinese_ppocr_mobile_v2.0 (轻量, 11MB)
         - 离线下载 (huggingface 或百度镜像)
         - 服务封装: backend/cases-crawler/core/ocr.py
      2. **Skill 2 集成** (W5 Day 2):
         - /api/contract-review/ocr-upload (新 endpoint, 接收图片/PDF)
         - 流程: 上传 → OCR 识别 → 返回结构化文本 → 走 reviewer 双路召回
         - 输入格式: PNG / JPG / PDF (含扫描件)
         - 输出: Markdown 文本 + 置信度
      3. **PII 脱敏** (W5 Day 2):
         - OCR 识别后自动检测: 身份证号 / 手机号 / 银行卡 / 地址
         - 脱敏规则: 身份证保留前 4 后 4, 手机保留前 3 后 4, 其他全 mask
         - 输出脱敏后文本进 reviewer
      4. **单元测试** (W5 Day 3):
         - OCR 识别准确率 (测试 5 张样张, 文本匹配率 >= 85%)
         - PII 脱敏 100% (10 case: 各种 PII 模式)
         - Skill 2 集成 E2E (图片上传 → 风险列表返回)
      5. **W1 复用** (W5 Day 3):
         - 律师执业证 OCR 基础设施 (commit 8e01a83) 抽公共 OCR 类
         - 跟 W3 律师执业证 OCR 共享 PaddleOCR 加载逻辑
      6. **必跑**: ruff 0 + pytest 100%
      7. **git commit + push** (3 commits: 1 部署 + 1 集成 + 1 PII)

      Stop when (W5 末):
      - PaddleOCR 部署 (chinese_ppocr_mobile_v2.0)
      - /api/contract-review/ocr-upload endpoint
      - PII 自动脱敏 100% (10 case 验证)
      - Skill 2 集成 E2E (图片 → 风险列表)
      - 复用 W3 律师执业证 OCR 基础设施
      - pytest 100% + ruff 0
      - git log 显示 3+ W5 commits
    assigned_to: 'lex-ai'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证 W5 OCR 接入:
      1. PaddleOCR chinese_ppocr_mobile_v2.0 部署 (import 验证)
      2. /api/contract-review/ocr-upload endpoint 存在 (FastAPI route 列表)
      3. PII 脱敏 100% (10 case 验证: 身份证 / 手机 / 银行卡 / 地址 / 邮箱)
      4. Skill 2 集成 E2E (上传图片 → 返回风险列表 JSON, 跟 PDF 上传路径一致)
      5. W1 律师执业证 OCR 基础设施复用 (import 路径, 不重复定义)
      6. OCR 准确率 >= 85% (5 张样张文本匹配)
      7. pytest 100% + ruff 0
      8. git log 显示 3+ W5 commits

      PASS/FAIL 报告.
    max_retries: 2
    timeout_ms: 1200000
    hang_alert_after_ms: 900000

  # Task 4: 试用版准备 (Track D)
  - id: 'w5-trial-onboarding'
    title: 'W5 试用版准备 (Track D: 30 天免费试用 onboarding + 个人版 ¥99/月 定价页)'
    prompt: |
      启动 Track D 试用版准备: 30 天免费试用 + 个人版 ¥99/月 定价 + 创始体验官邀请。
      (W6 律师实地评审 + W7 公测预热, 试用版 onboarding 必须先就位)

      必读文档:
      - PRD § 9 商业模式 + § 10 成功指标
      - docs/prd/09-business-model.md (个人版 ¥99/月 + 企业版 ¥1500-2000/律师/年)
      - docs/prd/03-core-steps.md (5 步 + 立案预审)
      - W1 workstation.html (已含 "检查更新" 入口)
      - W3 Auth 8 endpoint (W3 完整)

      W5 工作范围:
      1. **试用注册流程** (W5 Day 1):
         - 30 天免费试用 (无信用卡)
         - 注册即用, 不需审核
         - 试用期内: 全部 Skill (类案 + 合同 + 文书 + 庭审) 开放
         - 试用期结束: 提示升级个人版, 不强制
         - 落地: /api/trial/start + /api/trial/status + UI 提示
      2. **定价页** (W5 Day 2):
         - 个人版 ¥99/月 (或 ¥899/年 8 折)
         - 企业版 ¥1500-2000/律师/年 (按 30 天免费试用 + 阶梯定价)
         - 创始体验官 (前 100 名): 1 年个人版 5 折 ¥449/年 + 终身优先客服
         - 落地: templates/views/pricing.html (跟 W1 设计系统一致)
         - 法务咨询通道: 创始人 42081 微信 / 邮箱 (隐私脱敏)
      3. **Onboarding 引导** (W5 Day 3):
         - 注册后首次登录: 5 步引导 (上传首个案件 / 跑类案检索 / 跑合同审查 / 邀请同行 / 关注公众号)
         - 跳过按钮 (律师时间宝贵, 不能强制)
         - 完成节点: 提示"你已解锁核心功能"
      4. **公测邀请函** (W5 Day 3):
         - 模板: docs/marketing/beta-invitation.md
         - 目标: 总指挥 5 位律师 (W2 #1 #2 + W3 #3 #4 + 微信群律师)
         - 渠道: 微信 / 邮件 (含 W2 / W3 / W4 律师关系)
         - 转化漏斗: 邀请 → 注册 → 试用 → 付费 (W6 起跟踪)
      5. **付费墙 (paywall) 设计** (W5 Day 4):
         - 试用期内: 全部功能开放
         - 试用期结束: 锁定高级 Skill (庭审准备 / 批量合同审查), 基础类案 + 文书仍开放
         - 升级提示: 弹窗 + 邮件 + 微信 (3 渠道)
      6. **PRD 反馈** (W5 Day 4):
         - 试用注册数据 / 转化漏斗指标写入 PRD § 10 成功指标
      7. **git commit + push** (3 commits: 1 试用 + 1 定价 + 1 onboarding)

      Stop when (W5 末):
      - 30 天免费试用注册流程完整
      - 定价页 templates/views/pricing.html (跟 W1 设计系统一致)
      - Onboarding 5 步引导
      - 公测邀请函模板 + 目标律师清单
      - 付费墙设计 (paywall)
      - PRD § 10 成功指标更新
      - git log 显示 3+ W5 commits
    assigned_to: 'lex-pm'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证 W5 试用版准备:
      1. /api/trial/start + /api/trial/status endpoint 存在
      2. 定价页 templates/views/pricing.html 渲染 (Playwright 截图)
      3. 个人版 ¥99/月 + 企业版 ¥1500-2000/律师/年 + 创始体验官 1 年 5 折 全部展示
      4. Onboarding 5 步引导模板就位
      5. 公测邀请函 docs/marketing/beta-invitation.md + 5+ 律师目标清单
      6. 付费墙设计 (paywall) 就位 (试用期结束 → 锁定高级 Skill)
      7. PRD § 10 成功指标更新 (试用注册 / 转化漏斗)
      8. 设计系统与 W1 一致 (#165DFF + Tailwind)
      9. git log 显示 3+ W5 commits

      PASS/FAIL 报告.
    max_retries: 2
    timeout_ms: 1200000
    hang_alert_after_ms: 900000

  # Task 5: W5 集成验证 (5 task 联动)
  - id: 'w5-integration'
    title: 'W5 集成验证 (UI 实施 + reindex 闭环 + OCR + 试用版 联动)'
    prompt: |
      验证 W5 4 个 Track 集成:
      1. UI 实施 (lex-coder) 5 页面是否引用 reindex 闭环 (lex-ai) 的 6076 合同 + OCR 路径 + 试用版入口
      2. reindex 闭环 (lex-ai) 是否被 UI 实施引用 (reviewer 召回 W4 历史样本)
      3. OCR 接入 (lex-ai) 是否被 UI 实施 01 上传页"拍照 OCR"入口调用
      4. 试用版 (lex-pm) onboarding 是否在 UI 实施 5 页面可见
      5. 4 agent deliverable 无冲突
      6. 4 agent 全部 git commit + push

      输出 W5 总结 + W6 建议 (一句话: 律师实地访谈 7/19-7/26)。
    assigned_to: 'verifier'
    role: 'verify-as-task'
    depends_on:
      - 'w5-ui-impl'
      - 'w5-reindex-gap'
      - 'w5-ocr-track-b'
      - 'w5-trial-onboarding'
    max_retries: 1
    timeout_ms: 900000
    hang_alert_after_ms: 900000
