      - W3 Skill 2 commit 67215d0 (SKILL.md)
      - W4 类案 commit 3edd96f (LanceDB BGE)

      W10 A1 工作范围:
      1. **一体化 API** (主):
         - backend/cases-crawler/api/full_workflow_router.py (新文件)
         - POST /api/case/full-workflow (case_id → 三步流水线)
         - 流程: 类案检索 (W4) → 合同审查 (W3 Skill 2) → 文书生成 (W9 C1)
         - 输出 case_summary.json: {class_cases: [...], risks: [...], docs: {complaint, defense, contract, letter}}
         - 端点模式参考 W7 review_router
      2. **OCR 缓存两步拆分** (D4 blocker #1):
         - backend/cases-crawler/core/ocr_cache.py (新文件)
         - step1: OCR 识别 (缓存到 SQLite ocr_cache 表, 5 分钟 TTL)
         - step2: 文本后处理 (PII 脱敏 + 解析 + skill 2 入库)
         - 复用 scripts/w8/ocr_via_venv312.py 原型
      3. **review.py _get_risk_index cwd 依赖修复** (D4 blocker #2):
         - backend/cases-crawler/core/review.py _get_risk_index 改用绝对路径
