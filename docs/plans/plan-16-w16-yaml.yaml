      - W15 final report (plan-15-w15-final-report.md) §2.3 verifier 报的 path bug 描述

      W16 w15-followup-path 工作范围:

      1. **path bug 定位** (scripts/trigger-paid-email-723.sh + trigger-l4l5-email-819.sh):
         - 检查 SCRIPT_DIR/.. 路径解析 (BASH_SOURCE 是否在 Windows 环境兼容)
         - 检查 $PROJECT_ROOT 是否 fallback 到 yuanxing/ 根目录
         - 检查 python 或 shell 调用路径是否相对

      2. **path bug 修复** (scripts/trigger-paid-email-723.sh + trigger-l4l5-email-819.sh):
         - 改 SCRIPT_DIR 解析: `${BASH_SOURCE[0]}` 兼容 Windows + Unix
         - 改 PROJECT_ROOT: `cd "$(dirname "$SCRIPT_DIR")/.." && pwd` 显式 cd
         - 加 dry-run 模式默认 (避免误触)
         - 加 log 路径检查 (logs/cron/ 目录自动创建)

      3. **回归测试** (scripts/test-trigger-path.sh):
         - 3 场景: 7/23 (W14 cron) + 8/19 (W15 l4l5 cron) + 公测 day 1 dry-run
         - 验证路径解析在 Windows + WSL + macOS 兼容
         - ruff 0 + shellcheck 0

      4. **git commit + push** (1 commit: 路径修复 + 测试)

