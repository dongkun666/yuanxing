  # Task 5: W6 集成验证 (4 task 联动)
  - id: 'w6-integration'
    title: 'W6 集成验证 (律师访谈 + Score App + landing + 邀请码运营 联动)'
    prompt: |
      验证 W6 4 个 Track 集成:
      1. 律师访谈准备 (lex-pm) 是否引用 Score App (lex-coder) 5 测试合同 + 评审流程
      2. Score App (lex-coder) 评分提交是否落库 review_scores, 汇总接口给 lex-pm 24h 整理
      3. 公测 landing page (lex-design) 邀请码输入是否对 lex-bd 邀请码库
      4. 邀请码运营 (lex-bd) 分发是否走 landing page 注册路径
      5. 4 agent deliverable 无冲突
      6. 4 agent 全部 git commit + push

      输出 W6 总结 + W7 建议 (一句话: 公测 + 企业版律所 BD + 文书 Skill)。
    assigned_to: 'verifier'
    role: 'verify-as-task'
    depends_on:
      - 'w6-lawyer-interview-prep'
      - 'w6-review-score-app'
      - 'w6-beta-landing'
      - 'w6-invite-code-ops'
    max_retries: 1
    timeout_ms: 900000
    hang_alert_after_ms: 900000
