version: 1
plan:
  name: "LexPrime Phase 4 Week 13: W12 C1 follow-up + 7/26 公测启动 + 首批转化"
  max_concurrency: 2
  max_consecutive_failures: 2
  max_cycles: 3
  auto_accept: true
  auto_reject_retries: 1
  verifier_config:
    default_verifiers:
      - verifier
    audit_sample_rate: 0
    strict_mode: false

tasks:
  - id: c1-followup-dashboard
    title: "C1 follow-up 1: templates/views/dashboard/index.html + router.js 'dashboard' viewFileMap 注册"
    prompt: |
      W12 C1 verifier 要求的 2 项 follow-up 之一. dashboard 自动接通需要前端视图.

      必读文档:
      - W12 C1 commit 9dac83c (verify checklist)
      - W11 B2 commit a10aecc (dashboard 4 业务 + 3 创史专属指标 + 7 SQL)
      - W11 B2 commit a99e941 (招募页 router 集成模式)
      - W5 commit (router.js viewFileMap 注册模式)
      - index.html sidebar (W12 C1 已加 'founding' 项)

      W13 C1-followup-dashboard 工作范围:

      1. **dashboard HTML** (templates/views/dashboard/index.html):
         - 7 SQL 实时拉取 (W11 B2 commit a10aecc 已定义):
           * 律师注册数 (本月)
           * 评审完成数 (本月)
           * 合同生成数 (本月)
           * OCR 用量 (本月)
           * 创史招募进度 (本周)
           * 创史群活跃 (本周)
           * 付费转化 (本月)
         - 4 业务指标 + 3 创史专属指标 卡片
         - 折线图 / 柱状图 / 漏斗图 (chart.js CDN)
         - 实时刷新 (setInterval 5min)
         - 移动端响应式

      2. **router.js 'dashboard' viewFileMap 注册** (assets/js/router.js):
         - 复制 founding 注册模式
         - 路由 /dashboard
         - track event dashboard_viewed

      3. **index.html sidebar 集成** (index.html):
         - 工作标签下加 '运营 dashboard' item
         - mdi:chart-line 图标
         - 跟 /founding 风格一致

      4. **回归测试**:
         - playwright 截图 dashboard (PC + 移动端各 1 张)
         - 7 SQL 实测返回 200 + 数据正常 (从 lexprime.db 拉取)
         - ruff 0

      5. **git commit + push** (2 commits: 1 dashboard HTML / 1 router.js + index.html)

      Stop when (dashboard 完成):
      - templates/views/dashboard/index.html 7 指标卡片完整
      - router.js 'dashboard' viewFileMap 注册
      - index.html sidebar 集成
      - playwright 截图 2 张
      - git log 显示 2+ dashboard commit

      严禁:
      - 不要 fabricate 报告 (workspace 存在, 立即开始)
      - 不要 silent fail (每个 commit 跑 ruff 才 push)
    verify_prompt: |
      独立验证 dashboard HTML + router 集成:
      1. templates/views/dashboard/index.html 7 指标卡片完整
      2. router.js 'dashboard' viewFileMap 注册 (curl /dashboard 返回 200)
      3. index.html sidebar '运营 dashboard' item
      4. playwright 截图 dashboard (PC + 移动端)
      5. 7 SQL 实测从 lexprime.db 拉取返回 200 + 数据正常
      6. git log 显示 2+ dashboard commit

      PASS/FAIL 报告.
    assigned_to: lex-coder
    role: produce
    verified_by: verifier
    depends_on: []
    gates: []
    max_retries: 1
    timeout_ms: 1800000
    hang_alert_after_ms: 1500000

  - id: c1-followup-screenshots
    title: "C1 follow-up 2: playwright 截图招募页 PC + 移动端各 1 张"
    prompt: |
      W12 C1 verifier 要求的 2 项 follow-up 之一. 公测前需要视觉验证.

      必读文档:
      - W12 C1 commit 9dac83c (verify checklist)
      - W11 B2 commit a99e941 (招募页 6 模块 + router + track event)
      - W7 / W8 playwright 截图脚本模式 (assets/js/*-screenshots.js)

      W13 C1-followup-screenshots 工作范围:

      1. **playwright 截图** (assets/js/founding-screenshots.js):
         - PC: 1440x900 视口 (桌面标准)
         - 移动端: 375x812 视口 (iPhone 13 mini)
         - 路由 /founding?dev=1
         - 等网络空闲 (networkidle)
         - 等 6 模块可见 (founding-value-prop / countdown / advocates / launch-teaser / join-btn / qrcode)
         - 截图保存:
           * tests/screenshots/founding-pc-{timestamp}.png
           * tests/screenshots/founding-mobile-{timestamp}.png

      2. **dev server 检查**:
         - 确认 python -m http.server 8080 在跑
         - 确认 http://127.0.0.1:8080/?dev=1 可访问
         - 确认 templates/views/founding/index.html 路由正常

      3. **6 模块完整性检查** (Playwright assertions):
         - 创史价值主张 (¥449/年 5 折 + 终身优先客服)
         - 名额倒计时 (剩 80 席 / 总 100 席)
         - 已加入律师头像 (W11 B2 a99e941 track event)
         - 7/26 启动预告
         - 立即加入按钮 (founding_joined track)
         - 创始群二维码 (placeholder 占位)

      4. **git commit + push** (1 commit: founding-screenshots.js + 2 张 PNG)

      Stop when (screenshots 完成):
      - founding-pc-{timestamp}.png 存在
      - founding-mobile-{timestamp}.png 存在
      - 6 模块全部 Playwright assertions pass
      - git log 显示 1+ screenshots commit

      严禁:
      - 不要 mock 截图 (必须真 playwright 跑)
      - 不要 fabricate 报告 (workspace 存在, 立即开始)
    verify_prompt: |
      独立验证 playwright 截图:
      1. founding-pc-{timestamp}.png 存在 + 6 模块可见
      2. founding-mobile-{timestamp}.png 存在 + 移动端响应式
      3. assets/js/founding-screenshots.js 可重跑 (idempotent)
      4. dev server http://127.0.0.1:8080/?dev=1/founding 返回 200
      5. git log 显示 1+ screenshots commit

      PASS/FAIL 报告.
    assigned_to: lex-bd
    role: produce
    verified_by: verifier
    depends_on: []
    gates: []
    max_retries: 1
    timeout_ms: 1200000
    hang_alert_after_ms: 900000

