version: 1
plan:
  name: 'LexPrime Phase 4 Week 3: Auth W3 (TOTP/律师证/邮箱) + Skill 2 合同审查 + 访谈 #3 #4'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 4
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  # Task 1: Auth W3 (lex-coder)
  - id: 'auth-totp-lawyer-license'
    title: 'Auth W3 (TOTP 二步验证 + 律师执业证 OCR + 邮箱验证)'
    prompt: |
      继续 Track A Auth 后端实现 W3 范围, 接管 W2 已交付 (commit 4906f3a) 的 5 个 endpoint, 加 TOTP / 律师执业证 / 邮箱验证。

      必读文档:
      - PRD § 7.5 后端架构: E:\元枢法智前端\yuanxing\PRD.md
      - PRD § 8 数据安全策略 (JWT 加密 + RBAC + 审计日志)
      - Track A 任务书: E:\元枢法智前端\yuanxing\docs\prd\tracks\A-auth.md
      - 你的 agent.md (含防越权约束): C:\Users\42081\.mavis\agents\lex-coder\agent.md

      W2 已交付 (commit 4906f3a):
      - POST /api/auth/register (bcrypt + 律师执业证字段)
      - POST /api/auth/login (JWT 签发)
      - POST /api/auth/refresh (refresh_token 轮转)
      - GET /api/auth/me
      - 失败次数限制 5 次/小时

      W3 工作范围:
      1. **TOTP 二步验证** (POST /api/auth/totp/setup + /api/auth/totp/verify):
         - 用户绑定 TOTP (QR code 生成, 标准 TOTP 算法)
         - 登录后强制 TOTP 验证 (律师执业必备)
         - TOTP backup codes (10 个一次性恢复码)
         - 单元测试 ≥ 3 case (绑定 / 验证 / 重置)
      2. **律师执业证 OCR + AI 初审** (POST /api/auth/lawyer-license/upload):
         - 上传律师执业证图片/PDF
         - PaddleOCR 识别 (复用 Track B 基础设施)
         - 字段提取: 姓名 / 执业证号 / 律所 / 执业领域
         - AI 初审 (跟律师执业证库比对)
         - 审核状态: pending / approved / rejected (人工复审兜底)
         - 单元测试 ≥ 3 case (上传成功 / OCR 失败 / 重复注册)
      3. **邮箱验证** (POST /api/auth/email/verify + /api/auth/email/send):
         - 注册后发验证邮件 (SendGrid / 阿里云)
         - 24h 过期 token
         - 验证成功后 User.email_verified = true
         - 单元测试 ≥ 3 case (发送 / 验证 / 过期)
      4. **失败次数限制强化** (已有基础):
         - 全局 IP + 账户 双维度限流 (5 次/小时)
         - Redis 滑动窗口算法
      5. **单元测试**: 覆盖率 ≥ 80% (新增 endpoint 至少 3 case/个)
      6. **必跑**: ruff 0 error + pytest 100% pass
      7. 所有变更 git commit + push (推荐每完成 1 个里程碑 commit 1 次)

      Stop when:
      - TOTP endpoint 完整 (setup + verify + backup)
      - 律师执业证 OCR + AI 初审 + 人工复审闭环
      - 邮箱验证端到端流程
      - 单元测试覆盖率 ≥ 80% (整体 backend)
      - pytest 100% pass + ruff 0 error
      - git log 显示 3+ W3 commits
    assigned_to: 'lex-coder'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证 Auth W3 交付:
      1. TOTP endpoint 完整 (grep setup + verify + backup)
      2. 律师执业证 OCR + AI 初审 + 人工复审闭环 (上传 → 识别 → 审核 → 通过)
      3. 邮箱验证端到端 (注册 → 发邮件 → 验证 → User.email_verified=true)
      4. pytest --cov 报告: backend 整体覆盖率 ≥ 80%
      5. pytest 100% pass + ruff 0 error
      6. git log 显示 3+ W3 commits (含 TOTP / 律师证 / 邮箱验证)

      PASS/FAIL 报告.
    max_retries: 2

  # Task 2: Track E Skill 2 合同审查启动 (lex-ai)
  - id: 'skill-contract-review-launch'
    title: 'Track E Skill 2 合同审查启动 (manifest + 算法 + UI + 评审)'
    prompt: |
      启动 Track E 第 2 个 Skill: 合同风险审查。

      必读文档:
      - PRD § 3.12.2 各类合同 (生成 + 审查 + 版本比对)
      - docs/prd/04-cross-cutting.md § 5.4 Skill Hub
      - docs/prd/tracks/E-skills.md § Skill 6 (合同风险审查)
      - 附录 16: docs/prd/16-ai-agent-references.md § 16.5.1 (T-REF-02)
      - Skill 1 (类案检索) commit 568d817 + a7182a0 (复用 manifest 模板)

      W3 工作范围 (4 周 W3-W6):
      1. **数据准备** (W3):
         - 至少 50+ 合同模板 (租房 / 借款 / 劳动合同 / 服务合同 / 销售合同 等)
         - 每份合同 5+ 风险标注样本 (致命 / 重大 / 建议)
      2. **Skill manifest + schema** (W3-4):
         - 用 agentskills.io 开放标准 (复用 Skill 1 模板)
         - input_schema: 合同类型 + 合同文本 (上传) + 立场 (甲方/乙方/审查方)
         - output_schema: 风险列表 (致命/重大/建议) + 修改建议 + 谈判策略
         - **界面语言规范**: 禁用"合同必败" / "合同必胜" 等违规表述
      3. **审查算法** (W4-5):
         - LLM 逐条审查 (条款级)
         - 致命风险: 显失公平 / 违法 / 重大遗漏
         - 重大风险: 隐含义务 / 争议管辖不利
         - 建议风险: 表述模糊 / 可优化
         - LLM 返回 JSON 结构 (LexPrime 文书生成器格式)
         - 多 LLM 模型切换 (Qwen2.5-7B 起步 → 72B 升级)
      4. **Skill UI** (W5):
         - 上传合同 (PDF / Word / 图片 OCR)
         - 风险高亮 (致命红 / 重大黄 / 建议蓝)
         - 修改建议侧边栏
         - 谈判策略弹窗
         - 一键导出审查报告 (Word / PDF)
      5. **律师顾问评审** (W6):
         - 至少 3 位律师测试 + 反馈
         - 致命/重大风险识别准确率 ≥ 85%
         - 修改建议实用性 ≥ 70% 律师认可
      6. 单元测试 + E2E
      7. git commit + push (每完成 1 个里程碑 commit 1 次)

      Stop when (W6 末):
      - 50+ 合同模板 + 250+ 风险标注样本入库
      - Skill manifest + input/output schema 完成
      - 审查算法 致命/重大/建议 三级分类准确
      - Skill UI 完成
      - 律师顾问评审通过 (3+ 人, 致命/重大准确率 ≥ 85%)
      - 界面语言规范 0 违规
      - 单元测试 + E2E 0 失败
      - git log 显示 5+ W3-W6 commits
    assigned_to: 'lex-ai'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证 Skill 合同审查 W3-W6 交付:
      1. 50+ 合同模板 + 250+ 风险标注样本入库
      2. skills/contract-review/SKILL.md (agentskills.io 标准) 存在
      3. 致命/重大/建议 三级分类算法 + LLM JSON 输出
      4. Skill UI 渲染 (Playwright 截图: 风险高亮 + 修改建议 + 谈判策略)
      5. 律师顾问评审 3+ 人签字 (docs/skills/contract-review/review.md)
      6. 界面语言规范 0 违规 (grep 禁用词)
      7. 单元测试 + E2E 0 失败
      8. git log 显示 5+ commits

      PASS/FAIL 报告.
    max_retries: 3

  # Task 3: 律师访谈 #3 #4 (lex-pm)
  - id: 'lawyer-interviews-3-4'
    title: '律师访谈 #3 #4 (总指挥线下 + W3 痛点深化)'
    prompt: |
      推进 Track C W3: 律师访谈 #3 (单飞律师) 和 #4 (公司法务)。

      必读文档:
      - PRD § 3 目标用户
      - docs/interviews/outline.md (W1 已就位 17 问)
      - docs/interviews/target-list.md (W1 已就位 10 家: 3 小所 + 3 中所 + 2 单飞 + 2 企业法务)
      - docs/interviews/schedule.md (W2 已排期 #3 #4 时间)
      - docs/interviews/analysis-w1-w2.md (W2 已写 Top 10 痛点)

      W3 工作范围:
      1. **总指挥线下访谈 #3 #4** (由总指挥 42081 实际进行, lex-pm 协助)
      2. **纪要整理**:
         - docs/interviews/interview-03-<name>.md (单飞律师)
         - docs/interviews/interview-04-<corp-name>.md (公司法务)
         - 每份 ≥ 2KB, 含基本信息 + 痛点 Top 5 + 当前工具 + 付费意愿 + 内测意愿
         - **W3 特有**: 邀请律师测试 Skill 1 (类案检索) 设计原型, 收集反馈
      3. **痛点深化分析**:
         - docs/interviews/analysis-w1-w3.md (扩展 W1-W2 分析, 加 #3 #4 数据)
         - 痛点按 "律师画像" 分类 (单飞 vs 小所 vs 中所 vs 企业法务 各自 Top 3)
         - AI 文书 / 类案检索 / 庭审准备 三大功能的真实期待 + 付费意愿
      4. **PRD 反馈**: 访谈中发现的新痛点 / 新需求 → 反馈给 Mavis, 写入 PRD
      5. **约访谈 #5 #6** (W4 排期)
      6. git commit + push

      Stop when:
      - interview-03-*.md + interview-04-*.md 实质内容 ≥ 2KB/份
      - analysis-w1-w3.md 写完 (含 4 类律师画像痛点对比)
      - #5 #6 访谈时间已约
      - git log 显示 W3 commit
    assigned_to: 'lex-pm'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证律师访谈 W3:
      1. interview-03-*.md 存在, ≥ 2KB (单飞律师)
      2. interview-04-*.md 存在, ≥ 2KB (公司法务)
      3. analysis-w1-w3.md 存在, 含 4 类律师画像痛点对比
      4. #5 #6 访谈时间已约 (schedule.md 更新)
      5. git log 显示 W3 commit

      PASS/FAIL 报告.
    max_retries: 1

  # Final: W3 集成验证
  - id: 'w3-integration'
    title: 'W3 集成验证 (Auth W3 + Skill 2 + 访谈 #3 #4 联动)'
    role: 'verify-as-task'
    prompt: |
      验证 W3 三个 Track 集成:
      1. Auth TOTP/律师证/邮箱验证是否影响合同审查 (Skill 2) / 访谈 (Track C)
      2. 访谈 #3 #4 痛点是否影响合同审查算法调整 (律师常用合同类型 vs 律师关心风险)
      3. 三个 agent deliverable 无冲突
      4. 三个 agent 全部 git commit + push

      输出 W3 总结 + W4 建议 (一句话).
    assigned_to: 'verifier'
    depends_on: ['auth-totp-lawyer-license', 'skill-contract-review-launch', 'lawyer-interviews-3-4']
    max_retries: 1