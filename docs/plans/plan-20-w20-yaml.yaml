      必读文档:
      - W19 phase5-react commit 83d4695 (Phase 5.1 React 18 + TS 脚手架 + 3 模块)
      - W17 phase4 commit 14af1a3 (Phase 5 准备 React 18 + TS + Electron + Rust)
      - W11 PRD V5.0 § 9 商业模式 (跨平台客户端)
      - W12 A2 commit 0001f15 (双审前端)
      - W13 dashboard commit c62877c (dashboard 7 指标 + chart.js)
      - Electron 17.x 官方文档 (electron-builder + auto-updater)
      - Phase 5 5 大价值主张 + 6 大模块 (V5.0 维持)

      W20 phase5-electron-pack 工作范围 (10/1 启动, lex-coder):

      1. **10/1 Electron 配置** (yuanxing/phase5-react/electron/):
         - Electron 17.x + electron-builder 配置
         - main.ts (主进程) + preload.ts (预加载) + tsconfig.json
         - package.json scripts: dev / build / dist
         - electron-builder.yml (win/mac/linux 跨平台配置)
         - code signing (Windows + macOS 公证)
         - auto-update (electron-updater)

      2. **10/1 跨平台打包** (.exe / .dmg / .AppImage):
         - Windows: NSIS 安装包 .exe
         - macOS: DMG 安装包 .dmg
         - Linux: AppImage 安装包 .AppImage
         - 集成 W19 phase5-react 3 模块 (登录 + 工作站 + 合同审查)
         - 保留所有现有功能 (5 大价值主张 + 6 大模块)
         - Tailwind 3.x + React Router 6.x + TS 5.x strict

      3. **10/1 安装包测试** (yuanxing/dist/):
         - Windows 安装包启动测试 (5 模块可见)
         - macOS 安装包启动测试 (M1/Intel 兼容)
         - Linux 安装包启动测试 (Ubuntu 22.04)
         - 离线模式 (无网络) 测试
         - auto-update 升级测试

      4. **git commit + push** (1 commit: 10/1 Electron 配置 + 跨平台打包 + 安装包测试)

      Stop when (Phase 5.2 10/1 Electron 打包完成):
      - Electron 17.x + electron-builder 配置 ✅
      - 跨平台安装包 (Windows .exe + macOS .dmg + Linux .AppImage)
      - 集成 W19 phase5-react 3 模块
      - 5 大价值主张 + 6 大模块保留
      - code signing + auto-updater
      - 离线模式 + auto-update 测试
      - git log 显示 1+ Phase 5.2 commit

      严禁:
      - 不要重写功能逻辑 (5 大价值主张 + 6 大模块保持一致)
      - 不要修改 PRD (V5.0 维持, Phase 5.2 是实现层 Electron 打包)
    verify_prompt: |
      独立验证 Phase 5.2 Electron 打包:
      1. Electron 17.x + electron-builder 配置 (package.json + electron-builder.yml)
      2. 跨平台安装包 (Windows .exe + macOS .dmg + Linux .AppImage)
      3. 集成 W19 phase5-react 3 模块 (登录 + 工作站 + 合同审查)
      4. 5 大价值主张 + 6 大模块保留
      5. code signing + auto-updater
      6. 离线模式 + auto-update 测试
      7. git log 显示 1+ Phase 5.2 commit

      PASS/FAIL 报告.
    assigned_to: lex-coder
    role: produce
    verified_by: verifier
    depends_on: []
    gates: []
    max_retries: 1
    timeout_ms: 1800000
    hang_alert_after_ms: 1500000

