      W20 kpi-track-1031 工作范围 (10/1-10/31 实测, Mavis owner):

      1. **dashboard 6 SQL 实测 (10/31 09:00 抓取)** (Mavis owner):
         - 律师注册数 (本月) - paid_converted 事件数
         - 评审完成数 (本月) - review_completed 事件数
         - 合同生成数 (本月) - doc_generated 事件数
         - OCR 用量 (本月) - ocr_used 事件数
         - 创史招募进度 - advocate_promoted 事件数
         - 付费转化 - paid_converted 事件数 (本月)

      2. **100 律师付费验证** (kpi-snapshot-2026-10-31.md):
         - 公式: 30 (8/9) + 50 (8/31) + 20 (9/1-9/30 期间 60 名 × 33% 转化) = 100 律师
         - 实际: paid_converted 事件数 (10/31 09:00 实测)
         - 营收快照: 100 × ¥449 创史 (20) + ¥99/月 (80) = 8980 + 7920 = 16900 元
         - 距 ¥10 万+ ARR: 16900 × 6 = 101400 元 ≈ ¥10 万 ARR ✅ 达标
         - 或 16900 × 12 = 202800 元 ≈ ¥20 万 ARR ✅ 超额

      3. **公测 day 1-66 累计** (kpi-dashboard-726-1031.md):
         - 触达率: 1200 律师 (5 渠道)
         - 邀请码发完率: 1000+ 律师
