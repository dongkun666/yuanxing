  # Task C3: 文书审核工作流 (律师 + AI 双审)
  - id: 'c3-doc-review-workflow'
    title: 'C3 文书审核工作流 (律师 + AI 双审) + 风险标注 + 客户签字确认'
    prompt: |
      C1 落地 4 模板 + C2 一体化, C3 加律师 + AI 双审工作流: 律师输入事实 → AI 生成草稿 → AI 风险标注 → 律师审核修改 → 客户签字确认 → 归档.

      必读文档:
      - C1 commit (W9): 4 端点 + 4 模板
      - C2 commit (W9): 一体化 + ocr_cache + cwd fix
      - W3 Skill 2 SKILL.md § 4 端到端流程 (复用双审模式)
      - PRD V5.0 § 11 法务自检 (合规性)

      W9 C3 工作范围:
      1. **双审状态机**:
         - backend/cases-crawler/core/doc_workflow.py (新文件)
         - 状态: draft (AI 生成) → ai_reviewed (AI 风险标注) → lawyer_reviewed (律师审核) → client_signed (客户签字) → archived (归档)
         - 转换: PATCH /api/doc-gen/{id}/state (state + reason + actor)
      2. **AI 风险标注**:
         - 集成 Skill 2 reviewer (W3 commit 67215d0) 到 doc_workflow
         - 4 文书类型 (起诉/答辩/合同/律师函) 各自风险维度:
           - 起诉状: 案由 / 诉讼请求 / 事实理由 / 法条引用
           - 答辩状: 反驳 / 抗辩 / 反诉 / 证据
           - 合同: 标的 / 价款 / 履行 / 违约 / 管辖
           - 律师函: 事实 / 法律意见 / 要求 / 时限 / 后果
      3. **客户签字确认**:
         - backend/cases-crawler/api/signature_router.py (新文件)
         - POST /api/signature/{doc_id} (上传签字图片 + 律师执业证号 + 时间戳)
         - GET /api/signature/{doc_id} (查询签字状态)
         - 落地: SQLite signatures 表 (doc_id / lawyer_id / signature_image / license_no / signed_at)
      4. **前端双审界面**:
         - templates/views/doc-review/index.html
         - 左侧: 文书 draft + AI 风险标注 (高亮)
         - 右侧: 状态机 + 律师修改记录 + 客户签字上传
         - 集成到 router.js
      5. **回归测试**:
         - pytest 100% (含 doc_workflow + signature_router 2 端点)
         - ruff 0
         - playwright 截图双审界面
      6. **git commit + push** (3 commits: 1 状态机 / 1 签字 / 1 前端)

      Stop when (C3 完成):
      - doc_workflow.py 状态机 5 状态转换跑通
      - signature_router 2 端点 (POST / GET) 落档
      - 4 文书风险标注接入 Skill 2 reviewer
      - templates/views/doc-review/index.html 双审界面 (playwright 截图)
      - pytest 100% + ruff 0
      - git log 显示 3+ C3 commit
    verify_prompt: |
      独立验证 C3 双审工作流:
      1. doc_workflow.py 5 状态 (draft/ai_reviewed/lawyer_reviewed/client_signed/archived) 转换跑通
      2. signature_router POST /api/signature/{doc_id} + GET 2 端点跑通
      3. 4 文书风险标注接入 Skill 2 reviewer, 风险维度完整
      4. templates/views/doc-review/index.html 双审界面 playwright 截图
      5. pytest 100% + ruff 0
      6. git log 显示 3+ C3 commit

      PASS/FAIL 报告.
    assigned_to: 'lex-pm'
    role: 'produce'
    verified_by: 'verifier'
    depends_on: ['c2-skill3-integration']
    gates: []
    max_retries: 2
    timeout_ms: 1800000
    hang_alert_after_ms: 1500000

