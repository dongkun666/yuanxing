  # Task C2: Skill 3 接入 (类案 + 合同 + 文书 一体化) + OCR 缓存 + review.py cwd fix
  - id: 'c2-skill3-integration'
    title: 'C2 Skill 3 接入 (类案+合同+文书 一体化) + OCR 缓存两步拆分 + review.py cwd 依赖修复'
    prompt: |
      C1 落地 4 端点 + 4 模板, C2 把它跟现有 Skill 1 类案 + Skill 2 合同审查 一体化, 律师一个案件跑完三步:
      1. 类案检索 → 2. 合同审查 → 3. 文书生成.
      同时修 D4 producer 报的 2 blockers (W9 backlog 已记录).

      必读文档:
      - C1 commit (W9): 4 端点 + 4 模板
      - W3 Skill 2 合同审查 (commit 67215d0 SKILL.md)
      - W4 类案检索 (LanceDB BGE commit 3edd96f)
      - W8 D4 producer memory: 2 blockers (OCR 缓存两步 + review.py cwd)
      - W8 5cdaabe scripts/w8/ocr_via_venv312.py (OCR 缓存两步已有原型)

      W9 C2 工作范围:
      1. **一体化 API**:
         - POST /api/case/full-workflow (案件 ID → 三步流水线)
         - 流程: 类案检索 (W4) → 合同审查 (W3 Skill 2) → 文书生成 (W9 C1)
         - 输出: case_summary.json (含类案 + 风险 + 文书 draft)
         - 端点模式参考 W7 review_router
      2. **OCR 缓存两步拆分** (D4 blocker #1):
         - backend/cases-crawler/core/ocr_cache.py (新文件)
         - 两步: 1) OCR 识别 (缓存结果) 2) 文本后处理 (PII 脱敏 + 解析)
         - 复用 scripts/w8/ocr_via_venv312.py 原型
      3. **review.py _get_risk_index cwd 依赖修复** (D4 blocker #2):
         - backend/cases-crawler/core/review.py _get_risk_index 改用绝对路径
         - 不依赖 os.chdir, 用 Path(__file__).parent 或 config 路径
         - 加 unit test 验证任意 cwd 都能跑
      4. **回归测试**:
         - pytest 100% (含一体化 + OCR 缓存 + cwd 修复)
         - ruff 0
         - E2E 测试 1 个 case 跑完整流水线
      5. **git commit + push** (3 commits: 1 一体化 / 1 OCR 缓存 / 1 cwd 修复)

      Stop when (C2 完成):
      - POST /api/case/full-workflow 端点跑通, 三步流水线集成
      - ocr_cache.py 两步拆分, OCR 结果缓存可复用
      - review.py _get_risk_index 不依赖 cwd, 任意目录可跑
      - pytest 100% + ruff 0
      - git log 显示 3+ C2 commit
    verify_prompt: |
      独立验证 C2 Skill 3 一体化 + 2 blocker fix:
      1. POST /api/case/full-workflow 端点跑通, 输出 case_summary.json
      2. core/ocr_cache.py 两步拆分, OCR 结果缓存可复用
      3. core/review.py _get_risk_index 不依赖 cwd, 任意目录跑得通
      4. E2E 1 case 跑完整三步流水线 (类案 + 合同 + 文书)
      5. pytest 100% + ruff 0
      6. git log 显示 3+ C2 commit

      PASS/FAIL 报告.
