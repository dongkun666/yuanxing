      1. **11/1 Rust 项目脚手架** (yuanxing/phase5-rust/):
         - Rust 1.83 (LTS stable)
         - tokio 1.43 (async runtime)
         - actix-web 4 (web framework)
         - rusqlite 0.32 (SQLite ORM)
         - serde 1 (serialization)
         - tracing 0.1 (logging)
         - Cargo.toml + Cargo.lock + .cargo/config.toml

      2. **11/1 第一周 4 模块 Rust 版** (lex-coder):
         - 合同审查 (W5 contract_review_router) — actix-web
         - OCR (W5 ocr_upload + W8 PaddleEngine) — actix-web + Python FFI
         - 一体化 (W10 full_workflow_router) — actix-web + tokio
         - Skill 2/3 (W3 contract_review skill + W9 doc_gen) — actix-web + Python FFI
         - 不重写逻辑, 重构为 Rust 模块 (复用 Python 业务逻辑)
         - 保留所有现有功能 (5 大价值主张 + 6 大模块)

      3. **11/1 性能基准测试** (benchmark):
         - 并发 1000: 合同审查 < 50ms (vs Python 250ms, 5x 提升)
         - 并发 100: OCR < 500ms (vs Python 2.5s, 5x 提升)
         - 内存使用 < 100MB (vs Python 500MB, 5x 提升)
         - 启动时间 < 1s (vs Python 5s, 5x 提升)

      4. **git commit + push** (1 commit: 11/1 脚手架 + 4 模块 Rust 版 + 性能基准)

