  # Task D1: Python 3.12 venv312 + PaddleOCR 装包验证
  - id: 'd1-venv312-paddle'
    title: 'D1 Python 3.12 venv312 创建 + paddlepaddle 3.3.1 + paddleocr 3.7 装包 + import 验证'
    prompt: |
      W7 PaddleEngine 代码已 push (commit 0815a2e, 198 行 ocr.py 兼容 PaddleOCR 2.7 + 3.7 API),
      但 venv312 未创建 + paddlepaddle 装不上. 已知技术约束: Python 3.14 + paddlepaddle 3.3.1 wheel
      不兼容, 需 Python 3.12 venv.

      必读文档:
      - W7 PaddleEngine commit 0815a2e (backend/cases-crawler/core/ocr.py)
      - W5 OCR 兜底 commit 3b48ce8 (Tesseract + Mock 双轨, 评审现场已用)
      - plan-07-w7-final-report.md § 4 推 W8 清单
      - W5 final report § 3 残留 4 项 follow-up

      W8 D1 工作范围:
      1. **检查 Python 3.12 是否可用**:
         - py -3.12 --version / python3.12 --version (找系统 Python 3.12.x)
         - 如果没装, 下载 python-3.12.7-amd64.exe 安装 (Windows)
         - 或用 py launcher 安装: py install 3.12
      2. **创建 venv312 隔离环境**:
         - cd backend && py -3.12 -m venv venv312
         - 验证: backend\venv312\Scripts\python.exe --version → Python 3.12.x
      3. **装 paddlepaddle + paddleocr**:
         - backend\venv312\Scripts\python.exe -m pip install --upgrade pip
         - pip install paddlepaddle==3.3.1 -i https://pypi.tuna.tsinghua.edu.cn/simple
         - pip install paddleocr==3.7 -i https://pypi.tuna.tsinghua.edu.cn/simple
      4. **import 验证**:
         - python -c "import paddle; import paddleocr; print('paddle:', paddle.__version__); print('paddleocr:', paddleocr.__version__)"
         - 期望: paddle 3.3.1, paddleocr 3.7
      5. **requirements 文档**:
         - backend/requirements-ocr.txt (W5 已有 requirements.txt, 扩展加 paddlepaddle==3.3.1 + paddleocr==3.7)
         - docs/setup/venv312-setup.md (装包步骤文档, 给后续 agent 复用)
      6. **git commit + push** (1 commit: venv312 setup + docs)

      Stop when (D1 完成):
      - backend\venv312\Scripts\python.exe --version 验证 Python 3.12.x
      - import paddle + paddleocr 成功, 版本 3.3.1 + 3.7
      - backend/requirements-ocr.txt 落档
      - docs/setup/venv312-setup.md 落档
      - git log 显示 1+ D1 commit

      不要做:
      - 不要切 get_ocr_engine() 优先级 (D4 E2E 才切, 现在 Tesseract + Mock 兜底够用)
      - 不要动 ocr.py 代码 (W7 已 commit 完整, 别动)
      - 不要跑 PaddleEngine (没模型, 跑也没意义, D4 跑)
    verify_prompt: |
      独立验证 D1 venv312 装包:
      1. backend\venv312\Scripts\python.exe --version → Python 3.12.x
      2. import paddle + paddleocr 成功, paddle 3.3.1 + paddleocr 3.7
      3. backend/requirements-ocr.txt 落档 (含 paddlepaddle==3.3.1 + paddleocr==3.7)
      4. docs/setup/venv312-setup.md 装包步骤文档完整 (Python 3.12 安装 + venv + 装包 + 验证)
      5. git log 显示 1+ D1 commit

      PASS/FAIL 报告.
    assigned_to: 'lex-ai'
    role: 'produce'
    verified_by: 'verifier'
