  # Task D2: FTS5 jieba 中文分词升级
  - id: 'd2-fts5-jieba'
    title: 'D2 FTS5 jieba tokenizer 升级 (unicode61 → jieba) + 索引重建 + 中文检索命中'
    prompt: |
      W4 遗留 FTS5 unicode61 中文分词缺陷, W5 + W6 + W7 都未修, 推 W8 D2.

      必读文档:
      - W4 LanceDB+BGE commit 3edd96f (FTS5 索引初始建)
      - W4 合同扩量 commit 32fc4c1 (6076 合同, FTS5 索引缺陷暴露)
      - plan-04-w4-final-report.md § 4 follow-up 清单
      - plan-05-w5-final-report.md § 3 follow-up 清单
      - W7 final report § 4 推 W8 清单

      W8 D2 工作范围:
      1. **jieba tokenizer 设计**:
         - backend/cases-crawler/core/fts5_tokenizer.py (新文件)
         - 实现 jieba_tokenize(text: str) → str (空格分隔的中文分词)
         - 兼容 SQLite FTS5 tokenizer 协议 (xTokenize callback)
      2. **FTS5 索引重建**:
         - backend/cases-crawler/scripts/rebuild_fts5_index.py (新脚本)
         - DROP TABLE IF EXISTS contracts_fts; CREATE VIRTUAL TABLE contracts_fts USING fts5(content, tokenize='jieba');
         - 从 6076 contracts 表 INSERT INTO contracts_fts SELECT content
         - 落地: docs/setup/fts5-rebuild.md
      3. **中文检索验证**:
         - "房屋租赁合同" / "劳动合同" / "股权转让" 三个关键词, 期望 > 0 hits
         - 验证脚本: backend/cases-crawler/scripts/verify_fts5_zh.py
         - 落地: docs/qa/fts5-zh-hit-w8.md (检索日志)
      4. **回归测试**:
         - backend/cases-crawler/tests/test_fts5_jieba.py (新测试文件, 5+ test)
         - pytest 100% (含 D1 venv312 jieba 装包)
         - ruff 0
      5. **git commit + push** (2 commits: 1 tokenizer+rebuild / 1 测试+QA)

      Stop when (D2 完成):
      - jieba_tokenize 函数跑通, 中文分词 > 0
      - contracts_fts 索引重建完成, 6076 合同 100% 入库
      - "房屋租赁合同" 中文检索 > 0 hits (unicode61 之前 0 hits)
      - 5+ pytest test + ruff 0
      - git log 显示 2+ D2 commit

      不要做:
      - 不要动 LanceDB 索引 (BGE 向量检索独立, 跟 FTS5 是双轨)
      - 不要升级 SQLite 版本 (jieba tokenizer 是 Python 层, 跟 SQLite 版本无关)
    verify_prompt: |
      独立验证 D2 FTS5 jieba:
      1. backend/cases-crawler/core/fts5_tokenizer.py 落档, jieba_tokenize 函数跑通
      2. backend/cases-crawler/scripts/rebuild_fts5_index.py 落档, 跑成功
      3. SQLite contracts_fts 索引重建, 6076 合同 100% 入库
      4. "房屋租赁合同" / "劳动合同" / "股权转让" 三个关键词, 每个 > 0 hits (unicode61 之前 0)
      5. backend/cases-crawler/tests/test_fts5_jieba.py 5+ test, pytest 100% + ruff 0
      6. docs/qa/fts5-zh-hit-w8.md 检索日志完整
      7. git log 显示 2+ D2 commit

      PASS/FAIL 报告.
