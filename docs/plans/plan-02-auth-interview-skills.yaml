version: 1
plan:
  name: 'LexPrime Phase 4 Week 2: Auth 续 + 律师访谈 #2 + Skill 类案启动'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 5
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  # Task 1: Auth 注册/登录/Token (lex-coder, W2-3 内交付)
  - id: 'auth-register-login'
    title: 'Auth 注册 / 登录 / Token 刷新 (Week 2-3)'
    prompt: |
      继续 Track A Auth 后端实现 W2-W3 范围。

      必读文档:
      - PRD § 7.5 后端架构: E:\元枢法智前端\yuanxing\PRD.md
      - PRD § 8 数据安全策略
      - Track A 任务书: E:\元枢法智前端\yuanxing\docs\prd\tracks\A-auth.md
      - 你的 agent.md (含防越权约束): C:\Users\42081\.mavis\agents\lex-coder\agent.md

      W1 已交付 (7c58057):
      - backend/cases-crawler/auth/ 4 表 (users/profile/tokens/otp) + FastAPI skeleton
      - data/lexprime.db 中 auth_* schema 滞后, W2 启动前必须先 DROP + 重建

      W2-W3 工作范围:
      1. **数据库 schema 修复**: DROP + 重建 auth_* 4 表 (执行 lex-coder W1 备注里的 SQL)
      2. **注册 endpoint** (POST /api/auth/register):
         - bcrypt 密码哈希
         - 邮箱验证 (发邮件)
         - 律师执业证号字段
         - 重复注册检测
      3. **登录 endpoint** (POST /api/auth/login):
         - bcrypt 验证
         - JWT 签发 (access 15min + refresh 7d)
         - 失败次数限制 (5 次/小时)
      4. **Token 刷新 endpoint** (POST /api/auth/refresh):
         - 验证 refresh_token 签名
         - 签发新 access_token
         - refresh_token 轮转 (single-use)
      5. **当前用户 endpoint** (GET /api/auth/me):
         - 验证 JWT
         - 返回 User profile
      6. **单元测试**: 覆盖率 ≥ 80% (每个 endpoint 至少 3 个 case: 成功/失败/边界)
      7. **必跑**: ruff 0 error + pytest 100% pass
      8. 所有变更 git commit + push

      Stop when:
      - 5 个 endpoint 全部实现 + curl 验证通过
      - 单元测试覆盖率 ≥ 80%
      - pytest 100% pass
      - ruff 0 error
      - git log 显示 W2 commit
    assigned_to: 'lex-coder'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证 Auth W2-W3 交付:
      1. backend/cases-crawler/auth/routers/ 5 个 endpoint 文件存在 (register/login/refresh/me)
      2. curl 测试: register → login → access_token → me 全流程通过
      3. 密码用 bcrypt 哈希 (grep 验证)
      4. JWT 用 HS256 或 RS256 (grep 验证)
      5. 单元测试覆盖率 ≥ 80% (pytest --cov 报告)
      6. pytest 跑通 (自己跑一次)
      7. git log 显示 W2 commit

      PASS/FAIL 报告.
    max_retries: 2

  # Task 2: 律师访谈 #2 (lex-pm, W2 内交付)
  - id: 'lawyer-interview-2'
    title: '律师访谈 #2 (总指挥线下 + lex-pm 纪要模板)'
    prompt: |
      启动 Track C W2: 律师访谈 #2。

      必读文档:
      - PRD § 3 目标用户
      - docs/interviews/outline.md (W1 已就位, 17 问)
      - docs/interviews/target-list.md (W1 已就位, 10 家)
      - docs/interviews/schedule.md (W1 已就位, 时间排期)

      W2 工作范围:
      1. **总指挥线下访谈 #2** (由总指挥 42081 实际进行, lex-pm 协助)
      2. **纪要整理**: docs/interviews/interview-02-<name>.md
         - 律所基本信息
         - 痛点 (按严重度排序 Top 5, **与 W1 访谈对比** 找共性)
         - 当前工具
         - 付费意愿
         - 内测意愿
         - **W2 特有**: 对 LexPrime MVP 演示 (design-system.html 工作台原型) 的反馈
      3. **痛点共性分析**: docs/interviews/analysis-w1-w2.md
         - W1 + W2 合并 Top 10 痛点
         - 律师对 AI 文书/类案检索/庭审准备 三大功能的真实期待
      4. **约访谈 #3-#4** (排时间)
      5. **PRD 反馈**: 访谈中发现的新痛点 → 反馈给 Mavis, 写入 PRD
      6. git commit + push

      Stop when:
      - interview-02-*.md 实质内容 ≥ 2KB
      - analysis-w1-w2.md 写完 (Top 10 痛点)
      - #3-#4 访谈时间已约
      - git log 显示 W2 commit
    assigned_to: 'lex-pm'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证律师访谈 W2:
      1. docs/interviews/interview-02-*.md 存在, ≥ 2KB
      2. docs/interviews/analysis-w1-w2.md 存在, 含 Top 10 痛点
      3. #3-#4 访谈时间已约 (schedule.md 更新)
      4. git log 显示 W2 commit

      PASS/FAIL 报告.
    max_retries: 1

  # Task 3: Skill 类案启动 (lex-ai, W2-W8 内交付)
  - id: 'skill-caselaw-launch'
    title: 'Skill 类案检索启动 (类案数据 + Skill 1 草稿 + 检索算法)'
    prompt: |
      启动 Track E Skill 第 1 个: 类案检索与裁判参考。

      必读文档:
      - PRD § 4.7 第 3 步 证据目录 + § 5.4 Skill Hub
      - docs/prd/04-cross-cutting.md § 5.7 类案大数据
      - docs/prd/tracks/E-skills.md
      - docs/prd/16-ai-agent-references.md § 16.5.1 (T-REF-02/17/18/22/25)

      W2-W8 工作范围 (8 周):
      1. **类案数据准备** (W2-3):
         - Phase 1 已建 cncases + 4 公开源基础设施
         - 当前 SQLite (lexprime.db) 有 100 判例 (基础)
         - 至少准备 1000+ 判例 + 6000+ 法规 (向量化入库)
      2. **Skill 1 (类案检索) 草稿** (W4-5):
         - Skill manifest (用 agentskills.io 标准)
         - input_schema: 案由 + 关键事实 + 审理法院 + 法官 + 年份
         - output_schema: 检索结果 + 统计参考 (支持率/金额/争议焦点)
         - **界面语言规范 (硬约束)**: 禁用"胜诉率" / "案件预测", 必须严格中立
      3. **检索算法** (W5-6):
         - 向量检索 (LanceDB 本地 / Milvus 云端)
         - Token ≤ 8000 限制 (超出自动压缩, T-REF-25)
         - 多维度过滤 (案由 + 地域 + 时段)
      4. **Skill UI** (W7):
         - 与 lex-design 协作, 检索输入 + 结果展示
         - 红黄绿灯 + 统计图表 (柱状图/箱线图)
         - 强制底部免责声明: "以上数据仅为已公开裁判文书的统计结果, 不代表对本案结果的任何预测或判断。"
      5. **律师顾问评审** (W8):
         - 至少 3 位律师测试 + 反馈
         - 准确率 ≥ 80% (律师抽样验证)
      6. 单元测试 + E2E
      7. git commit + push (每完成 1 个里程碑 commit 1 次)

      Stop when (W8 末):
      - 类案数据 ≥ 1000 判例 + 6000 法规入库
      - Skill 1 manifest + input/output schema 完成
      - 检索算法 P95 < 1s
      - Skill UI 完成 (跟 lex-design 协作)
      - 律师顾问评审通过 (3+ 人, 准确率 ≥ 80%)
      - 界面语言规范 0 违规
      - 单元测试 + E2E 0 失败
      - git log 显示 5+ W2-W8 commits
    assigned_to: 'lex-ai'
    verified_by: 'verifier'
    verify_prompt: |
      独立验证 Skill 类案 W2-W8 交付:
      1. LanceDB / Milvus 中类案数据 ≥ 1000 + 法规 ≥ 6000
      2. skills/caselaw/SKILL.md (agentskills.io 标准) 存在
      3. 检索 P95 < 1s (自己跑 benchmark)
      4. Skill UI 渲染 (Playwright 截图)
      5. 律师顾问评审 3+ 人签字 (docs/skills/caselaw/review.md)
      6. 界面语言规范 0 违规 (grep 禁用词)
      7. 单元测试 + E2E 0 失败
      8. git log 显示 5+ commits

      PASS/FAIL 报告.
    max_retries: 3

  # Final: W2 集成验证
  - id: 'w2-integration'
    title: 'W2 集成验证 (Auth + Interview + Skill 三 Track 联动)'
    role: 'verify-as-task'
    prompt: |
      验证 W2 三个 Track 集成:
      1. Auth 注册/登录是否影响类案检索 / 律师访谈 (如 token 过期影响)
      2. 律师访谈 #2 痛点是否影响 Skill 1 (新痛点 → Skill 调整)
      3. 三个 agent deliverable 无冲突
      4. 三个 agent 全部 git commit + push

      输出 W2 总结 + W3 建议 (一句话).
    assigned_to: 'verifier'
    depends_on: ['auth-register-login', 'lawyer-interview-2', 'skill-caselaw-launch']
    max_retries: 1