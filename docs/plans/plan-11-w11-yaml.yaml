      7/26 启动仪式当天的执行落地.

      必读文档:
      - W10 B1 commit 0df6a74 + ce98f64 (启动仪式流程 + 物料清单)
      - W6 beta-launch-event.md (60min 流程原始版)
      - docs/marketing/dashboard-w6.md + dashboard-w11.md
      - PRD V5.0 § 9+§ 10

      W11 C1 工作范围:
      1. **执行运行手册** (run-book):
         - docs/marketing/launch-runbook-2026-07-26.md
         - 主持人 (总指挥) + 嘉宾流程 + 物料检查清单 + 应急联系人
         - 时间节点: 14:00-17:00 启动仪式 + 17:00-19:00 茶歇交流 + 19:00 收尾
         - 应急: 直播卡顿/律师缺席/物料缺失 备案
      2. **5 律师首批付费触发**:
         - docs/marketing/first-paid-triggers.md
         - 5 律师 (L1 单飞 + L2 小所合伙 + L3 小所婚姻 + L4 中所合伙 + L5 企业法务) 30 天试用到期日 (2026-07-29)
         - 提前 3 天 (2026-07-23) 发付费转化邮件 + 微信
         - 转化路径: trial_expired → 微信跟进 → ¥449/年 创史体验官 或 ¥99/月 个人版
         - 跟踪指标: 首批付费转化率 (5 / 30 = 16.7% 基准)
      3. **招募页 + dashboard 上线**:
         - templates/views/founding/index.html 上线 (7/26 09:00)
         - dashboard-w11.md 自动 dashboard (实时拉取 prd_backlog 数据)
         - 集成到 sidebar (W6 landing 风格)
      4. **首批 8 月底转化目标**:
         - 30 名律师付费 (首批 5 + 7/26-8/9 期间 25)
         - 50 名律师付费 (8/31 截止)
         - 月 ¥5 万+ ARR
      5. **PRD 同步 + git commit** (1 commit: 执行 runbook + 转化触发脚本)

