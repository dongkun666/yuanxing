      - docs/marketing/launch-runbook-2026-07-26.md 完整 (主持人 + 嘉宾 + 物料 + 应急)
      - docs/marketing/first-paid-triggers.md 完整 (5 律师转化触发脚本)
      - templates/views/founding/index.html 上线 (7/26 09:00)
      - dashboard-w11.md 自动 dashboard 接通
      - PRD V5.0 § 10 成功指标加 8 月底转化目标
      - git log 显示 1+ C1 commit

      不要做:
